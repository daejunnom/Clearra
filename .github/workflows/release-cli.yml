name: Publish Product Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: canonical-release-${{ github.sha }}
  cancel-in-progress: false

env:
  CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
  CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      accepted_run_id: ${{ steps.accepted_run.outputs.accepted_run_id }}
      accepted_run_attempt: ${{ steps.accepted_run.outputs.accepted_run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require exact main and zero prior canonical success
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
            echo 'canonical release acceptance forbids workflow reruns; dispatch a fresh run after a failure' >&2
            exit 2
          fi
          if [[ "$GITHUB_REF" != 'refs/heads/main' || "$GITHUB_REF_TYPE" != 'branch' ]]; then
            echo 'canonical release acceptance must be dispatched from main' >&2
            exit 2
          fi
          git fetch --no-tags --depth=1 origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo 'canonical release acceptance must target the exact current main commit' >&2
            exit 2
          fi
          node scripts/release/canonical-acceptance-run.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --require zero
      - name: Prepare approved legacy v0.7.4 annotated-tag fixture
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin refs/tags/v0.7.4:refs/tags/v0.7.4
          tag_object="$(git rev-parse --verify 'refs/tags/v0.7.4^{tag}')"
          peeled_commit="$(git rev-parse --verify 'refs/tags/v0.7.4^{commit}')"
          if [[ "$tag_object" != 'a95973dbc1c3c1919478328d12e4d25ddaedea71' ]]; then
            echo 'approved legacy tag ref does not resolve to the fixed annotated-tag object' >&2
            exit 2
          fi
          if [[ "$peeled_commit" != '0438d85f90b47c4ce89835f6a6d665a0415aa25a' ]]; then
            echo 'approved legacy annotated tag does not peel to the fixed source commit' >&2
            exit 2
          fi
      - name: Validate independent release regressions with bounded workers
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: node scripts/tools/run-release-regression-tests.mjs
      - name: Archive the exact accepted source on Linux
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          archive_path="$RUNNER_TEMP/clearra-exact-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          archive_owned=false
          if [[ -e "$archive_path" ]]; then
            echo 'exact source archive output already exists' >&2
            exit 2
          fi
          trap 'if [[ "$archive_owned" == true ]]; then rm -f -- "$archive_path"; fi' EXIT
          node scripts/release/create-exact-source-archive.mjs \
            --source-commit "$GITHUB_SHA" \
            --output "$archive_path"
          archive_owned=true
          test -s "$archive_path"
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(awk '/^\[workspace.package\]/{owner=1; next} owner && /^version = /{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo 'workspace package version is missing' >&2
            exit 2
          fi
          if [[ "$GITHUB_REF_TYPE" == 'tag' && "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'tag %s does not match workspace version %s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 2
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate every product version and changelog surface
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ""
        shell: bash
        run: node scripts/release/validate-release-metadata.mjs
      - name: Require the upstream drift audit authority
        if: github.event_name == 'workflow_dispatch'
        run: node --test scripts/tools/audit-upstream-drift.test.mjs
      - name: Bind the exact canonical acceptance run
        id: accepted_run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo "accepted_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "accepted_run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF_TYPE" != 'tag' ]]; then
            echo 'release workflow only accepts canonical dispatch or tag publication events' >&2
            exit 2
          fi
          git fetch --no-tags --depth=1 origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo 'release tag must point at the exact current main commit' >&2
            exit 2
          fi
          node scripts/release/canonical-acceptance-run.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --require one \
            --format github-output >> "$GITHUB_OUTPUT"

  ctk3:
    if: github.event_name == 'workflow_dispatch'
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript workspace
        run: npm ci --ignore-scripts
      - name: Validate accepted CTK3 artifact contract
        run: node --test scripts/tools/accepted-ctk3-dist.test.mjs
      - name: Build and test CTK3 once
        run: npm test --workspace ctk3
      - name: Seal the accepted CTK3 distribution
        run: node scripts/tools/accepted-ctk3-dist.mjs --seal packages/ctk3/dist --source-commit "$CLEARRA_SOURCE_COMMIT" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload accepted CTK3 distribution
        uses: actions/upload-artifact@v4
        with:
          name: ctk3-accepted-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: packages/ctk3/dist
          if-no-files-found: error

  linux-cli:
    if: github.event_name == 'workflow_dispatch'
    needs: [metadata, ctk3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download accepted CTK3 distribution
        uses: actions/download-artifact@v4
        with:
          name: ctk3-accepted-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: packages/ctk3/dist
      - name: Install JavaScript workspace
        run: npm ci --ignore-scripts
      - name: Verify accepted CTK3 distribution
        run: node scripts/tools/accepted-ctk3-dist.mjs --verify packages/ctk3/dist --expected-source-commit "$CLEARRA_SOURCE_COMMIT" --expected-run-id "$GITHUB_RUN_ID" --expected-run-attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/clearra-release/cargo-target
          key: product-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build standalone WASM CPU CLI
        env:
          CLEARRA_RELEASE_BUILD_ROOT: ${{ runner.temp }}/clearra-release
        run: bash scripts/tools/package-release-cli.sh dist "${{ needs.metadata.outputs.version }}"
      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearra-linux-cli-v${{ needs.metadata.outputs.version }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: dist/*
          if-no-files-found: error

  discord-bot:
    if: github.event_name == 'workflow_dispatch'
    needs: [metadata, ctk3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Download accepted CTK3 distribution
        uses: actions/download-artifact@v4
        with:
          name: ctk3-accepted-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: packages/ctk3/dist
      - name: Install JavaScript workspace
        run: npm ci --ignore-scripts
      - name: Verify accepted CTK3 distribution
        run: node scripts/tools/accepted-ctk3-dist.mjs --verify packages/ctk3/dist --expected-source-commit "$CLEARRA_SOURCE_COMMIT" --expected-run-id "$GITHUB_RUN_ID" --expected-run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Verify Clearrabot contracts
        run: npm run test:built --workspace @clearra/discord-bot
      - name: Require the product capability and alias parser authority
        if: github.event_name == 'workflow_dispatch'
        run: node --test tests/contracts/product_capability_registry.test.mjs

  release-acceptance-foundation-no-product-debt:
    if: github.event_name == 'workflow_dispatch'
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Archive the exact accepted source on Windows
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP ("clearra-exact-source-" + [Guid]::NewGuid().ToString("N") + ".tar.gz")
          $archiveOwned = $false
          try {
            node scripts/release/create-exact-source-archive.mjs `
              --source-commit $env:GITHUB_SHA `
              --output $archivePath
            if ($LASTEXITCODE -ne 0) { throw "exact source archive failed" }
            $archiveOwned = $true
            $archive = Get-Item -LiteralPath $archivePath
            if (-not $archive.Length) { throw "exact source archive is empty" }
          } finally {
            if ($archiveOwned -and (Test-Path -LiteralPath $archivePath)) {
              Remove-Item -LiteralPath $archivePath -Force
            }
          }
      - id: release_toolchain_cache
        name: Restore canonical release toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen.exe
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/Clearra/build
          key: release-acceptance-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-
      - name: Install JavaScript workspace
        run: npm ci --ignore-scripts
      - name: Verify canonical ReleaseAcceptance shard mapping
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test_release_acceptance_shards.ps1
      - name: Run canonical release acceptance NoProductDebt leaf
        run: powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard FoundationNoProductDebt -ExecutionSurface Trusted
      - name: Seal canonical release acceptance NoProductDebt leaf
        shell: pwsh
        run: |
          node scripts/release/canonical-acceptance-evidence.mjs shard `
            --source-commit $env:GITHUB_SHA `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --shard foundation-no-product-debt `
            --output release-shard-evidence/clearra-release-acceptance-foundation-no-product-debt-shard.v1.json
          if ($LASTEXITCODE -ne 0) { throw "NoProductDebt leaf evidence failed" }
      - name: Upload canonical release acceptance NoProductDebt leaf
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-foundation-no-product-debt-shard-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: release-shard-evidence/clearra-release-acceptance-foundation-no-product-debt-shard.v1.json
          if-no-files-found: error

  release-acceptance-foundation-adversarial-correctness:
    if: github.event_name == 'workflow_dispatch'
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release_toolchain_cache
        name: Restore canonical release toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen.exe
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/Clearra/build
          key: release-acceptance-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-
      - name: Run canonical release acceptance AdversarialCorrectness leaf
        run: powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard FoundationAdversarialCorrectness -ExecutionSurface Trusted
      - name: Seal canonical release acceptance AdversarialCorrectness leaf
        shell: pwsh
        run: |
          node scripts/release/canonical-acceptance-evidence.mjs shard `
            --source-commit $env:GITHUB_SHA `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --shard foundation-adversarial-correctness `
            --output release-shard-evidence/clearra-release-acceptance-foundation-adversarial-correctness-shard.v1.json
          if ($LASTEXITCODE -ne 0) { throw "AdversarialCorrectness leaf evidence failed" }
      - name: Upload canonical release acceptance AdversarialCorrectness leaf
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-foundation-adversarial-correctness-shard-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: release-shard-evidence/clearra-release-acceptance-foundation-adversarial-correctness-shard.v1.json
          if-no-files-found: error

  release-acceptance-foundation-desktop-host:
    if: github.event_name == 'workflow_dispatch'
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release_toolchain_cache
        name: Restore canonical release toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen.exe
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/Clearra/build
          key: release-acceptance-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-
      - name: Install JavaScript workspace
        run: npm ci --ignore-scripts
      - name: Run canonical release acceptance DesktopHost leaf
        run: powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard FoundationDesktopHost -ExecutionSurface Trusted
      - name: Seal canonical release acceptance DesktopHost leaf
        shell: pwsh
        run: |
          node scripts/release/canonical-acceptance-evidence.mjs shard `
            --source-commit $env:GITHUB_SHA `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --shard foundation-desktop-host `
            --output release-shard-evidence/clearra-release-acceptance-foundation-desktop-host-shard.v1.json
          if ($LASTEXITCODE -ne 0) { throw "DesktopHost leaf evidence failed" }
      - name: Upload canonical release acceptance DesktopHost leaf
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-foundation-desktop-host-shard-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: release-shard-evidence/clearra-release-acceptance-foundation-desktop-host-shard.v1.json
          if-no-files-found: error

  release-acceptance-sanitizer:
    if: github.event_name == 'workflow_dispatch'
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release_toolchain_cache
        name: Restore sanitizer C build cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/Clearra/build
          key: release-acceptance-sanitizer-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-sanitizer-${{ runner.os }}-
      - name: Run canonical release acceptance sanitizer shard
        run: powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard Sanitizer -ExecutionSurface Trusted
      - name: Seal canonical release acceptance sanitizer shard
        shell: pwsh
        run: |
          node scripts/release/canonical-acceptance-evidence.mjs shard `
            --source-commit $env:GITHUB_SHA `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --shard sanitizer `
            --output release-shard-evidence/clearra-release-acceptance-sanitizer-shard.v1.json
          if ($LASTEXITCODE -ne 0) { throw "sanitizer shard evidence failed" }
      - name: Upload canonical release acceptance sanitizer shard
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-sanitizer-shard-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: release-shard-evidence/clearra-release-acceptance-sanitizer-shard.v1.json
          if-no-files-found: error

  release-acceptance-rust:
    if: github.event_name == 'workflow_dispatch'
    needs: [metadata, ctk3]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download accepted CTK3 distribution
        uses: actions/download-artifact@v4
        with:
          name: ctk3-accepted-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: packages/ctk3/dist
      - id: release_toolchain_cache
        name: Restore canonical release toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen.exe
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/Clearra/build
          key: release-acceptance-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-
      - name: Install JavaScript workspace
        run: npm ci --ignore-scripts
      - name: Run canonical release acceptance rust shard
        env:
          # Match the candidate debug harness, not the release runtime stack.
          # Explicit small-stack tests retain their own thread stack_size limits.
          RUST_MIN_STACK: "16777216"
          CLEARRA_ACCEPTED_CTK3_DIST: ${{ github.workspace }}/packages/ctk3/dist
          CLEARRA_ACCEPTED_RUN_ID: ${{ github.run_id }}
          CLEARRA_ACCEPTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard Rust -ExecutionSurface Trusted
      - name: Seal canonical release acceptance rust shard
        shell: pwsh
        run: |
          node scripts/release/canonical-acceptance-evidence.mjs shard `
            --source-commit $env:GITHUB_SHA `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --shard rust `
            --output release-shard-evidence/clearra-release-acceptance-rust-shard.v1.json
          if ($LASTEXITCODE -ne 0) { throw "rust shard evidence failed" }
      - name: Upload canonical release acceptance rust shard
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-rust-shard-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: release-shard-evidence/clearra-release-acceptance-rust-shard.v1.json
          if-no-files-found: error

  release-acceptance-wasm-build:
    if: github.event_name == 'workflow_dispatch'
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release_toolchain_cache
        name: Restore canonical release toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen.exe
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/Clearra/build
          key: release-acceptance-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-
      - name: Prepare acceptance toolchains
        shell: powershell
        run: |
          rustup target add wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tool = Get-Command wasm-bindgen -ErrorAction SilentlyContinue
          if ($null -eq $tool -or (& wasm-bindgen --version) -ne 'wasm-bindgen 0.2.126') {
            cargo install wasm-bindgen-cli --version 0.2.126 --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run verified WASM build producer
        env:
          CLEARRA_ACCEPTED_WASM_OUTPUT_DIR: ${{ runner.temp }}\clearra-accepted-wasm
          CLEARRA_ACCEPTED_RUN_ID: ${{ github.run_id }}
          CLEARRA_ACCEPTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: powershell -NoProfile -File scripts/clearra.ps1 -Task WasmBuildProducer -ExecutionSurface Trusted
      - name: Upload accepted WASM build
        uses: actions/upload-artifact@v4
        with:
          name: accepted-wasm-build-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: ${{ runner.temp }}/clearra-accepted-wasm
          if-no-files-found: error

  release-acceptance-pages:
    if: github.event_name == 'workflow_dispatch'
    needs: [metadata, release-acceptance-wasm-build]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download accepted WASM build
        uses: actions/download-artifact@v4
        with:
          name: accepted-wasm-build-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: ${{ runner.temp }}/clearra-accepted-wasm
      - name: Install JavaScript workspace
        run: npm ci --ignore-scripts
      - name: Run canonical release acceptance Pages shard
        env:
          CLEARRA_WEB_BASE_PATH: /${{ github.event.repository.name }}
          CLEARRA_ACCEPTED_WASM_DIR: ${{ runner.temp }}\clearra-accepted-wasm
          CLEARRA_ACCEPTED_RUN_ID: ${{ github.run_id }}
          CLEARRA_ACCEPTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard Pages -ExecutionSurface Trusted
      - name: Stamp and verify the accepted Pages build
        shell: pwsh
        run: |
          node scripts/release/accepted-pages-build.mjs `
            --stamp apps/clearra-web/build `
            --source-commit $env:CLEARRA_SOURCE_COMMIT `
            --accepted-run-id $env:GITHUB_RUN_ID `
            --accepted-run-attempt $env:GITHUB_RUN_ATTEMPT `
            --base-path "/${{ github.event.repository.name }}" `
            --version "${{ needs.metadata.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "accepted Pages build stamp failed" }
          node scripts/release/accepted-pages-build.mjs `
            --verify apps/clearra-web/build `
            --source-commit $env:CLEARRA_SOURCE_COMMIT `
            --accepted-run-id $env:GITHUB_RUN_ID `
            --accepted-run-attempt $env:GITHUB_RUN_ATTEMPT `
            --base-path "/${{ github.event.repository.name }}" `
            --version "${{ needs.metadata.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "accepted Pages build verification failed" }
      - name: Seal canonical release acceptance Pages shard
        shell: pwsh
        run: |
          node scripts/release/canonical-acceptance-evidence.mjs shard `
            --source-commit $env:GITHUB_SHA `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --shard pages `
            --accepted-wasm "$env:RUNNER_TEMP\clearra-accepted-wasm" `
            --output release-shard-evidence/clearra-release-acceptance-pages-shard.v1.json
          if ($LASTEXITCODE -ne 0) { throw "Pages shard evidence failed" }
      - name: Upload accepted Pages build
        uses: actions/upload-artifact@v4
        with:
          name: accepted-pages-build-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: apps/clearra-web/build
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload canonical release acceptance Pages shard
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-pages-shard-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: release-shard-evidence/clearra-release-acceptance-pages-shard.v1.json
          if-no-files-found: error
  release-acceptance:
    if: github.event_name == 'workflow_dispatch'
    needs:
      [metadata, release-acceptance-foundation-no-product-debt, release-acceptance-foundation-adversarial-correctness, release-acceptance-foundation-desktop-host, release-acceptance-sanitizer, release-acceptance-rust, release-acceptance-pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download all canonical release acceptance shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: release-acceptance-*-shard-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: release-shard-evidence
          merge-multiple: true
      - name: Produce canonical release gate evidence
        shell: bash
        run: |
          node scripts/release/canonical-acceptance-evidence.mjs gate \
            --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --shards release-shard-evidence \
            --output release-gate-evidence
      - name: Upload canonical release gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: release-gate-evidence
          if-no-files-found: error

  windows-cli:
    if: github.event_name == 'workflow_dispatch'
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/clearra-release/cargo-target
          key: product-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            product-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-
            product-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}
      - name: Configure external release target
        shell: pwsh
        run: |
          $targetDir = Join-Path $env:RUNNER_TEMP 'clearra-release\cargo-target'
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV
      - name: Build and exercise standalone WASM CPU CLI
        shell: pwsh
        run: |
          cargo build --locked --release --package clearra-cli --features wasm-cpu-runtime,webgpu-search
          $builtCli = Join-Path $env:CARGO_TARGET_DIR 'release\clearra.exe'
          if (-not (Test-Path -LiteralPath $builtCli -PathType Leaf)) {
            throw "Clearra CLI executable was not produced: $builtCli"
          }
          $version = '${{ needs.metadata.outputs.version }}'
          $artifactDir = Join-Path $PWD.Path 'dist'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $cli = Join-Path $artifactDir "Clearra-CLI-v$version-windows-x86_64.exe"
          Copy-Item -LiteralPath $builtCli -Destination $cli -Force
          function Invoke-ClearraJsonSmoke {
            param(
              [Parameter(Mandatory)] [string] $Name,
              [Parameter(Mandatory)] [string[]] $CommandArguments,
              [hashtable] $ExpectedSummary = @{},
              [hashtable] $ExpectedResourceReport = @{},
              [string] $ExpectedKind,
              [string] $ExpectedCommandKind,
              [Nullable[bool]] $ExpectedTilingFamilyComplete,
              [string] $ExpectedTilingFamilyIncompleteReason
            )
            $jsonLines = & $cli @CommandArguments
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) { throw "Clearra CLI $Name smoke failed: $exitCode" }
            $json = $jsonLines -join "`n"
            try {
              $parsed = $json | ConvertFrom-Json -ErrorAction Stop
            } catch {
              throw "Clearra CLI $Name smoke returned invalid JSON"
            }
            if ($null -eq $parsed) { throw "Clearra CLI $Name smoke returned empty JSON" }
            $identity = $parsed.runtime_identity
            if ($null -eq $identity -or
                $identity.source_commit -ne $env:GITHUB_SHA -or
                $identity.engine_build_id -ne $env:GITHUB_SHA -or
                $identity.contract_schema_version -ne 'clearra.search.contract.v2' -or
                $identity.supply_semantics_id -ne 'clearra.supply.projected-terminal-lookahead.v1' -or
                $identity.artifact_schema_version -ne 'clearra.solution-data.v1') {
              throw "Clearra CLI $Name smoke returned a mismatched product build identity"
            }
            if ($ExpectedKind -and $parsed.kind -ne $ExpectedKind) {
              throw "Clearra CLI $Name smoke expected kind=$ExpectedKind, received $($parsed.kind)"
            }
            if ($ExpectedCommandKind -and
                $parsed.contract.command.kind -ne $ExpectedCommandKind) {
              throw "Clearra CLI $Name smoke expected contract.command.kind=$ExpectedCommandKind, received $($parsed.contract.command.kind)"
            }
            if ($null -ne $ExpectedTilingFamilyComplete -and
                $parsed.contract.pc.tiling.family_complete -ne $ExpectedTilingFamilyComplete) {
              throw "Clearra CLI $Name smoke expected contract.pc.tiling.family_complete=$ExpectedTilingFamilyComplete, received $($parsed.contract.pc.tiling.family_complete)"
            }
            if ($ExpectedTilingFamilyIncompleteReason -and
                $parsed.contract.pc.tiling.family_incomplete_reason -ne $ExpectedTilingFamilyIncompleteReason) {
              throw "Clearra CLI $Name smoke expected contract.pc.tiling.family_incomplete_reason=$ExpectedTilingFamilyIncompleteReason, received $($parsed.contract.pc.tiling.family_incomplete_reason)"
            }
            foreach ($entry in $ExpectedSummary.GetEnumerator()) {
              $property = $parsed.summary.PSObject.Properties[$entry.Key]
              if ($null -eq $property -or $property.Value -ne $entry.Value) {
                $actual = if ($null -eq $property) { '<missing>' } else { $property.Value }
                throw "Clearra CLI $Name smoke expected summary.$($entry.Key)=$($entry.Value), received $actual"
              }
            }
            foreach ($entry in $ExpectedResourceReport.GetEnumerator()) {
              $property = $parsed.resource_report.PSObject.Properties[$entry.Key]
              if ($null -eq $property -or $property.Value -ne $entry.Value) {
                $actual = if ($null -eq $property) { '<missing>' } else { $property.Value }
                throw "Clearra CLI $Name smoke expected resource_report.$($entry.Key)=$($entry.Value), received $actual"
              }
            }
            if ($Name -eq 'rules-export-srs-x') {
              try {
                $embedded = $parsed.summary.json | ConvertFrom-Json -ErrorAction Stop
              } catch {
                throw 'Clearra CLI SRS-X export returned invalid embedded JSON'
              }
              $halfTurnCount = @(
                $embedded.entries | Where-Object {
                  "$($_.from):$($_.to)" -in @('0:2', '2:0', 'R:L', 'L:R')
                }
              ).Count
              if ($embedded.id -ne 'srs-x' -or
                  $embedded.source_rule -ne 'srs-x' -or
                  $embedded.entries.Count -ne 84 -or
                  $halfTurnCount -ne 28) {
                throw 'Clearra CLI SRS-X export did not preserve its canonical 84-transition profile'
              }
            }
            if ($Name -eq 'terminal-supply-p0') {
              $json | node scripts/tools/validate-release-cli-smokes.mjs `
                --validate-terminal-supply-json `
                --expected-source-commit $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) {
                throw 'Clearra CLI terminal-supply smoke violated the product contract'
              }
            }
          }
          Invoke-ClearraJsonSmoke -Name 'rules' -CommandArguments @('--format', 'json', 'rules', 'list')
          Invoke-ClearraJsonSmoke -Name 'rules-export-srs-x' `
            -CommandArguments @('--format', 'json', 'rules', 'export', '--profile', 'srs-x') `
            -ExpectedSummary @{ action = 'export'; profile = 'srs-x' }
          Invoke-ClearraJsonSmoke -Name 'solver' -CommandArguments @('--format', 'json', 'pc', '--lines', '2', '--queue', 'IJLOO', '--fixed', '--no-hold')
          Invoke-ClearraJsonSmoke -Name 'pc-tiling' `
            -CommandArguments @('--format', 'json', 'pc', 'tiling', '--lines', '2', '--queue', 'IIOOO', '--no-hold', '--backend', 'cpu', '--workers', '1') `
            -ExpectedKind 'pc-tiling-family.v1' `
            -ExpectedCommandKind 'pc-tiling-family.v1' `
            -ExpectedTilingFamilyComplete $true `
            -ExpectedTilingFamilyIncompleteReason 'none' `
            -ExpectedSummary @{ coverage_probability = 'not-calculated'; probability_calculated = $false; probability_complete = $false; supply_probability_complete = $false; resource_probability_complete = $false } `
            -ExpectedResourceReport @{ truncated = $false; truncation_reason = $null; probability_complete = $false }
          Invoke-ClearraJsonSmoke -Name 'failed-queue' -CommandArguments @('--format', 'json', 'failed-queue', '--lines', '2', '--patterns', 'P5', '--backend', 'cpu', '--failed-count', '7')
          Invoke-ClearraJsonSmoke -Name 'build-probability' `
            -CommandArguments @('--format', 'json', 'build-probability', '--base-mask', '0x0', '--target-mask', '0xf', '--height', '4', '--queue', 'I', '--no-hold', '--no-mirror', '--backend', 'cpu', '--workers', '1') `
            -ExpectedSummary @{ actual_backend = 'wasm-cpu-build-probability'; probability_calculated = $true; solution_found = $true }
          Invoke-ClearraJsonSmoke -Name 'pc-srs-x' `
            -CommandArguments @('--format', 'json', 'pc', '--lines', '2', '--queue', 'IIOOO', '--fixed', '--no-hold', '--rule', 'srs-x', '--backend', 'cpu', '--workers', '1') `
            -ExpectedSummary @{ rule_profile = 'srs-x'; effective_kick_model = 'srs-x'; solution_found = $true }
          Invoke-ClearraJsonSmoke -Name 'terminal-supply-p0' `
            -CommandArguments @('--format', 'json', '--include-solution-data', 'pc-scenario', '--field', '0x1c0701c07', '--visible-height', '4', '--queue', 'STOILJZ', '--max-pieces', '7', '--exact-pieces', '7', '--count-policy', 'count-unique', '--backend', 'cpu', '--workers', '1') `
            -ExpectedSummary @{ actual_backend = 'wasm-cpu'; unique_solution_count = 18; normalized_unique_solution_count = 18; solution_count_calculated = $true; solution_set_materialized = $true; solution_keys_materialized_count = 18; solution_keys_complete = $true; count_complete = $true; supply_window_resolution = 'projected-terminal-lookahead'; projects_unplaced_lookahead = $true; projects_standard_bag_lookahead = $false; source_sequence_length = 7; total_possible_pattern_count = '1'; normalized_solution_set_hash = 'cts1:8a7fc484d9b49994'; actual_normalized_solution_set_hash = 'cts1:8a7fc484d9b49994' }
      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearra-windows-cli-v${{ needs.metadata.outputs.version }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: dist/Clearra-CLI-v${{ needs.metadata.outputs.version }}-windows-x86_64.exe
          if-no-files-found: error

  windows-gui:
    if: github.event_name == 'workflow_dispatch'
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/clearra-release/cargo-target
          key: product-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            product-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-
            product-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}
      - name: Install frontend toolchain
        run: npm ci --ignore-scripts
      - name: Configure external release target
        shell: pwsh
        run: |
          $targetDir = Join-Path $env:RUNNER_TEMP 'clearra-release\cargo-target'
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV
      - name: Build standalone SvelteKit and Tauri GUI
        run: npm run tauri -w @clearra/desktop -- build --no-bundle
      - name: Stage Windows GUI executable
        shell: pwsh
        run: |
          $version = '${{ needs.metadata.outputs.version }}'
          $gui = Join-Path $env:CARGO_TARGET_DIR 'release\clearra-desktop.exe'
          if (-not (Test-Path -LiteralPath $gui -PathType Leaf)) {
            throw "Clearra GUI executable was not produced: $gui"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath $gui -Destination "dist\Clearra-GUI-v$version-windows-x86_64.exe"
      - name: Upload Windows GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearra-windows-gui-v${{ needs.metadata.outputs.version }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: dist/Clearra-GUI-v${{ needs.metadata.outputs.version }}-windows-x86_64.exe
          if-no-files-found: error

  canonical-evidence:
    if: github.event_name == 'workflow_dispatch'
    needs:
      [metadata, ctk3, linux-cli, discord-bot, release-acceptance, windows-cli, windows-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download canonical release gate evidence
        uses: actions/download-artifact@v4
        with:
          name: release-gate-evidence-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: acceptance-inputs/gate
      - name: Download accepted CTK3 distribution
        uses: actions/download-artifact@v4
        with:
          name: ctk3-accepted-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: acceptance-inputs/ctk3
      - name: Download accepted Pages build
        uses: actions/download-artifact@v4
        with:
          name: accepted-pages-build-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: acceptance-inputs/pages
      - name: Download Linux product
        uses: actions/download-artifact@v4
        with:
          name: clearra-linux-cli-v${{ needs.metadata.outputs.version }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: acceptance-inputs/products
      - name: Download Windows CLI product
        uses: actions/download-artifact@v4
        with:
          name: clearra-windows-cli-v${{ needs.metadata.outputs.version }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: acceptance-inputs/products
      - name: Download Windows GUI product
        uses: actions/download-artifact@v4
        with:
          name: clearra-windows-gui-v${{ needs.metadata.outputs.version }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: acceptance-inputs/products
      - name: Read exact workflow job evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            -f filter=latest \
            -f per_page=100 > "$RUNNER_TEMP/release-jobs.json"
      - name: Create canonical acceptance evidence
        shell: bash
        run: |
          node scripts/release/canonical-acceptance-evidence.mjs collect \
            --repository "$GITHUB_REPOSITORY" \
            --version "${{ needs.metadata.outputs.version }}" \
            --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --base-path "/${{ github.event.repository.name }}" \
            --jobs "$RUNNER_TEMP/release-jobs.json" \
            --gate-evidence acceptance-inputs/gate \
            --ctk3 acceptance-inputs/ctk3 \
            --pages acceptance-inputs/pages \
            --products acceptance-inputs/products \
            --output canonical-acceptance-evidence/clearra-canonical-acceptance-evidence.v1.json
      - name: Upload canonical acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: canonical-acceptance-evidence-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: canonical-acceptance-evidence
          if-no-files-found: error

  publish:
    if: always() && github.ref_type == 'tag' && needs.metadata.result == 'success'
    needs:
      [metadata, release-acceptance, linux-cli, windows-cli, windows-gui, discord-bot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: clearra-*-v${{ needs.metadata.outputs.version }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: dist
          merge-multiple: true
          run-id: ${{ needs.metadata.outputs.accepted_run_id }}
          github-token: ${{ github.token }}
      - name: Download canonical acceptance evidence
        uses: actions/download-artifact@v4
        with:
          name: canonical-acceptance-evidence-${{ github.sha }}-run-${{ needs.metadata.outputs.accepted_run_id }}-attempt-${{ needs.metadata.outputs.accepted_run_attempt }}
          path: canonical-acceptance-evidence
          run-id: ${{ needs.metadata.outputs.accepted_run_id }}
          github-token: ${{ github.token }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_RUN_ID: ${{ needs.metadata.outputs.accepted_run_id }}
          ACCEPTED_RUN_ATTEMPT: ${{ needs.metadata.outputs.accepted_run_attempt }}
          RELEASE_IMMUTABILITY_CONFIRMED: ${{ vars.CLEARRA_IMMUTABLE_RELEASES_ENABLED }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo 'release tag is no longer the exact current main commit' >&2
            exit 2
          fi
          node scripts/release/canonical-acceptance-run.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --require one \
            --expected-run-id "$ACCEPTED_RUN_ID" \
            --expected-run-attempt "$ACCEPTED_RUN_ATTEMPT"
          node scripts/release/canonical-acceptance-evidence.mjs verify \
            --report canonical-acceptance-evidence/clearra-canonical-acceptance-evidence.v1.json \
            --repository "$GITHUB_REPOSITORY" \
            --version "${{ needs.metadata.outputs.version }}" \
            --source-commit "$GITHUB_SHA" \
            --run-id "$ACCEPTED_RUN_ID" \
            --run-attempt "$ACCEPTED_RUN_ATTEMPT" \
            --base-path "/${{ github.event.repository.name }}" \
            --products dist
          if [[ "$RELEASE_IMMUTABILITY_CONFIRMED" != 'true' ]]; then
            echo 'repository release immutability has not been confirmed by the approved administrator' >&2
            exit 2
          fi
          node scripts/release/verify-remote-annotated-tag.mjs \
            --tag "$GITHUB_REF_NAME" \
            --expected-commit "$GITHUB_SHA"
          node scripts/release/finalize-discord-production-checkpoint.mjs verify-tag \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" \
            --accepted-run-id "$ACCEPTED_RUN_ID" \
            --accepted-run-attempt "$ACCEPTED_RUN_ATTEMPT" \
            --acceptance-evidence canonical-acceptance-evidence/clearra-canonical-acceptance-evidence.v1.json
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          if [[ "${#assets[@]}" -ne 3 ]]; then
            printf 'expected three standalone release assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 2
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "$GITHUB_RUN_ATTEMPT" == '1' ]]; then
              echo "release $GITHUB_REF_NAME already exists on the first tag attempt" >&2
              exit 2
            fi
            node scripts/release/release-publication-evidence.mjs recover \
              --repository "$GITHUB_REPOSITORY" \
              --tag "$GITHUB_REF_NAME" \
              --source-commit "$GITHUB_SHA" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
              --acceptance-evidence canonical-acceptance-evidence/clearra-canonical-acceptance-evidence.v1.json \
              --products dist
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Clearra $GITHUB_REF_NAME" \
              --draft
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
          immutable="$(gh api --method GET \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.immutable')"
          if [[ "$immutable" != 'true' ]]; then
            echo 'published release is not immutable' >&2
            exit 2
          fi
          node scripts/release/finalize-discord-production-checkpoint.mjs verify-release \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" \
            --accepted-run-id "$ACCEPTED_RUN_ID" \
            --accepted-run-attempt "$ACCEPTED_RUN_ATTEMPT" \
            --acceptance-evidence canonical-acceptance-evidence/clearra-canonical-acceptance-evidence.v1.json
          mkdir publication-receipt
          node scripts/release/release-publication-evidence.mjs capture \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --acceptance-evidence canonical-acceptance-evidence/clearra-canonical-acceptance-evidence.v1.json \
            --products dist \
            --output publication-receipt/clearra-release-publication-receipt.v1.json
      - name: Upload canonical publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-publication-receipt-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: publication-receipt/clearra-release-publication-receipt.v1.json
          if-no-files-found: error
          retention-days: 90
