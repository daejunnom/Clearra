name: Recovery initial mirror verification
on:
  push:
    branches: [codex/resume-initial-mirror-20260929]
    paths: [.github/workflows/initial-mirror-resume.yml]
permissions:
  contents: read
concurrency:
  group: recovery-initial-mirror-resume-20260929
  cancel-in-progress: false
jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b781f6b6ef1c9ce27e0430f87663a92508e1cb7d
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _local/mirror-helper
          persist-credentials: false
      - name: Apply the source-bound reviewed correction
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 _local/mirror-helper/scripts/tools/initial-mirror-resume-proposal.py
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          allowed=('crates/clearra-forward-search/','crates/clearra-app/','crates/clearra-host-contract/','crates/clearra-wasm/','packages/clearra-ui/')
          assert paths and all(p.startswith(allowed) for p in paths), paths
          PY
          proposal=codex/recovery-initial-mirror-tested-20260929
          test -z "$(git ls-remote --heads origin "refs/heads/$proposal")"
          git add -- crates/clearra-forward-search crates/clearra-app crates/clearra-host-contract crates/clearra-wasm packages/clearra-ui
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(recovery): include initial symmetric suffixes and preserve selected targets'
          git push origin "HEAD:refs/heads/$proposal"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p _local/artifacts/test/mirror-source
          git rev-parse HEAD > _local/artifacts/test/mirror-source/source-sha.txt
          git archive HEAD | gzip > _local/artifacts/test/mirror-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-mirror-source
          path: _local/artifacts/test/mirror-source
          retention-days: 7
  contracts:
    needs: proposal
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.proposal.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false
      - name: Rust exact mirror and host contracts
        shell: bash
        run: |
          set -uo pipefail
          out=_local/artifacts/test/mirror-contracts
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source-sha.txt"
          result=0
          cargo test --locked -p clearra-forward-search recovery_build -- --test-threads=1 2>&1 | tee "$out/core.log" || result=1
          cargo test --locked -p clearra-cli-command --test recovery_build -- --test-threads=1 2>&1 | tee "$out/cli.log" || result=1
          cargo test --locked -p clearra-wasm --test recovery_build_wire -- --test-threads=1 2>&1 | tee "$out/wasm.log" || result=1
          cargo check --locked -p clearra-wasm --target wasm32-unknown-unknown 2>&1 | tee "$out/wasm-target.log" || result=1
          exit "$result"
      - name: UI response and replay contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          out=_local/artifacts/test/mirror-contracts
          mkdir -p "$out"
          result=0
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee "$out/install.log" || result=1
          node packages/clearra-ui/scripts/prepare-test-dependencies.mjs 2>&1 | tee "$out/prepare.log" || result=1
          node --test packages/clearra-ui/test/recoveryBuild*.test.mjs 2>&1 | tee "$out/ui.log" || result=1
          pnpm --filter @clearra/ui exec tsc --noEmit -p tsconfig.contract.json 2>&1 | tee "$out/types.log" || result=1
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-mirror-contracts
          path: _local/artifacts/test/mirror-contracts
          retention-days: 7
