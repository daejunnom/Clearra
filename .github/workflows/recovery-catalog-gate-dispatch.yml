name: Dispatch Recovery catalog acceptance
on:
  push:
    branches: [codex/dispatch-recovery-catalog-gate-20260929]
    paths: [.github/workflows/recovery-catalog-gate-dispatch.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: recovery-catalog-acceptance-b781f6b
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.repository == 'daejunnom/Clearra'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b781f6b6ef1c9ce27e0430f87663a92508e1cb7d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Dispatch the unchanged canonical acceptance owner exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {mkdirSync, writeFileSync, appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {githubApi as api} from './scripts/release/queue-pages-publication.mjs';
          const repository = 'daejunnom/Clearra';
          const source = 'b781f6b6ef1c9ce27e0430f87663a92508e1cb7d';
          const prefix = `repos/${repository}`;
          assert.equal(process.env.GITHUB_REPOSITORY, repository);
          assert.equal(process.env.GITHUB_REF, 'refs/heads/codex/dispatch-recovery-catalog-gate-20260929');
          assert.equal(process.env.GITHUB_RUN_ATTEMPT, '1');
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim(), source);
          assert.equal(api('GET', `${prefix}/git/ref/heads/main`).object.sha, source);
          const management = api('GET', `${prefix}/actions/runs/36497778433`);
          assert.equal(management.head_sha, source);
          assert.equal(management.path, '.github/workflows/management-policy.yml');
          assert.equal(management.status, 'completed');
          assert.equal(management.conclusion, 'success');
          const pins = api('GET', `${prefix}/actions/runs/36497656147`);
          assert.equal(pins.path, '.github/workflows/recovery-pin-transport-check.yml');
          assert.equal(pins.status, 'completed');
          assert.equal(pins.conclusion, 'success');
          const prior = api('GET', `${prefix}/actions/workflows/release-cli.yml/runs?head_sha=${source}&event=workflow_dispatch&per_page=100`);
          assert.equal(prior.total_count, 0, 'Inspect an existing acceptance instead of dispatching twice.');
          assert.equal(api('GET', `${prefix}/git/ref/heads/main`).object.sha, source);
          const receipt = api('POST', `${prefix}/actions/workflows/release-cli.yml/dispatches`, {ref:'main',inputs:{}});
          const out = '_local/artifacts/test/recovery-catalog-dispatch';
          mkdirSync(out, {recursive:true});
          writeFileSync(`${out}/receipt.json`, JSON.stringify({source,receipt,pages_dispatched:false}, null, 2)+'\n');
          const id = String(receipt.workflow_run_id ?? '');
          assert.match(id, /^[1-9][0-9]*$/u, 'Uncertain dispatch receipt: do not retry.');
          assert.equal(receipt.html_url, `https://github.com/${repository}/actions/runs/${id}`);
          const run = api('GET', `${prefix}/actions/runs/${id}`);
          assert.equal(run.head_sha, source);
          assert.equal(run.head_branch, 'main');
          assert.equal(run.event, 'workflow_dispatch');
          assert.equal(run.path, '.github/workflows/release-cli.yml');
          console.log(JSON.stringify({source, acceptance_run_id:id, pages_dispatched:false}));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Canonical acceptance: ${receipt.html_url}\n\nPages publication was not dispatched.\n`);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-catalog-dispatch-receipt
          path: _local/artifacts/test/recovery-catalog-dispatch
          retention-days: 7
