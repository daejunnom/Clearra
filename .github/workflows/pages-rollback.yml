name: Preserve or Restore GitHub Pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture the active Pages source or restore a captured artifact
        required: true
        type: choice
        options:
          - capture
          - bootstrap-capture
          - restore
      snapshot_sha:
        description: Exact source commit represented by the active Pages site
        required: true
        type: string
      expected_current_main:
        description: Exact current main commit that owns this rollback bracket
        required: true
        type: string
      legacy_release_tag:
        description: Exact approved published legacy tag; required only for bootstrap-capture
        required: false
        type: string
      current_pages_sha:
        description: Exact Pages source active immediately before restore; blank for capture
        required: false
        type: string
      snapshot_run_id:
        description: Successful capture workflow run ID; required only for restore
        required: false
        type: string
      restore_authorization:
        description: Exact ROLLBACK current-to-snapshot sentinel; required only for restore
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  capture-authority:
    if: ${{ inputs.mode == 'capture' || inputs.mode == 'bootstrap-capture' }}
    permissions:
      contents: read
      actions: read
      pages: read
      deployments: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_current_main }}
          path: authority-source
      - name: Verify active Pages capture authority
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_AUTHORITY_MODE: ${{ inputs.mode }}
          PAGES_AUTHORITY_PHASE: initial
          AUTHORITY_SHA: ${{ inputs.expected_current_main }}
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
          CURRENT_PAGES_SHA: ${{ inputs.snapshot_sha }}
          REQUESTED_CURRENT_PAGES_SHA: ${{ inputs.current_pages_sha }}
          LEGACY_RELEASE_TAG: ${{ inputs.legacy_release_tag }}
          CAPTURE_RUN_ID: ${{ inputs.snapshot_run_id }}
          RESTORE_AUTHORIZATION: ${{ inputs.restore_authorization }}
        shell: bash
        run: node authority-source/scripts/release/pages-rollback-authority.mjs

  capture-build:
    if: ${{ inputs.mode == 'capture' || inputs.mode == 'bootstrap-capture' }}
    needs: capture-authority
    permissions:
      contents: read
      actions: read
      pages: read
      deployments: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.snapshot_sha }}
          path: snapshot-source
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_current_main }}
          path: authority-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snapshot-source/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/Clearra/build/cargo-target-wasm
          key: pages-rollback-wasm-${{ runner.os }}-${{ hashFiles('snapshot-source/Cargo.lock') }}-bindgen-0.2.126
      - name: Prepare Rust WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          if ! command -v wasm-bindgen >/dev/null || [[ "$(wasm-bindgen --version)" != "wasm-bindgen 0.2.126" ]]; then
            cargo install wasm-bindgen-cli --version 0.2.126 --locked
          fi
      - name: Install GUI dependencies
        working-directory: snapshot-source
        run: npm ci --ignore-scripts
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build previous Pages source
        working-directory: snapshot-source
        env:
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
        run: |
          CLEARRA_WEB_BASE_PATH="/${GITHUB_REPOSITORY#*/}" \
          CLEARRA_SOURCE_COMMIT="$SNAPSHOT_SHA" \
          CLEARRA_ENGINE_BUILD_ID="$SNAPSHOT_SHA" \
          npm run build --workspace apps/clearra-web
      - name: Prepare exact rollback manifest contract
        env:
          PAGES_AUTHORITY_MODE: prepare-manifests
          PAGES_CAPTURE_MODE: ${{ inputs.mode }}
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
          STATIC_MANIFEST_PATH: snapshot-source/apps/clearra-web/static/wasm/clearra_wasm.manifest.json
          BUILD_MANIFEST_PATH: snapshot-source/apps/clearra-web/build/wasm/clearra_wasm.manifest.json
        run: node authority-source/scripts/release/pages-rollback-authority.mjs
      - name: Stamp exact rollback identity
        env:
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            snapshot-source/apps/clearra-web/static/wasm/clearra_wasm.manifest.json \
            snapshot-source/apps/clearra-web/build/wasm/clearra_wasm.manifest.json; do
            jq -e --arg sha "$SNAPSHOT_SHA" '
              .build.runtime_identity.source_commit == $sha and
              .build.runtime_identity.engine_build_id == $sha and
              .build.runtime_identity.contract_schema_version == "clearra.search.contract.v2" and
              .build.runtime_identity.supply_semantics_id == "clearra.supply.projected-terminal-lookahead.v1" and
              .build.runtime_identity.artifact_schema_version == "clearra.solution-data.v1"
            ' "$manifest" >/dev/null
          done
          version="$(node snapshot-source/scripts/release/validate-release-metadata.mjs)"
          jq -n --arg sourceCommit "$SNAPSHOT_SHA" \
            --arg engineBuildId "$SNAPSHOT_SHA" \
            --arg version "$version" \
            '{schema:"clearra.pages.identity.v2",sourceCommit:$sourceCommit,engineBuildId:$engineBuildId,contractSchemaVersion:"clearra.search.contract.v2",supplySemanticsId:"clearra.supply.projected-terminal-lookahead.v1",artifactSchemaVersion:"clearra.solution-data.v1",version:$version}' \
            > snapshot-source/apps/clearra-web/build/clearra-build-identity.json
          jq -e --arg sha "$SNAPSHOT_SHA" '
            .schema == "clearra.pages.identity.v2" and
            .sourceCommit == $sha and .engineBuildId == $sha and
            .contractSchemaVersion == "clearra.search.contract.v2" and
            .supplySemanticsId == "clearra.supply.projected-terminal-lookahead.v1" and
            .artifactSchemaVersion == "clearra.solution-data.v1" and
            (.version | type == "string" and length > 0)
          ' snapshot-source/apps/clearra-web/build/clearra-build-identity.json >/dev/null
          if find snapshot-source/apps/clearra-web/build -type l -print -quit | grep -q .; then
            echo 'Pages rollback site must not contain symbolic links' >&2
            exit 2
          fi
          export LC_ALL=C
          while IFS= read -r -d '' relative_path; do
            tar_member="./${relative_path}"
            if (( ${#tar_member} > 100 )); then
              echo 'Pages rollback site contains a tar member name longer than the portable header field' >&2
              exit 2
            fi
          done < <(find snapshot-source/apps/clearra-web/build -mindepth 1 -printf '%P\0')
      - name: Revalidate capture authority immediately before artifact creation
        id: artifact-authority
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_AUTHORITY_MODE: ${{ inputs.mode }}
          PAGES_AUTHORITY_PHASE: preartifact
          AUTHORITY_SHA: ${{ inputs.expected_current_main }}
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
          CURRENT_PAGES_SHA: ${{ inputs.snapshot_sha }}
          REQUESTED_CURRENT_PAGES_SHA: ${{ inputs.current_pages_sha }}
          LEGACY_RELEASE_TAG: ${{ inputs.legacy_release_tag }}
          CAPTURE_RUN_ID: ${{ inputs.snapshot_run_id }}
          RESTORE_AUTHORIZATION: ${{ inputs.restore_authorization }}
        run: |
          node authority-source/scripts/release/pages-rollback-authority.mjs
          echo "artifact_name=clearra-pages-rollback-${SNAPSHOT_SHA}-authority-${AUTHORITY_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload durable Pages rollback artifact
        id: snapshot
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact-authority.outputs.artifact_name }}
          path: snapshot-source/apps/clearra-web/build
          retention-days: 90
      - name: Seal exact rollback capture authority
        id: capture-report
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_AUTHORITY_MODE: capture-report
          AUTHORITY_SHA: ${{ inputs.expected_current_main }}
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
          CAPTURE_ARTIFACT_NAME: ${{ steps.artifact-authority.outputs.artifact_name }}
          CAPTURE_ARTIFACT_ID: ${{ steps.snapshot.outputs.artifact_id }}
          CAPTURE_TAR_PATH: ${{ runner.temp }}/artifact.tar
          CAPTURE_REPORT_PATH: ${{ runner.temp }}/pages-rollback-capture-authority.json
        run: node authority-source/scripts/release/pages-rollback-authority.mjs
      - name: Upload sealed rollback capture authority
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.capture-report.outputs.report_artifact_name }}
          path: ${{ runner.temp }}/pages-rollback-capture-authority.json
          if-no-files-found: error
          retention-days: 90

  restore-authority:
    if: ${{ inputs.mode == 'restore' }}
    permissions:
      contents: read
      actions: read
      pages: read
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.authority.outputs.capture_artifact_name }}
      tar_sha256: ${{ steps.authority.outputs.capture_tar_sha256 }}
      report_artifact_id: ${{ steps.rollback-report.outputs.report_artifact_id }}
      report_artifact_name: ${{ steps.rollback-report.outputs.report_artifact_name }}
      report_artifact_digest: ${{ steps.rollback-report.outputs.report_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_current_main }}
          path: authority-source
      - name: Resolve sealed rollback capture report
        id: rollback-report
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_AUTHORITY_MODE: resolve-restore
          AUTHORITY_SHA: ${{ inputs.expected_current_main }}
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
          CAPTURE_RUN_ID: ${{ inputs.snapshot_run_id }}
        run: node authority-source/scripts/release/pages-rollback-authority.mjs
      - name: Download sealed rollback capture report
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.rollback-report.outputs.report_artifact_name }}
          path: rollback-capture-report
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.snapshot_run_id }}
      - name: Verify rollback run and artifact authority
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_AUTHORITY_MODE: restore
          PAGES_AUTHORITY_PHASE: initial
          AUTHORITY_SHA: ${{ inputs.expected_current_main }}
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
          CURRENT_PAGES_SHA: ${{ inputs.current_pages_sha }}
          LEGACY_RELEASE_TAG: ${{ inputs.legacy_release_tag }}
          CAPTURE_RUN_ID: ${{ inputs.snapshot_run_id }}
          CAPTURE_REPORT_PATH: rollback-capture-report/pages-rollback-capture-authority.json
          CAPTURE_REPORT_ARTIFACT_ID: ${{ steps.rollback-report.outputs.report_artifact_id }}
          CAPTURE_REPORT_ARTIFACT_NAME: ${{ steps.rollback-report.outputs.report_artifact_name }}
          CAPTURE_REPORT_ARTIFACT_DIGEST: ${{ steps.rollback-report.outputs.report_artifact_digest }}
          RESTORE_AUTHORIZATION: ${{ inputs.restore_authorization }}
        run: node authority-source/scripts/release/pages-rollback-authority.mjs

  restore-package:
    if: ${{ inputs.mode == 'restore' }}
    needs: restore-authority
    permissions:
      contents: read
      actions: read
      pages: read
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.restored-pages-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_current_main }}
          path: authority-source
      - name: Download exact rollback package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.restore-authority.outputs.artifact_name }}
          path: rollback-package
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.snapshot_run_id }}
      - name: Verify downloaded rollback package
        env:
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
          SNAPSHOT_TAR_SHA256: ${{ needs.restore-authority.outputs.tar_sha256 }}
          PAGES_ROLLBACK_PACKAGE_DIR: rollback-package
        run: node authority-source/scripts/release/pages-rollback-package.mjs
      - name: Upload exact rollback Pages artifact
        id: restored-pages-artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: rollback-package/artifact.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy-restore:
    if: ${{ inputs.mode == 'restore' }}
    needs:
      - restore-authority
      - restore-package
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_current_main }}
          path: authority-source
      - name: Redownload sealed rollback capture report immediately before restore
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.restore-authority.outputs.report_artifact_name }}
          path: rollback-capture-report-predeploy
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.snapshot_run_id }}
      - name: Revalidate rollback artifact immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_AUTHORITY_MODE: restore
          PAGES_AUTHORITY_PHASE: predeploy
          AUTHORITY_SHA: ${{ inputs.expected_current_main }}
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
          CURRENT_PAGES_SHA: ${{ inputs.current_pages_sha }}
          LEGACY_RELEASE_TAG: ${{ inputs.legacy_release_tag }}
          CAPTURE_RUN_ID: ${{ inputs.snapshot_run_id }}
          CAPTURE_REPORT_PATH: rollback-capture-report-predeploy/pages-rollback-capture-authority.json
          CAPTURE_REPORT_ARTIFACT_ID: ${{ needs.restore-authority.outputs.report_artifact_id }}
          CAPTURE_REPORT_ARTIFACT_NAME: ${{ needs.restore-authority.outputs.report_artifact_name }}
          CAPTURE_REPORT_ARTIFACT_DIGEST: ${{ needs.restore-authority.outputs.report_artifact_digest }}
          RESTORE_AUTHORIZATION: ${{ inputs.restore_authorization }}
        run: node authority-source/scripts/release/pages-rollback-authority.mjs
      - name: Deploy exact Pages rollback
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Seal restored Pages authority from API and public readback
        id: deployment-authority
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_DEPLOYMENT_MODE: restore
          SOURCE_COMMIT: ${{ inputs.snapshot_sha }}
          PAGES_ARTIFACT_ID: ${{ needs.restore-package.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages
          EXPECTED_BASE_PATH: /${{ github.event.repository.name }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PAGES_AUTHORITY_REPORT_PATH: ${{ runner.temp }}/pages-restore-deployment-authority.json
        run: node authority-source/scripts/release/pages-deployment-authority.mjs
      - name: Upload sealed Pages restore authority
        uses: actions/upload-artifact@v4
        with:
          name: clearra-pages-restore-authority-${{ inputs.snapshot_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-restore-deployment-authority.json
          if-no-files-found: error
          retention-days: 90
