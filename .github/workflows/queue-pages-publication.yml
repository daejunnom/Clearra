name: Queue validated Pages publication

on:
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: Already-started canonical acceptance run for this exact main commit
        required: true
        type: string
      snapshot_sha:
        description: Full source commit currently served by Pages
        required: true
        type: string

permissions:
  contents: read
  actions: write

# Do not acquire the child workflows' `pages` group while waiting for them.
concurrency:
  group: queued-pages-publication
  cancel-in-progress: false

jobs:
  queue:
    if: github.repository == 'daejunnom/Clearra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Await exact acceptance, capture rollback, then publish Pages
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
        run: node scripts/release/queue-pages-publication.mjs
