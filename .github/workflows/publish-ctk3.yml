name: Publish CTK3 to npm
run-name: CTK3 npm · ${{ inputs.publish && 'publish' || 'prepare only' }} · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: Optional successful canonical acceptance for this exact main SHA; empty runs CTK3-only verification
        required: false
        type: string
      publish:
        description: Publish to npm using the configured Trusted Publisher (false only prepares the package)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: ctk3-npm-publication
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'daejunnom/Clearra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLEARRA_BUILD_PURPOSE: product
    outputs:
      filename: ${{ steps.pack.outputs.package_filename }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Require the exact current main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
      - name: Resolve optional canonical CTK3 distribution
        if: inputs.acceptance_run_id != ''
        id: accepted
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
        run: |
          node scripts/release/canonical-acceptance-run.mjs \
            --repository "$GITHUB_REPOSITORY" --source-commit "$GITHUB_SHA" \
            --require one --expected-run-id "$ACCEPTANCE_RUN_ID" \
            --format github-output >> "$GITHUB_OUTPUT"
      - name: Download the built and tested CTK3 distribution without rebuilding
        if: inputs.acceptance_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ctk3-accepted-${{ github.sha }}-run-${{ steps.accepted.outputs.accepted_run_id }}-attempt-${{ steps.accepted.outputs.accepted_run_attempt }}
          path: packages/ctk3/dist
          run-id: ${{ steps.accepted.outputs.accepted_run_id }}
          github-token: ${{ github.token }}
      - name: Install pinned pnpm for package-only verification
        if: inputs.acceptance_run_id == ''
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false
      - name: Install only the CTK3 workspace dependency closure
        if: inputs.acceptance_run_id == ''
        run: pnpm install --filter ctk3 --frozen-lockfile --ignore-scripts
      - name: Build and test CTK3 once, without an application release gate
        if: inputs.acceptance_run_id == ''
        run: |
          pnpm --filter ctk3 run test
          node scripts/tools/accepted-ctk3-dist.mjs --seal packages/ctk3/dist \
            --source-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Bind this distribution's verification run
        id: distribution
        env:
          ACCEPTED_RUN_ID: ${{ steps.accepted.outputs.accepted_run_id }}
          ACCEPTED_RUN_ATTEMPT: ${{ steps.accepted.outputs.accepted_run_attempt }}
        run: |
          echo "run_id=${ACCEPTED_RUN_ID:-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "run_attempt=${ACCEPTED_RUN_ATTEMPT:-$GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Verify accepted bytes and the npm packaging boundary
        run: |
          node scripts/tools/accepted-ctk3-dist.mjs --verify packages/ctk3/dist \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-run-id '${{ steps.distribution.outputs.run_id }}' \
            --expected-run-attempt '${{ steps.distribution.outputs.run_attempt }}'
          node --test scripts/release/ctk3-npm-package.test.mjs
      - name: Pack the accepted distribution without invoking prepack
        id: pack
        run: |
          mkdir -p build/npm
          (cd packages/ctk3 && npm pack --ignore-scripts --json \
            --pack-destination "$GITHUB_WORKSPACE/build/npm") > build/npm/pack.json
          node scripts/release/ctk3-npm-package.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ctk3-npm-${{ github.sha }}-run-${{ github.run_id }}
          path: build/npm/${{ steps.pack.outputs.package_filename }}
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish == true
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install the OIDC-capable npm CLI
        run: npm install --global npm@11.5.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ctk3-npm-${{ github.sha }}-run-${{ github.run_id }}
          path: build/npm
      - name: Publish the verified tarball with OIDC and provenance, without a token
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILENAME: ${{ needs.package.outputs.filename }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          npm publish "./build/npm/$PACKAGE_FILENAME" --ignore-scripts \
            --access public --provenance --registry=https://registry.npmjs.org
