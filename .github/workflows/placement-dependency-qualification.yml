name: Placement Dependency Qualification

on:
  push:
    branches:
      - codex/v090-relation-rust-integration
      - codex/v090-relation-rust-p7p4
      # Pre-main opt-in: only an owner-created, SHA-addressed branch can
      # request the entire proof and timing suite on one hosted runner.
      - codex/v090-relation-rust-adoption-*
      - codex/v090-relation-rust-host-*
  workflow_dispatch:
    inputs:
      run_adoption:
        description: Explicitly run P7P4 mapping qualification followed by same-job ABBA and BAAB
        type: boolean
        default: false
      source_sha:
        description: Full selected commit SHA (required only when run_adoption is true)
        type: string

permissions:
  contents: read

concurrency:
  # Host machines and the isolated adoption runner do not share state.
  # Duplicate runs for one ref/commit are still serialized; distinct
  # exact-SHA lanes must not queue behind the several-hour adoption job.
  group: placement-dependency-qualification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_MIN_STACK: '16777216'

jobs:
  relation-and-mapping:
    if: >-
      github.ref == 'refs/heads/codex/v090-relation-rust-integration' &&
      (github.event_name != 'workflow_dispatch' || !inputs.run_adoption)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compare CEGIS, ILC, APDP and coverage capture with focused references
        shell: bash
        run: |
          set -eu
          cargo test --locked -p clearra-core-executor --features parallel,local-search-ab --lib --no-run
          status=0
          filters=(structural_graph_probability_tests bounded_no_entry first_kick_interval_preserves
            ordered_kick_interval_requires ordered_kick_witness_guard_ candidate_kick_guard_
            reachability::reference_tests incremental_domain_ minimum_domain_cutoff_
            exact_clear_domain_tests placement_conditions::tests geometric_edge_reuse_
            candidate_projection_clear_fact_reuse_
            family_root_count_ family_handoff_
            capture_candidate_solution_coverage_matches_explicit_product_rows direct_p7p4_capture_
            candidate_witness_only_reads conditional_language_ native_parallel_terminal_identity_move
            v081_worker_component_accounting terminal_hold_projection::
            nonempty_eight_i_advanced_domain_preserves_fixture_identities same_tile_parent_reuse_requires
            lazy_frame_ occupied_same_kind_hold_visits terminal_result_moves_solution_coverage
            build_colored_allow_list_binds_direct_distributed_and_merge)
          for filter in "${filters[@]}"; do
            cargo test --locked -p clearra-core-executor --features parallel,local-search-ab --lib "$filter" || status=1
          done
          exit "$status"
      - name: Test the bounded solution stream and exact comparison
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-core-executor --features parallel,local-search-ab --example placement_graph_bench
      - name: Build the focused proof tools once
        id: focused-tools
        if: ${{ !cancelled() }}
        run: |
          set -eu
          df --output=avail -B1 "$GITHUB_WORKSPACE"
          CARGO_PROFILE_DEV_DEBUG=0 cargo build --locked -p clearra-manage
          CLEARRA_SOURCE_COMMIT="$GITHUB_SHA" CARGO_PROFILE_DEV_DEBUG=0 cargo build --locked -p clearra-core-executor --features parallel,local-search-ab --example placement_graph_bench
      - name: Verify supervised capture and comparison on the one-I fixture
        if: ${{ !cancelled() && steps.focused-tools.outcome == 'success' }}
        run: |
          node scripts/benchmark/run-placement-coverage-proof.mjs --case small --build-profile debug \
            --id "small-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA"
      - name: Check non-empty Geometry routes against the independent eight-I oracle
        if: ${{ !cancelled() && steps.focused-tools.outcome == 'success' }}
        shell: bash
        run: |
          set -eu
          tools="$GITHUB_WORKSPACE/build/cargo/default/debug"
          status=0
          for modes in '0 0' '1 0' '0 1'; do
            read -r incremental reuse <<< "$modes"
            CLEARRA_INCREMENTAL_DOMAIN="$incremental" CLEARRA_SAME_TILE_PARENT_REUSE="$reuse" \
              "$tools/clearra-manage" --root "$GITHUB_WORKSPACE" runtime run \
              --producer benchmark --profile benchmark-search --timeout 120 -- \
              "$tools/examples/placement_graph_bench" --nonempty-eight-i || status=1
          done
          exit "$status"
      - name: Compare minimum-domain and physical edge work on independent product fixtures
        if: ${{ !cancelled() && steps.focused-tools.outcome == 'success' }}
        shell: bash
        run: |
          set -eu
          tools="$GITHUB_WORKSPACE/build/cargo/default/debug"
          capture="$GITHUB_WORKSPACE/_local/artifacts/benchmarks/placement-graph-coverage/placement-work-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          "$tools/clearra-manage" --root "$GITHUB_WORKSPACE" storage verify --path "$capture/empty-ten-i/reference.json"
          mkdir -p -- "$(dirname -- "$capture")"
          mkdir -- "$capture"
          status=0
          for fixture in empty-ten-i grounded-o-two-lines grounded-o-two-lines-unique; do
            receipts="$capture/$fixture"
            mkdir -- "$receipts"
            case "$fixture" in
              empty-ten-i) axis=CLEARRA_MINIMUM_DOMAIN_CUTOFF; work=1 ;;
              *) axis=CLEARRA_GEOMETRIC_EDGE_REUSE; work=0 ;;
            esac
            ready=1
            for arm in reference treatment; do
              case "$arm" in reference) toggle=0 ;; treatment) toggle=1 ;; esac
              env "$axis=$toggle" CLEARRA_MINIMUM_DOMAIN_WORK="$work" \
                "$tools/clearra-manage" --root "$GITHUB_WORKSPACE" runtime run \
                --producer benchmark --profile benchmark-search --timeout 120 -- \
                "$tools/examples/placement_graph_bench" "--$fixture" > "$receipts/$arm.json" || ready=0
            done
            if [ "$ready" -eq 0 ]; then status=1; continue; fi
            "$tools/examples/placement_graph_bench" --compare \
              "$receipts/reference.json" "$receipts/treatment.json" > "$receipts/comparison.json" || status=1
            node scripts/benchmark/verify-placement-work-pair.mjs "$fixture" "$GITHUB_SHA" "$receipts" || status=1
          done
          exit "$status"
      - name: Retain bounded placement work reports
        if: ${{ !cancelled() && steps.focused-tools.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: placement-work-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: _local/artifacts/benchmarks/placement-graph-coverage/placement-work-${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
          if-no-files-found: ignore
          retention-days: 14
  receipts-and-adoption:
    if: >-
      github.ref == 'refs/heads/codex/v090-relation-rust-integration' &&
      (github.event_name != 'workflow_dispatch' || !inputs.run_adoption)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Test native exit and memory receipt classification
        run: cargo test --locked -p clearra-manage --bin clearra-manage runtime::tests
      - name: Test the work, receipt, and timing evidence boundaries
        if: ${{ !cancelled() }}
        run: node --test scripts/tools/placement-graph-adoption.test.mjs scripts/benchmark/run-placement-coverage-proof.test.mjs scripts/benchmark/run-placement-graph-adoption.test.mjs scripts/benchmark/verify-placement-work-pair.test.mjs scripts/release/windows-desktop-startup-attestation.test.mjs
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        id: node
        with:
          node-version: 22.23.2
      - name: Test the Web transfer owner and Discord artifact projection
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node --experimental-strip-types --test apps/clearra-web/test/verifierBatchOwnership.test.mjs apps/clearra-discord-bot/test/job-service.test.mjs
  operation-reuse:
    if: >-
      github.ref == 'refs/heads/codex/v090-relation-rust-integration' &&
      (github.event_name != 'workflow_dispatch' || !inputs.run_adoption)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Test normalized ordered kicks and stable replay identifiers
        run: cargo test --locked -p clearra-rules -p clearra-finesse -p clearra-core-ffi -p clearra-pc-graph --lib --no-fail-fast
      - name: Compare physical clear and Perfect Clear facts across scoring and B2B
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-scoring --lib clear_fact_parity
      - name: Validate the exact Legacy assignment join independently of the C adapter
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-build-coverage --lib verified_assignment_rows_
      - name: Test Legacy Cover, full-height replay and Setup continuation ownership
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node scripts/tools/invoke-clearra-build.mjs --purpose experiment -- bash -e -u <<'SH'
          out="$CLEARRA_BUILD_TRANSACTION_ROOT/legacy-cover-core-c"
          cmake -S core-c -B "$out" -DBUILD_TESTING=OFF -DCLEARRA_BUILD_TEST_ORACLE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$out" --target clearra_core clearra_core_test_oracle --parallel 2
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-L native=$out"
          status=0
          cargo test --locked -p clearra-core-executor --no-default-features --features native-c-core \
            --test legacy_cover_native_witness --test pc_tiling_control_parity --no-fail-fast || status=1
          # These selectors share one lib-test executable. A compile failure
          # prevents all of them, but does not prevent the integration tests.
          app_lib=(cargo test --locked -p clearra-app --features native-c-core --lib)
          if "${app_lib[@]}" --no-run; then
            for filter in legacy_cover_tests legacy_cover_rust::tests:: pc_tiling_candidate_budget_preserves_failure_without_publishing setup_score_ordinals setup_score_evaluation_identity_binds; do
              "${app_lib[@]}" "$filter" || status=1
            done
          else
            status=1
          fi
          cargo test --locked -p clearra-app --features native-c-core --test extended_pc_tiling full_height_fixed_queue_scenario_replay_reuses_the_same_rust_family || status=1
          cargo test --locked -p clearra-app --features native-c-core --test extended_pc_tiling full_height_scenario_continuation_restarts_at_an_accepted_path_checkpoint || status=1
          cargo test --locked -p clearra-app --features native-c-core --test opening_continuation_parity || status=1
          cargo test --locked -p clearra-app --features native-c-core --test exact_accelerator_product_execution setup_score_reuse || status=1
          exit "$status"
          SH
  desktop-cli-readback:
    if: >-
      github.repository == 'daejunnom/Clearra' &&
      github.event_name == 'push' && github.ref_type == 'branch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.run_attempt == '1' && github.event.created &&
      !github.event.deleted && !github.event.forced &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.event.after == github.sha &&
      github.ref == format('refs/heads/codex/v090-relation-rust-host-{0}', github.sha)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 45
    env:
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
      CLEARRA_REAL_DESKTOP_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_REAL_PC24_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_REAL_PC24_CLI: ${{ github.workspace }}/build/cargo/default/debug/clearra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check bounded Windows startup-proof fixtures without launching the application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/tools/verify-windows-desktop-runtime.test.ps1
      - name: Compare actual Desktop bridge requests with the native CLI at 7–24L
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:GITHUB_SHA) { throw 'Unexpected checkout SHA' }
          $output = Join-Path $env:GITHUB_WORKSPACE '_local/artifacts/v081-desktop-native-smoke'
          New-Item -Path $output -ItemType Directory -Force | Out-Null
          cargo test --locked -p clearra-cli --test desktop_full_height_products --no-default-features `
            --features 'wasm-cpu-runtime,clearra-gui-host/wasm-cpu-runtime' -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        id: node
        with:
          node-version: 22.23.2
      - name: Prepare the locked Discord render dependencies
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.node.outcome == 'success' }}
        id: ctk3
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          node packages/clearra-ui/scripts/prepare-test-dependencies.mjs
      - name: Read back the Desktop test build's same CLI through the Discord adapter
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.ctk3.outcome == 'success' }}
        run: |
          test -x "$CLEARRA_REAL_PC24_CLI"
          node --test apps/clearra-discord-bot/test/realCliFullHeightProducts.test.mjs
  web-cpu-readback:
    # An owner-created exact-source ref is the pre-main opt-in. Unlike the
    # usual source CI, it builds WASM, without downloading accelerator data.
    if: >-
      github.repository == 'daejunnom/Clearra' &&
      github.event_name == 'push' && github.ref_type == 'branch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.run_attempt == '1' && github.event.created &&
      !github.event.deleted && !github.event.forced &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.event.after == github.sha &&
      github.ref == format('refs/heads/codex/v090-relation-rust-host-{0}', github.sha)
    # Keep the browser host compatible with the pinned Playwright release.
    # In particular ubuntu-latest can move ahead of its Chromium registry.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CLEARRA_BUILD_PURPOSE: experiment
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
      CLEARRA_REAL_ACCELERATOR_WASM_DIR: ${{ github.workspace }}/_local/artifacts/v081-browser-peer-smoke/wasm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Prepare only the locked CPU worker test dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare the current-source native WASM toolchain
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          cargo build --locked --release -p clearra-manage
          manager="$GITHUB_WORKSPACE/build/cargo/default/release/clearra-manage"
          "$manager" storage verify --path "$CLEARRA_REAL_ACCELERATOR_WASM_DIR"
          echo "CLEARRA_MANAGE_BIN=$manager" >> "$GITHUB_ENV"
      - name: Install the pinned managed WASM binding tool
        shell: pwsh
        run: |
          & ./scripts/tools/install-managed-cargo-tool.ps1 -Purpose experiment -ToolName wasm-bindgen-cli -Version 0.2.126
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the ordinary exact-source product WASM once
        id: product-wasm
        run: node scripts/tools/build-clearra-wasm.mjs --destination "$CLEARRA_REAL_ACCELERATOR_WASM_DIR"
      - name: Compare the actual Web verifier Worker with serial WASM
        run: node scripts/tools/run-real-web-verifier-pool-smoke.mjs --without-accelerators
      - name: Install pinned Chromium tooling for the same WASM
        if: ${{ !cancelled() && steps.product-wasm.outcome == 'success' }}
        id: browser-tools
        shell: bash
        run: |
          browser_tools="$RUNNER_TEMP/clearra-browser-tools"
          export PLAYWRIGHT_BROWSERS_PATH="$browser_tools/browsers"
          npm install --prefix "$browser_tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$browser_tools/node_modules/.bin/playwright" install --with-deps chromium
          printf 'CLEARRA_BROWSER_TOOLS_ROOT=%s\nPLAYWRIGHT_BROWSERS_PATH=%s\n' \
            "$browser_tools" "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: Compare real Chromium product Workers at 4194
        if: ${{ !cancelled() && steps.product-wasm.outcome == 'success' && steps.browser-tools.outcome == 'success' }}
        shell: bash
        run: |
          "$CLEARRA_MANAGE_BIN" --root "$GITHUB_WORKSPACE" runtime run \
            --producer web-cpu-chromium --profile local-service --timeout 360 -- \
            node scripts/tools/run-real-chromium-cpu-worker-smoke.mjs
  p7p4-exact-handoff:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/v090-relation-rust-p7p4'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the exact source and enough managed workspace storage
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          available="$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')"
          printf 'workspace_available_bytes=%s\n' "$available"
          test "$available" -ge 35433480192 || { echo 'P7P4 capture requires 33 GiB free in its artifact volume'; exit 2; }
      - name: Build native proof tools once
        run: |
          cargo build --locked --release -p clearra-manage
          CLEARRA_SOURCE_COMMIT="$GITHUB_SHA" cargo build --locked --release -p clearra-core-executor --features parallel,local-search-ab --example placement_graph_bench
      - name: Compare all per-solution queues under separate supervised leases
        run: |
          node scripts/benchmark/run-placement-coverage-proof.mjs --case p7p4 \
            --id "large-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA"
      - name: Retain bounded proof evidence without publishing raw queue files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: p7p4-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: _local/artifacts/benchmarks/placement-graph-coverage/large-${{ github.run_id }}-${{ github.run_attempt }}-proof/*.json
          if-no-files-found: ignore
          retention-days: 14

  p7p4-same-job-adoption:
    if: >-
      github.repository == 'daejunnom/Clearra' &&
      github.ref_type == 'branch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.run_attempt == '1' &&
      (
        (
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/heads/codex/v090-relation-rust-adoption-') &&
          github.event.created && !github.event.deleted && !github.event.forced &&
          github.event.before == '0000000000000000000000000000000000000000'
        ) ||
        (
          github.event_name == 'workflow_dispatch' && inputs.run_adoption &&
          (github.ref == 'refs/heads/codex/v090-relation-rust-integration' ||
           github.ref == 'refs/heads/codex/v090-relation-rust-p7p4')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # One runner, ten leases of at most 25 minutes plus the 15-minute
      # comparator. Rust receipts use the same lease for proof and timing.
      LEASE_SECONDS: '1500'
      PROOF_ID: hosted-proof-${{ github.run_id }}-${{ github.run_attempt }}
      ADOPTION_ID: hosted-ab-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Bind the explicit opt-in to the exact requested SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -eu
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$GITHUB_EVENT_NAME" in
            push)
              [[ "$GITHUB_REF" == "refs/heads/codex/v090-relation-rust-adoption-$GITHUB_SHA" ]]
              [[ "$PUSH_AFTER_SHA" == "$GITHUB_SHA" ]]
              ;;
            workflow_dispatch)
              [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ && "$REQUESTED_SHA" == "$GITHUB_SHA" ]]
              ;;
            *) exit 2 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact checkout and managed workspace capacity
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          available="$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')"
          printf 'workspace_available_bytes=%s\n' "$available"
          test "$available" -ge 35433480192 || { echo 'P7P4 capture requires 33 GiB free in its artifact volume'; exit 2; }
      - name: Build the exact native tools once on this runner
        timeout-minutes: 35
        shell: bash
        run: |
          set -eu
          cargo build --locked --release -p clearra-manage
          CLEARRA_SOURCE_COMMIT="$GITHUB_SHA" cargo build --locked --release -p clearra-core-executor --features parallel,local-search-ab --example placement_graph_bench
      - name: Qualify all per-solution mappings on this runner
        timeout-minutes: 70
        shell: bash
        run: |
          set -eu
          node scripts/benchmark/run-placement-coverage-proof.mjs --case p7p4 \
            --id "$PROOF_ID" --source-sha "$GITHUB_SHA" --timeout-seconds "$LEASE_SECONDS"
      - name: Measure global-only ABBA and BAAB against the same-runner proof
        timeout-minutes: 215
        shell: bash
        run: |
          set -eu
          status=0
          node scripts/benchmark/run-placement-graph-adoption.mjs --id "$ADOPTION_ID" \
            --proof-id "$PROOF_ID" --source-sha "$GITHUB_SHA" || status=$?
          directory="_local/artifacts/benchmarks/placement-graph-coverage/$ADOPTION_ID-adoption"
          outcome="$(node --input-type=module - "$directory" "$GITHUB_SHA" <<'NODE'
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          const [directory, sha] = process.argv.slice(2);
          const read = (name) => JSON.parse(readFileSync(join(directory, name), "utf8"));
          const summary = read("summary.json");
          if (summary.schema !== "clearra.placement-graph-adoption-run.v1" ||
              summary.source_commit !== sha || summary.release_authority !== false) process.exit(2);
          if (summary.decision !== "decision.json") {
            if (!["failed", "censored", "confounded"].includes(summary.state)) process.exit(2);
          } else {
            const decision = read("decision.json");
            if (decision.schema !== "clearra.placement-graph-adoption.v1" ||
                decision.release_authority !== false ||
                summary.binary_sha256 !== decision.binary_sha256 ||
                !["adoptable", "not-adoptable"].includes(decision.status) ||
                summary.state !== "completed-" + decision.status) process.exit(2);
          }
          process.stdout.write(summary.state);
          NODE
          )"
          case "$status:$outcome" in
            0:completed-adoptable)
              echo 'Exact mapping proof and timing criteria passed on this runner. No product default was changed.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            1:completed-not-adoptable)
              echo 'Exact mapping proof verified; the completed timing comparison did not support adoption.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Timing comparison did not complete validly: $outcome (exit $status)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
      - name: Retain bounded proof and timing JSON only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: p7p4-adoption-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
