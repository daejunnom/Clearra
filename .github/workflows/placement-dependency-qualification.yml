name: Placement Dependency Qualification

on:
  push:
    branches: [codex/v090-relation-rust-integration, codex/v090-relation-rust-p7p4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: placement-dependency-qualification-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_MIN_STACK: '16777216'

jobs:
  relation-and-mapping:
    if: github.ref == 'refs/heads/codex/v090-relation-rust-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compare CEGIS, ILC, APDP and coverage capture with focused references
        shell: bash
        run: |
          set -eu
          cargo test --locked -p clearra-core-executor --features parallel,local-search-ab --lib --no-run
          status=0
          for filter in structural_graph_probability_tests bounded_no_entry first_kick_interval_preserves ordered_kick_interval_requires reachability::reference_tests incremental_domain_ exact_clear_domain_tests placement_conditions::tests capture_candidate_solution_coverage_matches_explicit_product_rows direct_p7p4_capture_ candidate_witness_only_reads conditional_language_ native_parallel_terminal_identity_move nonempty_eight_i_advanced_domain_preserves_fixture_identities lazy_frame_; do
            cargo test --locked -p clearra-core-executor --features parallel,local-search-ab --lib "$filter" || status=1
          done
          exit "$status"
      - name: Test the bounded solution stream and exact comparison
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-core-executor --features parallel,local-search-ab --example placement_graph_bench
      - name: Verify supervised capture and comparison on the one-I fixture
        if: ${{ !cancelled() }}
        run: |
          set -eu
          df --output=avail -B1 "$GITHUB_WORKSPACE"
          CARGO_PROFILE_DEV_DEBUG=0 cargo build --locked -p clearra-manage
          CLEARRA_SOURCE_COMMIT="$GITHUB_SHA" CARGO_PROFILE_DEV_DEBUG=0 cargo build --locked -p clearra-core-executor --features parallel,local-search-ab --example placement_graph_bench
          node scripts/benchmark/run-placement-coverage-proof.mjs --case small --build-profile debug \
            --id "small-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA"
  receipts-and-adoption:
    if: github.ref == 'refs/heads/codex/v090-relation-rust-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Test native exit and memory receipt classification
        run: cargo test --locked -p clearra-manage --bin clearra-manage runtime::tests
      - name: Test the local adoption evaluator
        if: ${{ !cancelled() }}
        run: node --test scripts/tools/placement-graph-adoption.test.mjs scripts/benchmark/run-placement-coverage-proof.test.mjs scripts/benchmark/run-placement-graph-adoption.test.mjs
  operation-reuse:
    if: github.ref == 'refs/heads/codex/v090-relation-rust-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Test normalized ordered kicks and stable replay identifiers
        run: cargo test --locked -p clearra-rules -p clearra-finesse -p clearra-core-ffi -p clearra-pc-graph --lib --no-fail-fast
      - name: Test the legacy Cover Rust service boundary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node scripts/tools/invoke-clearra-build.mjs --purpose experiment -- bash -e -u <<'SH'
          out="$CLEARRA_BUILD_TRANSACTION_ROOT/legacy-cover-core-c"
          cmake -S core-c -B "$out" -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$out" --target clearra_core --parallel 2
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-L native=$out"
          status=0
          cargo test --locked -p clearra-app --features native-c-core --lib legacy_cover_tests || status=1
          cargo test --locked -p clearra-app --features native-c-core --test extended_pc_tiling full_height_fixed_queue_scenario_replay_reuses_the_same_rust_family || status=1
          exit "$status"
          SH
  p7p4-exact-handoff:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/v090-relation-rust-p7p4'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the exact source and enough managed workspace storage
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          available="$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')"
          printf 'workspace_available_bytes=%s\n' "$available"
          test "$available" -ge 35433480192 || { echo 'P7P4 capture requires 33 GiB free in its artifact volume'; exit 2; }
      - name: Build native proof tools once
        run: |
          cargo build --locked --release -p clearra-manage
          CLEARRA_SOURCE_COMMIT="$GITHUB_SHA" cargo build --locked --release -p clearra-core-executor --features parallel,local-search-ab --example placement_graph_bench
      - name: Compare all per-solution queues under separate supervised leases
        run: |
          node scripts/benchmark/run-placement-coverage-proof.mjs --case p7p4 \
            --id "large-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA"
      - name: Retain bounded proof evidence without publishing raw queue files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: p7p4-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: _local/artifacts/benchmarks/placement-graph-coverage/large-${{ github.run_id }}-${{ github.run_attempt }}-proof/*.json
          if-no-files-found: ignore
          retention-days: 14
