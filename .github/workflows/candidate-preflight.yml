name: Candidate Preflight

on:
  push:
    branches: ["codex/v0.8.0-preflight-20260906-rng"]
  workflow_dispatch:
    inputs:
      full_gate:
        description: Run the complete non-publishing gate (false selects focused Rust/WASM/CLI/UI feedback)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # Preserve feedback and source-bound artifacts for an older SHA while the
  # next correctness fix is checked. Repeated requests for one SHA still merge.
  group: candidate-preflight-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

# Development artifacts only. This workflow produces no canonical acceptance
# evidence and cannot publish a release or change Pages/Discord/Cloud traffic.
jobs:
  candidate-source:
    if: github.ref == 'refs/heads/codex/v0.8.0-preflight-20260906-rng' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      full_gate: ${{ steps.source.outputs.full_gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind the isolated candidate branch and exact source
        id: source
        env:
          REQUEST_FULL_GATE: ${{ inputs.full_gate }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/codex/v0.8.0-preflight-20260906-rng' && "$GITHUB_REF_TYPE" == 'branch' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          case "$GITHUB_EVENT_NAME" in
            push) echo 'full_gate=false' >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch)
              [[ "$REQUEST_FULL_GATE" == 'true' || "$REQUEST_FULL_GATE" == 'false' ]]
              echo "full_gate=$REQUEST_FULL_GATE" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 2 ;;
          esac

  candidate-full-gate:
    if: needs.candidate-source.outputs.full_gate == 'true'
    needs: candidate-source
    # Same hosted Windows family as the canonical executable acceptance leaves.
    # Keep its native execution policy checks: no signing/unblocking/fallback.
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript workspace
        run: npm ci --ignore-scripts
      # Read a compatible canonical build snapshot, but never publish cache or
      # acceptance evidence from this unqualified branch.
      - name: Restore verified native build inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen.exe
            ~/.cargo/registry
            ~/.cargo/git
          key: release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-
      - name: Prepare acceptance toolchains
        shell: powershell
        run: |
          rustup target add wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tool = Get-Command wasm-bindgen -ErrorAction SilentlyContinue
          if ($null -eq $tool -or (& wasm-bindgen --version) -ne 'wasm-bindgen 0.2.126') {
            & ./scripts/tools/invoke-clearra-build.ps1 -SourceRoot $env:GITHUB_WORKSPACE -Purpose experiment -Command cargo -ArgumentsJson '["install","wasm-bindgen-cli","--version","0.2.126","--locked"]'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check non-publishing workflow and artifact boundaries
        run: node --test scripts/release/candidate-preflight-workflow.test.mjs scripts/release/candidate-preflight-artifacts.test.mjs
      - name: Run the complete gate once without release authority
        id: candidate_wasm
        shell: powershell
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          Ensure-ClearraBuildArtifactCache -RepositoryRoot $env:GITHUB_WORKSPACE -Purpose experiment
          try {
            $candidateWorkers = [Math]::Max(1, [Environment]::ProcessorCount)
            $gateExitCode = 1
            try {
              & powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard Full -ExecutionSurface Trusted -RuntimeEnvironment windows -Workers $candidateWorkers -VerboseLog -ShowWarnings
              $gateExitCode = $LASTEXITCODE
            } finally {
              # Preserve only verified output while the same experiment owner is alive.
              $candidateWasmSource = Join-Path $env:CARGO_TARGET_DIR 'clearra-web-public/wasm'
              $candidateWasmOutput = Join-Path $env:CLEARRA_BUILD_TRANSACTION_ROOT 'unqualified-candidate-wasm'
              & node scripts/release/candidate-preflight-artifacts.mjs --from $candidateWasmSource --output $candidateWasmOutput --source-commit $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw 'Candidate WASM preservation failed' }
              "artifact_path=$candidateWasmOutput" >> $env:GITHUB_OUTPUT
            }
            if ($gateExitCode -ne 0) { exit $gateExitCode }
            Complete-ClearraBuildTransaction
          } finally {
            Exit-ClearraBuildArtifactCacheUsage
          }
      - name: Upload verified but unqualified candidate WASM
        if: always() && steps.candidate_wasm.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unqualified-candidate-wasm-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.candidate_wasm.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  # Native regressions and WASM compilation have no artifact dependency. Keep
  # every regression, but let both source-bound leaves start immediately.
  candidate-rust:
    if: needs.candidate-source.outputs.full_gate == 'false'
    needs: candidate-source
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore verified native build inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen.exe
            ~/.cargo/registry
            ~/.cargo/git
          key: release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'package-lock.json') }}-
      - name: Bind trusted native regression source
        shell: powershell
        run: |
          if ((& git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Candidate source mismatch' }
          . ./scripts/lib/clearra-path-helpers.ps1
          . ./scripts/lib/clearra-execution-surface.ps1
          Assert-ClearraTrustedExecutionSurface -TaskName 'CandidateRustWasm' -ExecutionSurface Trusted -RuntimeEnvironment windows
      - name: Check fixed native regression boundaries
        run: node --test scripts/release/candidate-preflight-workflow.test.mjs scripts/release/candidate-preflight-regressions.test.mjs
      - name: Run fixed current-regression selections without the full workspace suite
        shell: powershell
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          Ensure-ClearraBuildArtifactCache -RepositoryRoot $env:GITHUB_WORKSPACE -Purpose experiment
          try {
            & node scripts/release/candidate-preflight-regressions.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Complete-ClearraBuildTransaction
          } finally {
            Exit-ClearraBuildArtifactCacheUsage
          }

  candidate-rust-wasm:
    if: needs.candidate-source.outputs.full_gate == 'false'
    needs: candidate-source
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore verified WASM build inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
          key: release-acceptance-wasm-v5-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-wasm-v5-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml') }}-
      - name: Prepare candidate toolchains
        id: toolchains
        shell: pwsh
        run: |
          if ((& git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Candidate source mismatch' }
          . ./scripts/lib/clearra-path-helpers.ps1
          . ./scripts/lib/clearra-execution-surface.ps1
          Assert-ClearraTrustedExecutionSurface -TaskName 'CandidateRustWasm' -ExecutionSurface Trusted -RuntimeEnvironment wasm
          $cargoJobs = [Math]::Max(1, [Environment]::ProcessorCount)
          "CARGO_BUILD_JOBS=$cargoJobs" >> $env:GITHUB_ENV
          "wasm_compile_context=unqualified-candidate task_workers=1 cargo_jobs=$cargoJobs"
          rustup target add wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tool = Get-Command wasm-bindgen -ErrorAction SilentlyContinue
          if ($null -eq $tool -or (& wasm-bindgen --version) -ne 'wasm-bindgen 0.2.126') {
            & ./scripts/tools/invoke-clearra-build.ps1 -SourceRoot $env:GITHUB_WORKSPACE -Purpose experiment -Command cargo -ArgumentsJson '["install","wasm-bindgen-cli","--version","0.2.126","--locked"]'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check non-publishing focused feedback boundaries
        id: boundaries
        run: node --test scripts/release/candidate-preflight-workflow.test.mjs scripts/release/candidate-preflight-regressions.test.mjs scripts/release/candidate-preflight-artifacts.test.mjs
      - name: Build source-bound WASM once for independent unqualified feedback
        id: candidate_wasm
        if: ${{ !cancelled() && steps.toolchains.outcome == 'success' && steps.boundaries.outcome == 'success' }}
        shell: pwsh
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          Ensure-ClearraBuildArtifactCache -RepositoryRoot $env:GITHUB_WORKSPACE -Purpose experiment
          try {
            $candidateWasmBuild = Join-Path $env:CLEARRA_BUILD_TRANSACTION_ROOT 'candidate-wasm-built'
            & node scripts/tools/build-clearra-wasm.mjs --environment native --destination $candidateWasmBuild
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $candidateWasmSource = $candidateWasmBuild
            $candidateWasmOutput = Join-Path $env:CLEARRA_BUILD_TRANSACTION_ROOT 'unqualified-candidate-wasm'
            & node scripts/release/candidate-preflight-artifacts.mjs --from $candidateWasmSource --output $candidateWasmOutput --source-commit $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "artifact_path=$candidateWasmOutput" >> $env:GITHUB_OUTPUT
            Complete-ClearraBuildTransaction
          } finally {
            Exit-ClearraBuildArtifactCacheUsage
          }
      - name: Upload verified but unqualified focused WASM
        if: always() && steps.candidate_wasm.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unqualified-candidate-wasm-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.candidate_wasm.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  candidate-cli:
    if: needs.candidate-source.outputs.full_gate == 'false'
    needs: candidate-source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 22
      - name: Check release metadata and smoke wiring
        id: metadata
        run: node scripts/release/validate-release-metadata.mjs --tag v0.8.0
      - name: Check independent release smoke wiring
        id: smokes
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node scripts/tools/validate-release-cli-smokes.mjs
      - name: Check independent publication fixture contracts
        id: fixtures
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node --test scripts/release/release-publication-evidence.test.mjs scripts/release/final-source-stage-evidence.test.mjs
      - name: Compile candidate CLI
        id: compile
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' && steps.smokes.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        shell: pwsh
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          Ensure-ClearraBuildArtifactCache -RepositoryRoot $env:GITHUB_WORKSPACE -Purpose experiment
          try {
            cargo build --locked --release --package clearra-cli --features wasm-cpu-runtime,webgpu-search
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $candidateCli = Join-Path $env:CARGO_TARGET_DIR 'release/clearra'
            if (-not (Test-Path -LiteralPath $candidateCli -PathType Leaf)) { throw 'Candidate CLI was not built' }
            "binary_path=$candidateCli" >> $env:GITHUB_OUTPUT
            & $candidateCli --help
            $startupExitCode = $LASTEXITCODE
            # Both checks consume this owner's binary even if the startup check failed.
            cargo test --locked --release --package clearra-cli --features wasm-cpu-runtime,webgpu-search --lib score_finder_renderer_ -- --nocapture
            $rendererExitCode = $LASTEXITCODE
            if ($startupExitCode -ne 0) { exit $startupExitCode }
            if ($rendererExitCode -ne 0) { exit $rendererExitCode }
            Complete-ClearraBuildTransaction
          } finally {
            Exit-ClearraBuildArtifactCacheUsage
          }
      - name: Publish unqualified development binary
        if: ${{ !cancelled() && steps.compile.outputs.binary_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unqualified-candidate-cli-${{ github.sha }}
          path: ${{ steps.compile.outputs.binary_path }}
          if-no-files-found: error
          retention-days: 3
  candidate-minimum-diagnostic:
    if: needs.candidate-source.outputs.full_gate == 'false'
    needs: candidate-source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
      RUST_MIN_STACK: "16777216"
      CLEARRA_CTK3_PARALLEL_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind diagnostic source without publishing authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Export the actual Jstris 180 source matrix without a supplied solution
        shell: pwsh
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          Ensure-ClearraBuildArtifactCache -RepositoryRoot $env:GITHUB_WORKSPACE -Purpose experiment
          try {
            cargo test --locked --release --package clearra-wasm --test pc_minimals_ctk3_stage_probe ctk3_export_jstris_180_exact_cover_diagnostic_matrix -- --exact --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --release --package clearra-wasm --test pc_minimals_ctk3_stage_probe ctk3_diagnostic_ -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --release --package clearra-wasm --test pc_minimals_ctk3_stage_probe ctk3_jstris_180_residual_warm_seed_first_canonical_ab_probe -- --exact --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Complete-ClearraBuildTransaction
          } finally {
            Exit-ClearraBuildArtifactCacheUsage
          }
      - name: Preserve source-only comparison matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unqualified-jstris-matrix-${{ github.sha }}-run-${{ github.run_id }}
          path: _local/exact-cover-fixtures/*.json
          if-no-files-found: error
          retention-days: 3

  candidate-ui:
    if: needs.candidate-source.outputs.full_gate == 'false'
    needs: candidate-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Compile GUI components without running the test matrix
        run: node scripts/desktop-ui-compile-check.mjs
