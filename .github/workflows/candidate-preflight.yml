name: Candidate Preflight

on:
  workflow_dispatch:
    inputs:
      full_gate:
        description: Run the complete non-publishing gate (false selects focused Rust/WASM/CLI/UI feedback)
        required: true
        default: true
        type: boolean
      profiling_artifacts:
        description: Build only the exact-source diagnostic Windows CLI and Web WASM (no performance run)
        default: false
        type: boolean
      profiling_wasm_only:
        description: In profiling artifact mode, skip the Windows CLI for a browser-only comparison
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Preserve feedback and source-bound artifacts for an older SHA while the
  # next correctness fix is checked. Repeated requests for one SHA still merge.
  group: candidate-preflight-${{ github.ref }}-${{ github.sha }}${{ inputs.profiling_artifacts && '-stage-profile' || '' }}
  cancel-in-progress: true

# Development artifacts only. This workflow produces no canonical acceptance
# evidence and cannot publish a release or change Pages/Discord/Cloud traffic.
jobs:
  candidate-source:
    # One explicit candidate run per source SHA. Pushing a second branch is
    # not a prerequisite for the native or browser readbacks.
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      full_gate: ${{ steps.source.outputs.full_gate }}
      profiling_artifacts: ${{ steps.source.outputs.profiling_artifacts }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind the candidate branch and exact source
        id: source
        env:
          REQUEST_FULL_GATE: ${{ inputs.full_gate }}
          REQUEST_PROFILING_ARTIFACTS: ${{ inputs.profiling_artifacts }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == 'branch' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$REQUEST_FULL_GATE" == 'true' || "$REQUEST_FULL_GATE" == 'false' ]]
          [[ "$REQUEST_PROFILING_ARTIFACTS" == 'true' || "$REQUEST_PROFILING_ARTIFACTS" == 'false' ]]
          echo "profiling_artifacts=$REQUEST_PROFILING_ARTIFACTS" >> "$GITHUB_OUTPUT"
          if [[ "$REQUEST_PROFILING_ARTIFACTS" == 'false' ]]; then
            echo "full_gate=$REQUEST_FULL_GATE" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Check candidate authority and artifact boundaries once
        run: node --test scripts/release/candidate-preflight-workflow.test.mjs scripts/release/candidate-preflight-regressions.test.mjs scripts/release/candidate-preflight-artifacts.test.mjs

  candidate-full-gate:
    if: needs.candidate-source.outputs.full_gate == 'true'
    needs: candidate-source
    name: Candidate checks (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: no-product-debt
            task: ReleaseAcceptance
            shard: FoundationNoProductDebt
            pnpm: true
          - suite: adversarial
            task: ReleaseAcceptance
            shard: FoundationAdversarialCorrectness
            pnpm: false
          - suite: sanitizer
            task: ReleaseAcceptance
            shard: Sanitizer
            pnpm: false
          - suite: rust-exact
            task: ReleaseAcceptance
            shard: RustExact
            pnpm: false
          - suite: product-e2e
            # No release receipt exists in preflight. The product task owns
            # exactly one CLI build; the canonical RustProduct shard cannot.
            task: ProductE2E
            shard: Full
            pnpm: true
          - suite: desktop-host
            task: ReleaseAcceptance
            shard: FoundationDesktopHost
            pnpm: true
          - suite: wasm
            task: ReleaseAcceptance
            shard: Pages
            pnpm: true
    # Native suites retain Windows execution-policy checks. The browser suite
    # compiles the same WASM target on the Linux/Chromium host used by the
    # product-worker readback; canonical Windows source contracts remain separate.
    runs-on: ${{ matrix.suite == 'wasm' && 'ubuntu-24.04' || 'windows-latest' }}
    timeout-minutes: 120
    env:
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
      RUST_MIN_STACK: "16777216"
      # The independent native test runners need assertions, not full PDBs.
      # Leave release compilation and the managed slot's capacity unchanged.
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Bind exact Corepack pnpm
        if: matrix.pnpm == true
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          if ((pnpm --version).Trim() -ne '11.5.0') { throw 'pnpm version mismatch' }
      - name: Install JavaScript workspace
        if: matrix.pnpm == true
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Read a compatible canonical build snapshot, but never publish cache or
      # acceptance evidence from this unqualified branch.
      - name: Restore verified native build inputs
        if: matrix.suite != 'wasm'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/tools/cargo/wasm-bindgen-cli/0.2.126
            ~/.cargo/registry
            ~/.cargo/git
          key: release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-
      - name: Restore verified WASM build inputs
        if: matrix.suite == 'wasm'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/tools/cargo/wasm-bindgen-cli/0.2.126
            ~/.cargo/registry
            ~/.cargo/git
          key: release-acceptance-wasm-v5-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-wasm-v5-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml') }}-
      - name: Prepare WASM toolchain
        if: matrix.suite == 'wasm'
        shell: pwsh
        run: |
          rustup target add wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tool = Get-Command wasm-bindgen -ErrorAction SilentlyContinue
          if ($null -eq $tool -or (& wasm-bindgen --version) -ne 'wasm-bindgen 0.2.126') {
            & ./scripts/tools/install-managed-cargo-tool.ps1 -Purpose experiment -ToolName wasm-bindgen-cli -Version 0.2.126
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run candidate checks without release authority
        id: candidate_wasm
        env:
          CANDIDATE_TASK: ${{ matrix.task }}
          CANDIDATE_SHARD: ${{ matrix.shard }}
          CANDIDATE_SUITE: ${{ matrix.suite }}
        shell: pwsh
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          Ensure-ClearraBuildArtifactCache -RepositoryRoot $env:GITHUB_WORKSPACE -Purpose experiment
          try {
            $candidateWorkers = [Math]::Max(1, [Environment]::ProcessorCount)
            $candidateShell = if ($IsWindows) { 'powershell' } else { 'pwsh' }
            $candidateRuntime = if ($IsWindows) { 'windows' } else { 'wasm' }
            $startupProofFailed = $false
            if ($env:CANDIDATE_SUITE -eq 'desktop-host') {
              try {
                & pwsh -NoProfile -File scripts/tools/verify-windows-desktop-runtime.test.ps1
                $startupProofFailed = $LASTEXITCODE -ne 0
              } catch {
                Write-Warning $_
                $startupProofFailed = $true
              }
            }
            & $candidateShell -NoProfile -File scripts/clearra.ps1 -Task $env:CANDIDATE_TASK -ReleaseAcceptanceShard $env:CANDIDATE_SHARD -ExecutionSurface Trusted -RuntimeEnvironment $candidateRuntime -Workers $candidateWorkers -VerboseLog -ShowWarnings
            $gateExitCode = $LASTEXITCODE
            if ($env:CANDIDATE_SUITE -eq 'wasm') {
              # Preserve any produced WASM under the same experiment owner.
              # If this check failed before producing WASM, report its actual
              # failure rather than trying to seal a missing directory.
              $candidateWasmSource = Join-Path $env:CARGO_TARGET_DIR 'clearra-web-public/wasm'
              $wasmProduced = Test-Path -LiteralPath (Join-Path $candidateWasmSource 'clearra_wasm_bg.wasm') -PathType Leaf
              if ($gateExitCode -eq 0 -and -not $wasmProduced) {
                throw 'WASM checks passed without producing the candidate artifact'
              }
              if ($wasmProduced) {
                $candidateWasmOutput = Join-Path $env:CLEARRA_BUILD_TRANSACTION_ROOT 'unqualified-candidate-wasm'
                & node scripts/release/candidate-preflight-artifacts.mjs --from $candidateWasmSource --output $candidateWasmOutput --source-commit $env:GITHUB_SHA
                if ($LASTEXITCODE -ne 0) { throw 'Candidate WASM preservation failed' }
              }
            }
            if ($gateExitCode -ne 0) { exit $gateExitCode }
            if ($startupProofFailed) { throw 'Windows startup-proof fixtures failed' }
            Complete-ClearraBuildTransaction
          } finally {
            Exit-ClearraBuildArtifactCacheUsage
          }
      - name: Upload verified but unqualified candidate WASM
        if: ${{ !cancelled() && matrix.suite == 'wasm' && steps.candidate_wasm.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: unqualified-candidate-wasm-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.candidate_wasm.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  candidate-linux-native-readback:
    if: needs.candidate-source.outputs.full_gate == 'true'
    needs: candidate-source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
      CLEARRA_REAL_DESKTOP_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_REAL_PC24_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_REAL_PC24_MANAGED_CLI: '1'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Bind exact source and locked render dependencies
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          test "$(pnpm --version)" = '11.5.0'
          pnpm install --frozen-lockfile --ignore-scripts
          node packages/clearra-ui/scripts/prepare-test-dependencies.mjs
      - name: Run bounded native product checks from one build owner
        shell: pwsh
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          Ensure-ClearraBuildArtifactCache -RepositoryRoot $env:GITHUB_WORKSPACE -Purpose experiment
          try {
            $output = Join-Path $env:GITHUB_WORKSPACE '_local/artifacts/v081-desktop-native-smoke'
            New-Item -Path $output -ItemType Directory -Force | Out-Null
            $cargoMessages = @(cargo test --locked -p clearra-cli --test desktop_full_height_products --no-default-features `
              --features 'wasm-cpu-runtime,clearra-gui-host/wasm-cpu-runtime' --no-run --message-format=json)
            $compileExitCode = $LASTEXITCODE
            $desktopHarnesses = @(
              foreach ($line in $cargoMessages) {
                $message = ConvertFrom-Json -InputObject $line -ErrorAction Stop
                if ($message.reason -eq 'compiler-message' -and $message.message.rendered) {
                  Write-Host $message.message.rendered
                }
                if ($message.reason -eq 'compiler-artifact' -and $message.target.name -eq 'desktop_full_height_products' -and $message.executable) {
                  $message.executable
                }
              }
            )
            $desktopExitCode = 1
            if ($compileExitCode -eq 0 -and $desktopHarnesses.Count -eq 1) {
              & timeout --kill-after=3s 120s $desktopHarnesses[0] --ignored --test-threads=1
              $desktopExitCode = $LASTEXITCODE
            }
            # Use the exact Linux CLI compiled alongside the Desktop probe.
            # Do not rebuild it with a different Discord-specific recipe.
            $env:CLEARRA_REAL_PC24_CLI = Join-Path $env:CARGO_TARGET_DIR 'debug/clearra'
            $discordExitCode = 1
            if ($compileExitCode -eq 0 -and (Test-Path -LiteralPath $env:CLEARRA_REAL_PC24_CLI -PathType Leaf)) {
              node --test apps/clearra-discord-bot/test/realCliFullHeightProducts.test.mjs
              $discordExitCode = $LASTEXITCODE
            }
            cargo test --locked -p clearra-forward-search --lib recovery_build_result_tile_waits_for_the_actual_middle_clear
            $recoveryExitCode = $LASTEXITCODE
            cargo test --locked -p clearra-rules --lib
            $rulesExitCode = $LASTEXITCODE
            node --test apps/clearra-discord-bot/test/job-service.test.mjs apps/clearra-discord-bot/test/command.test.mjs
            $discordContractExitCode = $LASTEXITCODE
            if ($desktopExitCode -ne 0 -or $discordExitCode -ne 0 -or $recoveryExitCode -ne 0 -or $rulesExitCode -ne 0 -or $discordContractExitCode -ne 0) {
              throw "Candidate native readback failed: Desktop=$desktopExitCode Discord=$discordExitCode Recovery=$recoveryExitCode Rules=$rulesExitCode DiscordContracts=$discordContractExitCode"
            }
            Complete-ClearraBuildTransaction
          } finally {
            Exit-ClearraBuildArtifactCacheUsage
          }

  # Native regressions and WASM compilation have no artifact dependency. Keep
  # every regression, but let both source-bound leaves start immediately.
  candidate-rust:
    if: needs.candidate-source.outputs.full_gate == 'false'
    needs: candidate-source
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Match the canonical test harness; debug symbols are not release evidence.
      CARGO_PROFILE_TEST_DEBUG: '0'
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Restore verified native build inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            build/tools/cargo/wasm-bindgen-cli/0.2.126
            ~/.cargo/registry
            ~/.cargo/git
          key: release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-
      - name: Bind trusted native regression source
        shell: powershell
        run: |
          if ((& git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Candidate source mismatch' }
          . ./scripts/lib/clearra-path-helpers.ps1
          . ./scripts/lib/clearra-execution-surface.ps1
          Assert-ClearraTrustedExecutionSurface -TaskName 'CandidateRustWasm' -ExecutionSurface Trusted -RuntimeEnvironment windows
      - name: Run fixed current-regression selections without the full workspace suite
        shell: powershell
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          # Hosted focused tests do not reuse incremental objects across
          # runs. Use the managed non-incremental storage profile; the job
          # still has no release evidence, upload or deployment authority.
          Ensure-ClearraBuildArtifactCache -RepositoryRoot $env:GITHUB_WORKSPACE -Purpose product
          try {
            & node scripts/release/candidate-preflight-regressions.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Complete-ClearraBuildTransaction
          } finally {
            Exit-ClearraBuildArtifactCacheUsage
          }

  candidate-rust-wasm:
    if: needs.candidate-source.outputs.full_gate == 'false' || needs.candidate-source.outputs.profiling_artifacts == 'true'
    needs: candidate-source
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Restore verified WASM build inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            build/tools/cargo/wasm-bindgen-cli/0.2.126
            ~/.cargo/registry
            ~/.cargo/git
          key: release-acceptance-wasm-v5-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-wasm-v5-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml') }}-
      - name: Prepare candidate toolchains
        id: toolchains
        shell: pwsh
        run: |
          if ((& git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Candidate source mismatch' }
          . ./scripts/lib/clearra-path-helpers.ps1
          . ./scripts/lib/clearra-execution-surface.ps1
          Assert-ClearraTrustedExecutionSurface -TaskName 'CandidateRustWasm' -ExecutionSurface Trusted -RuntimeEnvironment wasm
          $cargoJobs = [Math]::Max(1, [Environment]::ProcessorCount)
          "CARGO_BUILD_JOBS=$cargoJobs" >> $env:GITHUB_ENV
          "wasm_compile_context=unqualified-candidate task_workers=1 cargo_jobs=$cargoJobs"
          rustup target add wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tool = Get-Command wasm-bindgen -ErrorAction SilentlyContinue
          if ($null -eq $tool -or (& wasm-bindgen --version) -ne 'wasm-bindgen 0.2.126') {
            & ./scripts/tools/install-managed-cargo-tool.ps1 -Purpose experiment -ToolName wasm-bindgen-cli -Version 0.2.126
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build source-bound WASM once for independent unqualified feedback
        id: candidate_wasm
        env:
          DIAGNOSTIC_STAGE_PROFILE: ${{ needs.candidate-source.outputs.profiling_artifacts }}
        shell: pwsh
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          Ensure-ClearraBuildArtifactCache -RepositoryRoot $env:GITHUB_WORKSPACE -Purpose experiment
          try {
            $candidateWasmBuild = Join-Path $env:CLEARRA_BUILD_TRANSACTION_ROOT 'candidate-wasm-built'
            $candidateWasmOutput = Join-Path $env:CLEARRA_BUILD_TRANSACTION_ROOT 'unqualified-candidate-wasm'
            $buildArgs = @('--environment', 'native', '--destination', $candidateWasmBuild)
            $preserveArgs = @('--from', $candidateWasmBuild, '--output', $candidateWasmOutput, '--source-commit', $env:GITHUB_SHA)
            if ($env:DIAGNOSTIC_STAGE_PROFILE -eq 'true') {
              $buildArgs += '--stage-profiling'
              $preserveArgs += '--require-stage-profile'
            }
            & node scripts/tools/build-clearra-wasm.mjs @buildArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & node scripts/release/candidate-preflight-artifacts.mjs @preserveArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Complete-ClearraBuildTransaction
          } finally {
            Exit-ClearraBuildArtifactCacheUsage
          }
      - name: Upload verified but unqualified focused WASM
        if: always() && needs.candidate-source.outputs.full_gate == 'false' && steps.candidate_wasm.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unqualified-candidate-wasm-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.candidate_wasm.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload verified diagnostic WASM
        if: needs.candidate-source.outputs.profiling_artifacts == 'true' && steps.candidate_wasm.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unqualified-stage-profile-wasm-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.candidate_wasm.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  candidate-cli:
    if: needs.candidate-source.outputs.full_gate == 'false' || (needs.candidate-source.outputs.profiling_artifacts == 'true' && !inputs.profiling_wasm_only)
    needs: candidate-source
    runs-on: ${{ needs.candidate-source.outputs.profiling_artifacts == 'true' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 40
    env:
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: node
        if: needs.candidate-source.outputs.full_gate == 'false'
        with:
          node-version: 22.23.2
      - name: Check release metadata and smoke wiring
        id: metadata
        if: needs.candidate-source.outputs.full_gate == 'false'
        run: node scripts/release/validate-release-metadata.mjs
      - name: Check independent publication fixture contracts
        id: fixtures
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node --test scripts/release/release-publication-evidence.test.mjs scripts/release/final-source-stage-evidence.test.mjs
      - name: Compile candidate CLI
        id: compile
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        shell: pwsh
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          Ensure-ClearraBuildArtifactCache -RepositoryRoot $env:GITHUB_WORKSPACE -Purpose experiment
          try {
            cargo build --locked --release --package clearra-cli --features wasm-cpu-runtime
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $candidateCli = Join-Path $env:CARGO_TARGET_DIR 'release/clearra'
            if (-not (Test-Path -LiteralPath $candidateCli -PathType Leaf)) { throw 'Candidate CLI was not built' }
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "binary_path=$candidateCli`n", [Text.UTF8Encoding]::new($false))
            & $candidateCli --help
            $startupExitCode = $LASTEXITCODE
            # Both checks consume this owner's binary even if the startup check failed.
            cargo test --locked --release --package clearra-cli --features wasm-cpu-runtime --lib score_finder_renderer_ -- --nocapture
            $rendererExitCode = $LASTEXITCODE
            if ($startupExitCode -ne 0) { exit $startupExitCode }
            if ($rendererExitCode -ne 0) { exit $rendererExitCode }
            Complete-ClearraBuildTransaction
          } finally {
            Exit-ClearraBuildArtifactCacheUsage
          }
      - name: Publish unqualified development binary
        if: ${{ !cancelled() && steps.compile.outputs.binary_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unqualified-candidate-cli-${{ github.sha }}
          path: ${{ steps.compile.outputs.binary_path }}
          if-no-files-found: error
          retention-days: 3
      - name: Restore Windows diagnostic compiler inputs
        if: needs.candidate-source.outputs.profiling_artifacts == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/tools/cargo/wasm-bindgen-cli/0.2.126
            ~/.cargo/registry
            ~/.cargo/git
          key: release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-
      - name: Build exact-source Windows CLI for stage profiling
        if: needs.candidate-source.outputs.profiling_artifacts == 'true'
        id: profile_cli
        shell: pwsh
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          Ensure-ClearraBuildArtifactCache -RepositoryRoot $env:GITHUB_WORKSPACE -Purpose experiment
          try {
            if ((& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Candidate source mismatch' }
            cargo build --locked --release --package clearra-cli --bin clearra --features wasm-cpu-runtime,stage-profiling
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --quiet HEAD --
            if ($LASTEXITCODE -ne 0 -or (& git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Candidate source changed during compilation' }
            $built = Join-Path $env:CARGO_TARGET_DIR 'release/clearra.exe'
            $artifact = Join-Path $env:CLEARRA_BUILD_TRANSACTION_ROOT 'unqualified-stage-profile-cli'
            New-Item -ItemType Directory -Path $artifact | Out-Null
            $staged = Join-Path $artifact 'clearra.exe'
            Copy-Item -LiteralPath $built -Destination $staged -ErrorAction Stop
            $record = [ordered]@{
              schema = 'clearra.windows-cli-stage-profile.v1'
              release_authority = $false
              source_commit = $env:GITHUB_SHA
              engine_build_id = $env:CLEARRA_ENGINE_BUILD_ID
              run_id = $env:GITHUB_RUN_ID
              run_attempt = $env:GITHUB_RUN_ATTEMPT
              path = 'clearra.exe'
              bytes = (Get-Item -LiteralPath $staged).Length
              sha256 = (Get-FileHash -LiteralPath $staged -Algorithm SHA256).Hash.ToLowerInvariant()
              features = @('wasm-cpu-runtime', 'stage-profiling')
            }
            $record | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $artifact 'stage-profile-cli.json') -Encoding utf8
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "artifact_path=$artifact`n", [Text.UTF8Encoding]::new($false))
            Complete-ClearraBuildTransaction
          } finally {
            Exit-ClearraBuildArtifactCacheUsage
          }
      - name: Upload unqualified Windows diagnostic CLI
        if: needs.candidate-source.outputs.profiling_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unqualified-stage-profile-cli-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.profile_cli.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7
  candidate-ui:
    if: needs.candidate-source.outputs.full_gate == 'false'
    needs: candidate-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Bind exact Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          test "$(pnpm --version)" = "11.5.0"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile GUI components without running the test matrix
        run: node scripts/desktop-ui-compile-check.mjs
