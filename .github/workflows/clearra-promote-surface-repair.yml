name: Start verified release gates
run-name: Publish accepted mandatory toolbar and automatic recovery
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-promote-surface-repair.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearra-recovery-release-start
  cancel-in-progress: false
jobs:
  start-gates:
    if: github.repository == 'daejunnom/Clearra'
    runs-on: ubuntu-latest
    timeout-minutes: 160
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51084c78c3a06f355a352b4c013314c151c47709
          fetch-depth: 0
          persist-credentials: true
      - name: Require exact UI acceptance then fast-forward and start canonical gates
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, time, zipfile

          REPO = 'daejunnom/Clearra'
          BASE = '521fee125b478a5a39a90a808d6c471c430c8494'
          SOURCE = '51084c78c3a06f355a352b4c013314c151c47709'
          PARENT = '6d1d5ca38f6019b62a640eb2976f5d38cc8ddd56'
          TREE = '1de6091e27351282dc4a4fe9e4aacc455beecef0'
          GATE_ID = 36258323208
          GATE_CONTROL = '7fb9c4e63b4cd58c121cc851bb13bab6db33b701'
          GATE_WORKFLOW_BLOB = '786a391a16387af768ad12050fe857844e870863'
          BRANCH = 'codex/recovery-gray-fields-20260926'
          SOURCE_ARTIFACT_ID = 10911930346
          SOURCE_ARTIFACT_DIGEST = 'e866611d14b38636ce755fd9a611c0f5c57ba11b7c9f44bf86bc3dcaf1f3ab4a'
          EXPECTED = [
              'crates/clearra-app/src/commands/boundary_recovery_app_command.rs',
              'crates/clearra-cli-command/src/web_command_parser.rs',
              'crates/clearra-cli-command/src/web_command_request.rs',
              'crates/clearra-cli-command/tests/boundary_recovery.rs',
              'crates/clearra-cli/src/args/cli_parser.rs',
              'crates/clearra-cli/src/args/japanese_help_draft.rs',
              'crates/clearra-forward-search/src/boundary_recovery.rs',
              'crates/clearra-forward-search/src/boundary_recovery_auto.rs',
              'crates/clearra-forward-search/src/boundary_recovery_pattern.rs',
              'crates/clearra-forward-search/src/boundary_recovery_population.rs',
              'crates/clearra-forward-search/src/boundary_recovery_tests.rs',
              'packages/clearra-ui/src/lib/i18n/componentCatalog.ts',
              'packages/clearra-ui/src/lib/workspace/BoundaryRecoveryControls.svelte',
              'packages/clearra-ui/src/lib/workspace/BoundaryRecoveryFields.svelte',
              'packages/clearra-ui/src/lib/workspace/BoundaryRecoveryWorkspace.svelte',
              'packages/clearra-ui/src/lib/workspace/BuildProbabilityControls.svelte',
              'packages/clearra-ui/src/lib/workspace/BuildProbabilityResult.svelte',
              'packages/clearra-ui/src/lib/workspace/BuildProbabilityWorkspace.svelte',
              'packages/clearra-ui/src/lib/workspace/MandatorySelectionSummary.svelte',
              'packages/clearra-ui/src/lib/workspace/PcSolverResult.svelte',
              'packages/clearra-ui/src/lib/workspace/PcSolverStandalone.svelte',
              'packages/clearra-ui/src/lib/workspace/ProductResultPager.svelte',
              'packages/clearra-ui/src/lib/workspace/ResultWorkspace.svelte',
              'packages/clearra-ui/src/lib/workspace/RuleProfileSelect.svelte',
              'packages/clearra-ui/src/lib/workspace/SearchControls.svelte',
              'packages/clearra-ui/src/lib/workspace/SolutionGallery.svelte',
              'packages/clearra-ui/src/lib/workspace/SolutionSubsetPage.svelte',
              'packages/clearra-ui/src/lib/workspace/SolutionToolbar.svelte',
              'packages/clearra-ui/src/lib/workspace/SolverWorkspace.svelte',
              'packages/clearra-ui/src/lib/workspace/SpinProfileSelect.svelte',
              'packages/clearra-ui/src/lib/workspace/WorkspaceBoardEditor.svelte',
              'packages/clearra-ui/src/lib/workspace/WorkspaceToggle.svelte',
              'packages/clearra-ui/src/lib/workspace/boundaryRecoveryModel.ts',
              'packages/clearra-ui/test/boundaryRecoveryAutomatic.test.mjs',
              'packages/clearra-ui/test/boundaryRecoveryFields.test.mjs',
              'scripts/desktop-ui-compile-check.mjs',
              'scripts/lib/wasm-release-gate.ps1',
              'scripts/tools/recovery-editor-browser-acceptance.mjs',
              'scripts/tools/solution-toolbar-browser-acceptance.mjs',
              'scripts/tools/surface-browser-acceptance.mjs',
          ]
          SHARDS = ['FoundationNoProductDebt', 'FoundationAdversarialCorrectness',
                    'FoundationDesktopHost', 'Sanitizer', 'RustExact', 'RustProduct', 'Pages']
          EXPECTED_JOBS = {'prepare', 'frontend (ubuntu-latest)', 'frontend (windows-latest)',
                           'exact-recovery', 'ready', *(f'acceptance ({s})' for s in SHARDS)}
          receipt_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-polish-publication.json'
          receipt = {'source_commit': SOURCE, 'source_tree': TREE, 'base': BASE,
                     'validation_run_id': GATE_ID, 'validation_control_sha': GATE_CONTROL,
                     'main_written': False, 'tag_written': False, 'stage': 'validating'}

          def save():
              receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')

          def cmd(*args):
              return subprocess.check_output(args, text=True, timeout=120).strip()

          def git(*args):
              return cmd('git', *args)

          def api(path):
              return json.loads(cmd('gh', 'api', 'repos/' + REPO + '/' + path))

          def collection(path, key):
              pages = json.loads(cmd('gh', 'api', '--paginate', '--slurp', 'repos/' + REPO + '/' + path))
              rows = [r for p in pages for r in p[key]]
              if len({r['id'] for r in rows}) != len(rows):
                  raise RuntimeError('Duplicate API identity: ' + path)
              if pages and pages[0].get('total_count', len(rows)) != len(rows):
                  raise RuntimeError('Incomplete API collection: ' + path)
              return rows

          def require_refs(allow_promoted=True):
              main = api('git/ref/heads/main')['object']['sha']
              if main not in ({BASE, SOURCE} if allow_promoted else {SOURCE}):
                  raise RuntimeError('Main moved; reconcile instead of overwriting it')
              if api('git/ref/heads/' + BRANCH)['object']['sha'] != SOURCE:
                  raise RuntimeError('Reviewed UI candidate moved')
              return main

          def runs_for(path):
              return [r for r in collection('actions/runs?head_sha=' + SOURCE + '&event=workflow_dispatch&per_page=100', 'workflow_runs')
                      if r['head_branch'] == 'main' and r['path'] == '.github/workflows/' + path]

          def dispatch_once(path, inputs=None):
              require_refs(False)
              existing = runs_for(path)
              if len(existing) > 1:
                  raise RuntimeError('Ambiguous existing runs: ' + path)
              if existing:
                  run = existing[0]
                  if run['status'] == 'completed' and run['conclusion'] != 'success':
                      raise RuntimeError('Existing execution failed; inspect before retry: ' + str(run['id']))
                  return run
              receipt['dispatch_intent'] = path
              save()
              body = {'ref': 'main'}
              if inputs is not None:
                  body['inputs'] = inputs
              subprocess.run(['gh', 'api', '--method', 'POST', 'repos/' + REPO + '/actions/workflows/' + path + '/dispatches', '--input', '-'],
                             input=json.dumps(body), text=True, check=True, timeout=120)
              for _ in range(24):
                  existing = runs_for(path)
                  if existing:
                      break
                  time.sleep(5)
              if len(existing) != 1:
                  raise RuntimeError('Dispatch readback unresolved; inspect before retrying')
              receipt.pop('dispatch_intent', None)
              return existing[0]

          save()
          if git('rev-parse', 'HEAD') != SOURCE or git('rev-parse', 'HEAD^{tree}') != TREE:
              raise RuntimeError('Reviewed source/tree mismatch')
          if git('show', '-s', '--format=%P', SOURCE) != PARENT:
              raise RuntimeError('Reviewed parent mismatch')
          if git('diff', '--name-only', BASE, SOURCE).splitlines() != EXPECTED:
              raise RuntimeError('Reviewed change scope mismatch')
          git('merge-base', '--is-ancestor', BASE, SOURCE)
          git('diff', '--check', BASE, SOURCE)
          if git('rev-parse', GATE_CONTROL + ':.github/workflows/clearra-safe-integration-audit.yml') != GATE_WORKFLOW_BLOB:
              raise RuntimeError('Validation workflow definition mismatch')
          require_refs()

          # The gate's prepare job generated a commit. Bind its exact receipt,
          # not the control branch SHA, and never execute downloaded artifacts.
          metadata = api('actions/artifacts/' + str(SOURCE_ARTIFACT_ID))
          if (metadata['name'] != 'ui-polish-source-' + str(GATE_ID) or metadata['expired']
                  or metadata['workflow_run']['id'] != GATE_ID
                  or metadata['workflow_run']['head_sha'] != GATE_CONTROL
                  or metadata['digest'] != 'sha256:' + SOURCE_ARTIFACT_DIGEST):
              raise RuntimeError('Source preparation artifact identity mismatch')
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-polish-source.zip'
          with archive.open('xb') as output:
              subprocess.run(['gh', 'api', 'repos/' + REPO + '/actions/artifacts/' + str(SOURCE_ARTIFACT_ID) + '/zip'],
                             stdout=output, check=True, timeout=120)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != SOURCE_ARTIFACT_DIGEST:
              raise RuntimeError('Source preparation artifact checksum mismatch')
          with zipfile.ZipFile(archive) as bundle:
              if bundle.namelist().count('receipt.json') != 1 or bundle.getinfo('receipt.json').file_size > 65536:
                  raise RuntimeError('Ambiguous or oversized source receipt')
              prepared = json.loads(bundle.read('receipt.json'))
          for field, expected in [('source_commit', SOURCE), ('parent', PARENT), ('base', BASE), ('tree', TREE)]:
              if prepared.get(field) != expected:
                  raise RuntimeError('Prepared source mismatch: ' + field)
          if prepared.get('main_written') is not False:
              raise RuntimeError('Source preparation unexpectedly promoted main')
          receipt['source_artifact_id'] = SOURCE_ARTIFACT_ID
          save()

          deadline = time.monotonic() + 9000
          while True:
              gate = api('actions/runs/' + str(GATE_ID))
              if (gate['head_sha'] != GATE_CONTROL or gate['head_branch'] != 'codex/clearra-safe-integration-20260925'
                      or gate['path'] != '.github/workflows/clearra-safe-integration-audit.yml'
                      or gate['run_attempt'] != 1 or gate['repository']['full_name'] != REPO
                      or gate['head_repository']['full_name'] != REPO):
                  raise RuntimeError('Pinned validation identity mismatch')
              if gate['status'] == 'completed':
                  if gate['conclusion'] != 'success':
                      raise RuntimeError('Validation did not pass: ' + str(gate['conclusion']))
                  break
              if time.monotonic() >= deadline:
                  raise RuntimeError('Validation wait exceeded its finite deadline')
              require_refs()
              print('Waiting for exact UI acceptance', GATE_ID, gate['status'], flush=True)
              time.sleep(30)

          jobs = collection('actions/runs/' + str(GATE_ID) + '/attempts/1/jobs?per_page=100', 'jobs')
          if len(jobs) != len(EXPECTED_JOBS) or {j['name'] for j in jobs} != EXPECTED_JOBS:
              raise RuntimeError('Expected full independent acceptance inventory')
          if any(j['status'] != 'completed' or j['conclusion'] != 'success' for j in jobs):
              raise RuntimeError('An acceptance job was not successful')
          checks = collection('commits/' + SOURCE + '/check-runs?filter=latest&per_page=100', 'check_runs')
          for name in ['Clearra management policy', 'Clearra management Windows runtime']:
              matching = [c for c in checks if c['name'] == name and c['head_sha'] == SOURCE and c['app']['slug'] == 'github-actions']
              if len(matching) != 1 or matching[0]['status'] != 'completed' or matching[0]['conclusion'] != 'success':
                  raise RuntimeError('Required independent protection is not successful: ' + name)
          receipt['stage'] = 'validated'
          receipt['validated_jobs'] = sorted(EXPECTED_JOBS)
          save()
          if require_refs() == BASE:
              # Subject to repository protection. A rejection stops here; never
              # force, forge a status, or modify a repository rule to promote.
              subprocess.run(['git', 'push', 'origin', SOURCE + ':refs/heads/main'], check=True, timeout=120)
              receipt['main_written'] = True
          require_refs(False)
          receipt['stage'] = 'promoted'
          save()
          release = dispatch_once('release-cli.yml')
          receipt['canonical_release_run_id'] = release['id']
          save()
          queue = dispatch_once('queue-pages-publication.yml', {
              'acceptance_run_id': str(release['id']), 'snapshot_sha': BASE,
          })
          receipt['pages_queue_run_id'] = queue['id']
          receipt['stage'] = 'gates-started'
          receipt['discord'] = 'existing exact-source workflow_run after canonical release success'
          save()
          print(json.dumps(receipt, indent=2), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Exact UI release gates started\n\n')
              f.write(f'Source: `{SOURCE}`\n\nRelease/Tauri: `{release["id"]}`\n\nPages queue: `{queue["id"]}`\n\n')
              f.write('Pages waits for canonical acceptance and rollback capture. Discord follows the existing exact-source release-success path. No tag or final GitHub Release is created here.\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-polish-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-polish-publication.json
          if-no-files-found: warn
          retention-days: 30
