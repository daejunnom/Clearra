name: Start verified release gates
run-name: Promote verified two-supply exchange and start production gates
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-promote-surface-repair.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearra-recovery-release-start
  cancel-in-progress: false
jobs:
  start-gates:
    if: github.repository == 'daejunnom/Clearra'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 13376dee8638cb5de5437ade910f07f5eab20629
          fetch-depth: 0
          persist-credentials: true
      - name: Require real exchange acceptance and push policy before fast-forward
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess,time,zipfile
          REPO='daejunnom/Clearra'
          BASE='7d7fc390b2f65d52ebf8362dff65dcbfcb6d481b'
          SOURCE='13376dee8638cb5de5437ade910f07f5eab20629'
          PARENT='59142804a827e6c533bb2ab3243b4eeb67d3cdaa'
          TREE='a3d368f2aef5af70c2bedbe598f7635962c0dc61'
          BRANCH='codex/review-recovery-two-supplies-exchange-20260927'
          POLICY_BRANCH='codex/converge-two-supply-exchange-20260927'
          POLICY_RUN=36304264338
          GATE_RUN=36304180162
          GATE_CONTROL='5f29d35869b4317f9414f9206fc6a90eaf34db24'
          GATE_BLOB='f2078ecb9ddbc3de8a19f0a3ad42f173a263d206'
          ARTIFACT=10927065402
          ARTIFACT_DIGEST='701cce59dc37534eadb948ae5ab3d7f9159986748b59f8921825c22353453279'
          SHARDS=['FoundationNoProductDebt','FoundationAdversarialCorrectness','FoundationDesktopHost','Sanitizer','RustExact','RustProduct','Pages']
          JOBS={'prepare','native (ubuntu-latest)','native (windows-latest)','frontend (ubuntu-latest)','frontend (windows-latest)','ready',*(f'acceptance ({name})' for name in SHARDS)}
          receipt_path=pathlib.Path(os.environ['RUNNER_TEMP'])/'exchange-publication.json'
          receipt={'source_commit':SOURCE,'source_tree':TREE,'base':BASE,'validation_run_id':GATE_RUN,
                   'management_policy_run_id':POLICY_RUN,'main_written':False,'tag_written':False,
                   'stage':'waiting-for-verified-acceptance','discord':'existing exact-source Release success event; approvals preserved'}
          def save(): receipt_path.write_text(json.dumps(receipt,indent=2)+'\n')
          def cmd(*args): return subprocess.check_output(args,text=True,timeout=120).strip()
          def git(*args): return cmd('git',*args)
          def api(path): return json.loads(cmd('gh','api','repos/'+REPO+'/'+path))
          def collection(path,key):
              pages=json.loads(cmd('gh','api','--paginate','--slurp','repos/'+REPO+'/'+path))
              rows=[row for page in pages for row in page[key]]
              if len({row['id'] for row in rows})!=len(rows): raise RuntimeError('Duplicate API identity: '+path)
              if pages and pages[0].get('total_count',len(rows))!=len(rows): raise RuntimeError('Incomplete API collection: '+path)
              return rows
          def require_refs(promoted=False):
              main=api('git/ref/heads/main')['object']['sha']
              if main not in ({SOURCE} if promoted else {BASE,SOURCE}): raise RuntimeError('Main moved; never overwrite unrelated work')
              for branch in [BRANCH,POLICY_BRANCH]:
                  if api('git/ref/heads/'+branch)['object']['sha']!=SOURCE: raise RuntimeError('Candidate or policy source changed')
              return main
          def run_identity(run,expected):
              for key,value in expected.items():
                  if run.get(key)!=value: raise RuntimeError('Workflow identity mismatch: '+key)
              if run.get('repository',{}).get('full_name')!=REPO or run.get('head_repository',{}).get('full_name')!=REPO:
                  raise RuntimeError('Workflow repository mismatch')
          def wait_success(run_id,expected,timeout):
              deadline=time.monotonic()+timeout
              while True:
                  require_refs()
                  run=api('actions/runs/'+str(run_id));run_identity(run,expected)
                  if run['status']=='completed':
                      if run['conclusion']!='success': raise RuntimeError('Required run failed: '+str(run_id)+' '+str(run['conclusion']))
                      return run
                  if run['status'] not in ('queued','in_progress','pending','waiting','requested'): raise RuntimeError('Unexpected workflow lifecycle')
                  if time.monotonic()>=deadline: raise RuntimeError('Required verification exceeded bounded wait')
                  print('Waiting for exact verification',run_id,run['status'],flush=True);time.sleep(30)
          def runs_for(path):
              return [run for run in collection('actions/runs?head_sha='+SOURCE+'&event=workflow_dispatch&per_page=100','workflow_runs')
                      if run['head_branch']=='main' and run['path']=='.github/workflows/'+path]
          def dispatch_once(path,inputs=None):
              require_refs(True)
              existing=runs_for(path)
              if len(existing)>1: raise RuntimeError('Multiple existing canonical runs; resolve instead of duplicating')
              if existing:
                  run=existing[0]
                  if run['status']=='completed' and run['conclusion']!='success': raise RuntimeError('Inspect failed execution before retrying: '+str(run['id']))
                  return run
              receipt['dispatch_intent']=path;save()
              body={'ref':'main'}
              if inputs is not None:body['inputs']=inputs
              subprocess.run(['gh','api','--method','POST','repos/'+REPO+'/actions/workflows/'+path+'/dispatches','--input','-'],
                             input=json.dumps(body),text=True,check=True,timeout=120)
              for _ in range(24):
                  existing=runs_for(path)
                  if existing:break
                  time.sleep(5)
              if len(existing)!=1: raise RuntimeError('Dispatch readback unresolved; do not blindly redispatch')
              require_refs(True);receipt.pop('dispatch_intent',None)
              return existing[0]
          save()
          if git('rev-parse','HEAD')!=SOURCE or git('rev-parse','HEAD^{tree}')!=TREE: raise RuntimeError('Source/tree mismatch')
          if git('show','-s','--format=%P',SOURCE)!=PARENT: raise RuntimeError('Parent mismatch')
          names=subprocess.check_output(['git','diff','--name-only','-z',BASE,SOURCE],timeout=120)
          if len(names.split(b'\0'))-1!=51 or hashlib.sha256(names).hexdigest()!='114db0ece8a365f8850c88dab738936ffe945622879ea98c3e80f8b84518816c':
              raise RuntimeError('Reviewed 51-file scope mismatch')
          git('merge-base','--is-ancestor',BASE,SOURCE);git('diff','--check',BASE,SOURCE)
          if git('rev-parse',GATE_CONTROL+':.github/workflows/clearra-safe-integration-audit.yml')!=GATE_BLOB: raise RuntimeError('Gate definition mismatch')
          for path,blob in [('release-cli.yml','ff5c8115eb9418a4244bd87f5e20747ed8935c86'),
                            ('discord-deploy.yml','9498800143253562ae62c845cbcfe225c8ecc235'),
                            ('queue-pages-publication.yml','b9a6f290480ffbaff80633972e8b83f134c754b9')]:
              if git('rev-parse',SOURCE+':.github/workflows/'+path)!=blob: raise RuntimeError('Production workflow changed: '+path)
          require_refs()
          metadata=api('actions/artifacts/'+str(ARTIFACT))
          if (metadata['name']!='exchange-candidate-'+str(GATE_RUN) or metadata['expired'] or
              metadata['workflow_run']['id']!=GATE_RUN or metadata['workflow_run']['head_sha']!=GATE_CONTROL or
              metadata['digest']!='sha256:'+ARTIFACT_DIGEST): raise RuntimeError('Source artifact identity mismatch')
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'verified-exchange-source.zip'
          with archive.open('xb') as output:
              subprocess.run(['gh','api','repos/'+REPO+'/actions/artifacts/'+str(ARTIFACT)+'/zip'],stdout=output,check=True,timeout=120)
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=ARTIFACT_DIGEST: raise RuntimeError('Source artifact digest mismatch')
          with zipfile.ZipFile(archive) as bundle:
              if bundle.namelist().count('receipt.json')!=1 or bundle.getinfo('receipt.json').file_size>65536: raise RuntimeError('Invalid source receipt')
              prepared=json.loads(bundle.read('receipt.json'))
          for key,value in [('source_commit',SOURCE),('tree',TREE),('parent',PARENT),('base',BASE),('main_written',False),('published',False)]:
              if prepared.get(key)!=value: raise RuntimeError('Prepared source receipt mismatch: '+key)
          # Do not execute or import files from the downloaded source artifact.
          wait_success(GATE_RUN,{'id':GATE_RUN,'workflow_id':366898635,'head_sha':GATE_CONTROL,
              'head_branch':'codex/clearra-safe-integration-20260925','event':'push','run_attempt':1,
              'path':'.github/workflows/clearra-safe-integration-audit.yml'},9000)
          jobs=collection('actions/runs/'+str(GATE_RUN)+'/attempts/1/jobs?per_page=100','jobs')
          if len(jobs)!=len(JOBS) or {job['name'] for job in jobs}!=JOBS: raise RuntimeError('Incomplete full acceptance inventory')
          if any(job['status']!='completed' or job['conclusion']!='success' for job in jobs): raise RuntimeError('Acceptance job did not succeed')
          policy=wait_success(POLICY_RUN,{'id':POLICY_RUN,'workflow_id':362749959,'head_sha':SOURCE,
              'head_branch':POLICY_BRANCH,'event':'push','run_attempt':1,'path':'.github/workflows/management-policy.yml'},1200)
          policy_jobs=collection('actions/runs/'+str(POLICY_RUN)+'/attempts/1/jobs?per_page=100','jobs')
          if len(policy_jobs)!=2 or {job['name'] for job in policy_jobs}!={'Clearra management policy','Clearra management Windows runtime'}:
              raise RuntimeError('Policy job inventory mismatch')
          checks=collection('commits/'+SOURCE+'/check-runs?filter=all&per_page=100','check_runs')
          for job in policy_jobs:
              if job['head_sha']!=SOURCE or job['status']!='completed' or job['conclusion']!='success': raise RuntimeError('Policy job failed')
              matching=[check for check in checks if check['id']==job['id']]
              if len(matching)!=1: raise RuntimeError('Policy job/check binding missing')
              check=matching[0]
              if (check['head_sha']!=SOURCE or check['name']!=job['name'] or check['check_suite']['id']!=policy['check_suite_id'] or
                  check['app']['id']!=15368 or check['app']['slug']!='github-actions' or check['status']!='completed' or check['conclusion']!='success'):
                  raise RuntimeError('Ineligible repository-protection evidence')
          receipt['stage']='validated';receipt['validated_jobs']=sorted(JOBS);save()
          if require_refs()==BASE:
              # Ordinary push remains subject to repository protection. Never force,
              # forge a check, or alter a rule if GitHub rejects this promotion.
              subprocess.run(['git','push','origin',SOURCE+':refs/heads/main'],check=True,timeout=120)
              receipt['main_written']=True
          require_refs(True);receipt['stage']='promoted';save()
          release=dispatch_once('release-cli.yml')
          receipt['canonical_release_run_id']=release['id'];save()
          queue=dispatch_once('queue-pages-publication.yml',{'acceptance_run_id':str(release['id']),'snapshot_sha':BASE})
          receipt['pages_queue_run_id']=queue['id'];receipt['stage']='gates-started';save()
          print(json.dumps(receipt,indent=2),flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Verified exchange gates started\n\nSource: `'+SOURCE+'`\n\nRelease/Tauri: `'+str(release['id'])+'`\n\nPages queue: `'+str(queue['id'])+'`\n\n')
              f.write('Discord follows the existing exact-source canonical Release success event; environment approval and rollback contracts are unchanged. No version tag or final GitHub Release is created here.\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exchange-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/exchange-publication.json
          if-no-files-found: warn
          retention-days: 30
