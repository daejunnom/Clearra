name: Start verified release gates
run-name: Attach Pages publication to the exact menu release
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-promote-surface-repair.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearra-menu-publication
  cancel-in-progress: false
jobs:
  start-gates:
    if: github.repository == 'daejunnom/Clearra'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 521fee125b478a5a39a90a808d6c471c430c8494
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the existing release before dispatching only the missing Pages queue
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: python
        run: |
          import json,os,pathlib,subprocess,time
          repo='daejunnom/Clearra'
          source='521fee125b478a5a39a90a808d6c471c430c8494'
          base='9f454c93c2c0eb83163445b4bc50aea724f53a8f'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True,timeout=90))
          def exact_runs(path):
              pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp','repos/'+repo+'/actions/runs?head_sha='+source+'&event=workflow_dispatch&per_page=100'],text=True,timeout=90))
              return [r for p in pages for r in p['workflow_runs'] if r['path']==path and r['head_branch']=='main']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          assert api('git/ref/heads/main')['object']['sha']==source
          release=api('actions/runs/36240392036')
          assert release['head_sha']==source and release['head_branch']=='main' and release['path']=='.github/workflows/release-cli.yml'
          if release['status']=='completed' and release['conclusion']!='success': raise RuntimeError('Release failed; do not queue publication')
          existing=exact_runs('.github/workflows/queue-pages-publication.yml')
          if len(existing)>1: raise RuntimeError('Ambiguous exact-source Pages queues')
          if not existing:
              subprocess.run(['gh','api','--method','POST','repos/'+repo+'/actions/workflows/queue-pages-publication.yml/dispatches','--input','-'],input=json.dumps({'ref':'main','inputs':{'acceptance_run_id':str(release['id']),'snapshot_sha':base}}),text=True,check=True,timeout=90)
              # A successful dispatch may return no body. Resolve by readback;
              # never repeat a write because an ID was absent in that body.
              for attempt in range(12):
                  existing=exact_runs('.github/workflows/queue-pages-publication.yml')
                  if existing: break
                  time.sleep(5)
          if len(existing)!=1: raise RuntimeError('Dispatch identity unresolved; inspect before retrying')
          receipt={'source_commit':source,'release_run_id':release['id'],'pages_queue_run_id':existing[0]['id'],
              'recovery_changes_included':False,'main_written':False,'canonical_acceptance_required':True}
          pathlib.Path(os.environ['RUNNER_TEMP'],'menu-publication.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/menu-publication.json
          if-no-files-found: warn
          retention-days: 30
