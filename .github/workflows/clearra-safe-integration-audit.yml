name: Clearra Safe Integration Audit
run-name: Verify automatic recovery field editing and exact execution
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-safe-integration-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearra-recovery-auto-review
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'daejunnom/Clearra'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: write}
    outputs:
      candidate: ${{ steps.source.outputs.candidate }}
      tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 47556af7d178c004c4f4bbbbc2cf7bfdf1f8b8e2, fetch-depth: 0}
      - name: Apply only the reviewed field-owner repair without changing main
        id: source
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          BASE='51084c78c3a06f355a352b4c013314c151c47709'
          PARENT='493c8250bc5ab4798bd119b0ab9e627c5c6b5264'
          TREE='e72072403bdaae8035c5be44b9bc82632c3744f8'
          BRANCH='codex/converge-recovery-auto-20260927'
          def git(*args): return subprocess.check_output(['git',*args],text=True,timeout=120).strip()
          def refs():
              for ref,sha in [('refs/heads/main',BASE),('refs/heads/'+BRANCH,PARENT)]:
                  if git('ls-remote','origin',ref).split()!=[sha,ref]: raise RuntimeError('Reviewed ref moved; reconcile first')
          patch=pathlib.Path('scripts/integration/recovery-resume-20260927/field-editing.patch').read_bytes()
          if hashlib.sha256(patch).hexdigest()!='c79cbc2273b73f83f0fb4a64135df01ea3ee24fe3d60f7c6f46f6fa3e65ee790':
              raise RuntimeError('Reviewed patch checksum mismatch')
          refs()
          git('checkout','--detach',PARENT)
          if git('rev-parse','HEAD^{tree}')!='95743be7492eb8a3b7103311c59ad5a76aa7df8c': raise RuntimeError('Parent tree mismatch')
          temporary=pathlib.Path(os.environ['RUNNER_TEMP'])/'field-editing.patch'
          temporary.write_bytes(patch)
          git('apply','--check',str(temporary)); git('apply','--index',str(temporary)); git('diff','--cached','--check')
          if git('write-tree')!=TREE: raise RuntimeError('Resulting source tree differs from reviewed code')
          changed=git('diff','--cached','--name-only').splitlines()
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','fix: preserve optional recovery geometry when editing the actual workspace')
          candidate=git('rev-parse','HEAD')
          refs(); git('push','origin',candidate+':refs/heads/'+BRANCH)
          if git('ls-remote','origin','refs/heads/'+BRANCH).split()!=[candidate,'refs/heads/'+BRANCH]: raise RuntimeError('Candidate readback mismatch')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'automatic-recovery-source';out.mkdir()
          (out/'change.patch').write_bytes(patch)
          receipt={'source_commit':candidate,'parent':PARENT,'base':BASE,'tree':TREE,'files':changed,'main_written':False,'published':False,
              'scope':'declared-role Auto recovery; two-Build-catalog cross-stage integration is not claimed'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt),flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('candidate='+candidate+'\ntree='+TREE+'\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-recovery-source-${{ github.run_id }}
          path: ${{ runner.temp }}/automatic-recovery-source
          if-no-files-found: warn
          retention-days: 14
  frontend:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_BROWSER_TOOLS_ROOT: ${{ github.workspace }}/build/tools/ui-browser
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Install frozen dependencies and pinned Chromium
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          npm install --prefix "$CLEARRA_BROWSER_TOOLS_ROOT" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node "$CLEARRA_BROWSER_TOOLS_ROOT/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise actual workspace height owner dropdown and preserved cards
        shell: bash
        run: |
          set -euo pipefail
          {
            status=0
            for source in recovery-workspace-browser-acceptance recovery-editor-browser-acceptance solution-toolbar-browser-acceptance workspace-controls-browser-acceptance; do
              node "scripts/tools/$source.mjs" || status=1
            done
            exit "$status"
          } 2>&1 | tee "$RUNNER_TEMP/automatic-browser.log"
      - name: Test full UI worker and Discord request contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            node scripts/desktop-ui-compile-check.mjs
            pnpm --filter @clearra/ui run test
            pnpm --filter @clearra/web run test
            pnpm --filter ctk3 run build
            node --test apps/clearra-discord-bot/test/boundary-recovery-input.test.mjs
          } 2>&1 | tee "$RUNNER_TEMP/automatic-contracts.log"
      - name: Run canonical release regressions on Linux
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tools/run-release-regression-tests.mjs 2>&1 | tee "$RUNNER_TEMP/automatic-release-regressions.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-recovery-frontend-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/automatic-browser.log
            ${{ runner.temp }}/automatic-contracts.log
            ${{ runner.temp }}/automatic-release-regressions.log
            ${{ runner.temp }}/clearra-recovery-workspace-acceptance
            ${{ runner.temp }}/clearra-recovery-editor-acceptance
            ${{ runner.temp }}/clearra-solution-toolbar-acceptance
            ${{ runner.temp }}/clearra-control-acceptance
          if-no-files-found: warn
          retention-days: 14
  native:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      RUST_MIN_STACK: '16777216'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', persist-credentials: false}
      - name: Compare Auto with explicit quota union and exercise unlimited identities
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked -p clearra-forward-search --lib boundary_recovery -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/automatic-core.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/automatic-core.log"
      - name: Test public CLI and exact legacy selected-role compatibility
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p clearra-cli-command --test boundary_recovery -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/automatic-cli.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/automatic-cli.log"
      - name: Match automatic mode JSON with typed payload and real WASM host execution
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p clearra-wasm --lib weighted_boundary_recovery_payload_is_lossless_json -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/automatic-json.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/automatic-json.log"
          cargo test --locked -p clearra-wasm --test boundary_recovery_auto_wire -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/automatic-wire.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/automatic-wire.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-recovery-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/automatic-core.log
            ${{ runner.temp }}/automatic-cli.log
            ${{ runner.temp }}/automatic-json.log
            ${{ runner.temp }}/automatic-wire.log
          if-no-files-found: warn
          retention-days: 14
  acceptance:
    needs: [prepare, frontend, native]
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [FoundationNoProductDebt, FoundationAdversarialCorrectness, FoundationDesktopHost, Sanitizer, RustExact, RustProduct, Pages]
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_WEB_BASE_PATH: /Clearra
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Prepare exact toolchains and frozen workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:CLEARRA_SOURCE_COMMIT) { throw 'Candidate mismatch' }
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_BUILD_JOBS=$([Math]::Max(1, [Environment]::ProcessorCount))" >> $env:GITHUB_ENV
          if ('${{ matrix.shard }}' -eq 'Pages') {
            rustup target add wasm32-unknown-unknown
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./scripts/tools/install-managed-cargo-tool.ps1 -Purpose experiment -ToolName wasm-bindgen-cli -Version 0.2.126
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run complete nonpublishing acceptance with actual UI and WASM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard '${{ matrix.shard }}' -ExecutionSurface Trusted -RuntimeEnvironment windows -Workers ([Math]::Max(1, [Environment]::ProcessorCount)) -VerboseLog -ShowWarnings 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'automatic-acceptance.log')
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-recovery-acceptance-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/automatic-acceptance.log
            ${{ runner.temp }}/clearra-surface-acceptance
            ${{ runner.temp }}/clearra-recovery-workspace-acceptance
            ${{ runner.temp }}/clearra-recovery-editor-acceptance
          if-no-files-found: warn
          retention-days: 14
  ready:
    if: always()
    needs: [prepare, frontend, native, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every independent check without promoting or deploying
        env: {RESULTS: '${{ toJSON(needs) }}'}
        shell: python
        run: |
          import json,os
          results=json.loads(os.environ['RESULTS'])
          failed={key:value['result'] for key,value in results.items() if value['result']!='success'}
          if failed: raise RuntimeError(json.dumps(failed))
          print('Automatic declared-role recovery accepted:',results['prepare']['outputs']['candidate'])
          print('No main update or deployment. Two-Build-catalog cross-stage integration remains a separate requirement.')
