name: Clearra Safe Integration Audit
run-name: Verify mandatory toolbar and automatic recovery
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-safe-integration-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearra-recovery-fields-review
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'daejunnom/Clearra'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write, actions: write}
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
      tree: ${{ steps.prepare.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: f4e797027219038f5711e909024a5234037d4827, fetch-depth: 0}
      - name: Install the exact formatter
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Apply exact reviewed source without updating main
        id: prepare
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/integration/ui-polish-20260927/apply-reviewed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-polish-source-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-polish-source
          if-no-files-found: warn
          retention-days: 14
  frontend:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_BROWSER_TOOLS_ROOT: ${{ github.workspace }}/build/tools/ui-browser
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Install exact frozen dependencies and pinned Chromium
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          npm install --prefix "$CLEARRA_BROWSER_TOOLS_ROOT" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node "$CLEARRA_BROWSER_TOOLS_ROOT/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test actual toolbar and recovery controls before WASM compilation
        shell: bash
        run: |
          set -euo pipefail
          {
            status=0
            for source in solution-toolbar-browser-acceptance recovery-editor-browser-acceptance workspace-controls-browser-acceptance; do
              node "scripts/tools/$source.mjs" || status=1
            done
            exit "$status"
          } 2>&1 | tee "$RUNNER_TEMP/ui-browser.log"
      - name: Test UI types shared behavior and worker contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            node scripts/desktop-ui-compile-check.mjs
            pnpm --filter @clearra/ui run test
            pnpm --filter @clearra/web run test
          } 2>&1 | tee "$RUNNER_TEMP/ui-contracts.log"
      - name: Run canonical release regressions on Linux
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tools/run-release-regression-tests.mjs 2>&1 | tee "$RUNNER_TEMP/ui-release-regressions.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-polish-frontend-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ui-browser.log
            ${{ runner.temp }}/ui-contracts.log
            ${{ runner.temp }}/ui-release-regressions.log
            ${{ runner.temp }}/clearra-solution-toolbar-acceptance
            ${{ runner.temp }}/clearra-recovery-editor-acceptance
            ${{ runner.temp }}/clearra-control-acceptance
          if-no-files-found: warn
          retention-days: 14
  exact-recovery:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      RUST_MIN_STACK: '16777216'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', persist-credentials: false}
      - name: Test all feasible horizons line clears explicit limits and cancellation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked -p clearra-forward-search --lib boundary_recovery -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/ui-recovery-core.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/ui-recovery-core.log"
      - name: Test real command execution and explicit compatibility
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p clearra-cli-command --test boundary_recovery -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/ui-recovery-command.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/ui-recovery-command.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-polish-core-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ui-recovery-core.log
            ${{ runner.temp }}/ui-recovery-command.log
          if-no-files-found: warn
          retention-days: 14
  acceptance:
    needs: [prepare, frontend, exact-recovery]
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [FoundationNoProductDebt, FoundationAdversarialCorrectness, FoundationDesktopHost, Sanitizer, RustExact, RustProduct, Pages]
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_WEB_BASE_PATH: /Clearra
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Prepare exact toolchains and frozen workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:CLEARRA_SOURCE_COMMIT) { throw 'Candidate mismatch' }
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_BUILD_JOBS=$([Math]::Max(1, [Environment]::ProcessorCount))" >> $env:GITHUB_ENV
          if ('${{ matrix.shard }}' -eq 'Pages') {
            rustup target add wasm32-unknown-unknown
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./scripts/tools/install-managed-cargo-tool.ps1 -Purpose experiment -ToolName wasm-bindgen-cli -Version 0.2.126
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run complete nonpublishing acceptance with actual UI and WASM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard '${{ matrix.shard }}' -ExecutionSurface Trusted -RuntimeEnvironment windows -Workers ([Math]::Max(1, [Environment]::ProcessorCount)) -VerboseLog -ShowWarnings 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'ui-acceptance.log')
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-polish-acceptance-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ui-acceptance.log
            ${{ runner.temp }}/clearra-surface-acceptance
            ${{ runner.temp }}/clearra-solution-toolbar-acceptance
            ${{ runner.temp }}/clearra-recovery-editor-acceptance
          if-no-files-found: warn
          retention-days: 14
  ready:
    if: always()
    needs: [prepare, frontend, exact-recovery, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require all independent checks without publishing
        env: {RESULTS: '${{ toJSON(needs) }}'}
        shell: python
        run: |
          import json,os
          results=json.loads(os.environ['RESULTS'])
          failed={key:value['result'] for key,value in results.items() if value['result']!='success'}
          if failed: raise RuntimeError(json.dumps(failed))
          print('UI polish source accepted:',results['prepare']['outputs']['candidate'])
          print('Independent management protection is required before main promotion. This workflow does not publish or deploy.')
