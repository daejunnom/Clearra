name: Clearra Safe Integration Audit
run-name: Verify shared recovery canvas and exact parallel supply pairs
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-safe-integration-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearra-recovery-parallel-validation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'daejunnom/Clearra'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write}
    outputs:
      candidate: ${{ steps.source.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: 13376dee8638cb5de5437ade910f07f5eab20629, fetch-depth: 0}
      - name: Install exact formatter
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Apply checksum-bound reviewed changes without promoting main
        id: source
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          BASE='13376dee8638cb5de5437ade910f07f5eab20629'
          BRANCH='codex/review-recovery-parallel-20260927'
          PARTS=['45d435db1d7a36557aebf8a83f24bbcd262b18ad','834eafca0335a96a301a96cff6d9f5c0ccf1b90b','b7e0ef25b6a8998eb177438fb5e0b1da43f80995','730390604bd197978a615c8ffa85a9b453e6ad73']
          def git(*args): return subprocess.check_output(['git',*args],text=True,timeout=120).strip()
          def refs():
              if git('ls-remote','origin','refs/heads/main').split()!=[BASE,'refs/heads/main']: raise RuntimeError('Main moved; reconcile first')
              if git('ls-remote','origin','refs/heads/'+BRANCH): raise RuntimeError('Review branch exists; do not overwrite')
          refs()
          if git('rev-parse','HEAD')!=BASE or git('rev-parse','HEAD^{tree}')!='a3d368f2aef5af70c2bedbe598f7635962c0dc61': raise RuntimeError('Base source mismatch')
          chunks=[]
          for sha in PARTS:
              item=json.loads(subprocess.check_output(['gh','api','repos/daejunnom/Clearra/git/blobs/'+sha],text=True,timeout=120))
              data=base64.b64decode(item['content'])
              if hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()!=sha: raise RuntimeError('Source chunk mismatch')
              chunks.append(data)
          packed=b''.join(chunks)
          if hashlib.sha256(packed).hexdigest()!='2faf990182dfd054e7f150db2b8a8b0c07a9631b90ba4016b8742d3af685fd4e': raise RuntimeError('Patch checksum mismatch')
          patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'recovery-parallel.patch';patch.write_bytes(gzip.decompress(packed))
          git('apply','--check',str(patch));git('apply','--index',str(patch));git('diff','--cached','--check')
          if git('write-tree')!='c6b4f87c41a16f66caffdde969a84e8c83ed479c': raise RuntimeError('Reviewed unformatted tree mismatch')
          allowed=set(git('diff','--cached','--name-only').splitlines())
          subprocess.run(['cargo','+1.98.1','fmt','--all'],check=True,timeout=120)
          changed=git('diff','HEAD','--name-only').splitlines()
          if set(changed)!=allowed: raise RuntimeError('Formatter changed unreviewed files')
          git('add','--',*changed);git('diff','--cached','--check')
          subprocess.run(['cargo','+1.98.1','fmt','--all','--check'],check=True,timeout=120)
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat: preserve recovery canvas and parallelize exact supply-pair evaluation')
          candidate=git('rev-parse','HEAD');tree=git('rev-parse','HEAD^{tree}');refs()
          git('push','origin',candidate+':refs/heads/'+BRANCH)
          if git('ls-remote','origin','refs/heads/'+BRANCH).split()!=[candidate,'refs/heads/'+BRANCH]: raise RuntimeError('Candidate readback mismatch')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'recovery-parallel-source';out.mkdir()
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),candidate],check=True,timeout=120)
          (out/'change.patch').write_text(git('diff','--binary',BASE,candidate)+'\n')
          receipt={'base':BASE,'source_commit':candidate,'tree':tree,'files':changed,'main_written':False,'published':False,'full_p7_p7_population_tested':False}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt),flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('candidate='+candidate+'\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-parallel-source-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-parallel-source
          if-no-files-found: warn
          retention-days: 14
  native:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    env:
      CARGO_BUILD_JOBS: '4'
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', persist-credentials: false}
      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cargo fmt --all --check
      - name: Compare full small universes plus actual screenshot task with serial
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p clearra-forward-search --lib recovery_parallel -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/recovery-parallel-core.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/recovery-parallel-core.log"
      - name: Exercise actual native pool and typed CLI boundary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p clearra-app --lib recovery_native_pool -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/recovery-parallel-native.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/recovery-parallel-native.log"
          cargo test --locked -p clearra-cli-command --test recovery_build -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/recovery-parallel-cli.log"
      - name: Exercise WASM coordinator real verifier and byte-identical serial payload
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p clearra-wasm --test recovery_build_parallel -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/recovery-parallel-wire.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/recovery-parallel-wire.log"
      - name: Optimized native parallel execution without stack enlargement
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release -p clearra-forward-search --lib recovery_parallel -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/recovery-parallel-release.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-parallel-native-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-parallel-*.log
          if-no-files-found: warn
          retention-days: 14
  frontend:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_BROWSER_TOOLS_ROOT: ${{ github.workspace }}/build/tools/ui-browser
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Install frozen dependencies and pinned real browser
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          npm install --prefix "$CLEARRA_BROWSER_TOOLS_ROOT" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node "$CLEARRA_BROWSER_TOOLS_ROOT/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify actual workspace retains all three screenshot fields and common results
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tools/recovery-workspace-browser-acceptance.mjs 2>&1 | tee "$RUNNER_TEMP/recovery-parallel-browser.log"
          node scripts/tools/recovery-result-browser-acceptance.mjs
          node scripts/tools/solution-toolbar-browser-acceptance.mjs
          node scripts/tools/workspace-controls-browser-acceptance.mjs
      - name: Test entire UI workers Desktop and source contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/desktop-ui-compile-check.mjs
          pnpm --filter @clearra/ui run test 2>&1 | tee "$RUNNER_TEMP/recovery-parallel-ui.log"
          pnpm --filter @clearra/web run test 2>&1 | tee "$RUNNER_TEMP/recovery-parallel-worker.log"
          pnpm --filter ctk3 run build
      - name: Verify canonical release regression selection
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tools/run-release-regression-tests.mjs 2>&1 | tee "$RUNNER_TEMP/recovery-parallel-regressions.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-parallel-frontend-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recovery-parallel-*.log
            ${{ runner.temp }}/clearra-recovery-workspace-acceptance
            ${{ runner.temp }}/clearra-recovery-result-acceptance
          if-no-files-found: warn
          retention-days: 14
  acceptance:
    needs: [prepare, native, frontend]
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [FoundationNoProductDebt, FoundationAdversarialCorrectness, FoundationDesktopHost, Sanitizer, RustExact, RustProduct, Pages]
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_WEB_BASE_PATH: /Clearra
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Prepare exact toolchains and frozen workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_BUILD_JOBS=$([Math]::Max(1, [Environment]::ProcessorCount))" >> $env:GITHUB_ENV
          if ('${{ matrix.shard }}' -eq 'Pages') {
            rustup target add wasm32-unknown-unknown
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./scripts/tools/install-managed-cargo-tool.ps1 -Purpose experiment -ToolName wasm-bindgen-cli -Version 0.2.126
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run exact nonpublishing product leaf
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard '${{ matrix.shard }}' -ExecutionSurface Trusted -RuntimeEnvironment windows -Workers ([Math]::Max(1, [Environment]::ProcessorCount)) -VerboseLog -ShowWarnings 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'recovery-parallel-acceptance.log')
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-parallel-acceptance-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recovery-parallel-acceptance.log
            ${{ runner.temp }}/clearra-surface-acceptance
            ${{ runner.temp }}/clearra-recovery-workspace-acceptance
          if-no-files-found: warn
          retention-days: 14
  ready:
    if: always()
    needs: [prepare, native, frontend, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every exact-source check without publishing
        env: {RESULTS: '${{ toJSON(needs) }}'}
        shell: python
        run: |
          import json,os
          results=json.loads(os.environ['RESULTS'])
          failed={key:value['result'] for key,value in results.items() if value['result']!='success'}
          if failed: raise RuntimeError(json.dumps(failed))
          print('Recovery canvas and exact parallel execution accepted:',results['prepare']['outputs']['candidate'])
          print('No main update or publication; full P7/P7 completion is not claimed by prefix regression.')
