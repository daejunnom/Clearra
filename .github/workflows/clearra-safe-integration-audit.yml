name: Clearra Safe Integration Audit
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-safe-integration-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearra-safe-integration-audit
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 77880df9c2b0e919cacf5b10145cfab9e5f2b1e8
          persist-credentials: false
          fetch-depth: 1
      - name: Export only the pinned tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 77880df9c2b0e919cacf5b10145cfab9e5f2b1e8
          git archive --format=tar.gz --output="$RUNNER_TEMP/clearra-candidate-source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/clearra-candidate-source.tar.gz" > "$RUNNER_TEMP/clearra-candidate-source.sha256"
          echo 'Read-only source export; no build, main update, tag, publication or deployment.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: clearra-pinned-candidate-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/clearra-candidate-source.tar.gz
            ${{ runner.temp }}/clearra-candidate-source.sha256
          if-no-files-found: error
          retention-days: 7
