name: Clearra Safe Integration Audit
run-name: Verify mandatory toolbar and automatic recovery
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-safe-integration-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearra-recovery-fields-review
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'daejunnom/Clearra'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write, actions: write}
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
      tree: ${{ steps.prepare.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91c099731884f0b8e6dd744f34e4b66ed0f51a84
          fetch-depth: 0
      - name: Install the exact formatter
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Apply reviewed source edits and fast-forward only the candidate
        id: prepare
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          def cmd(*args): return subprocess.check_output(args,text=True,timeout=120).strip()
          def git(*args): return cmd('git',*args)
          def blob(text):
              data=text.encode('utf-8')
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          base='521fee125b478a5a39a90a808d6c471c430c8494'
          parent='246e1c5ee9a743ab9a24ba731af55ccc6b805ddd'
          branch='codex/recovery-gray-fields-20260926'
          spec_root=pathlib.Path('scripts/integration/ui-polish-20260927')
          documents=[json.loads((spec_root/name).read_text()) for name in
                     ['core-edits.json','ui-edits.json','completion-1.json','completion-2.json','completion-3.json']]
          # The recovered English-help record contained a stale digest only.
          # Its reviewed replacement bytes include a literal newline; bind that
          # exact text here and also verify the entire resulting source tree.
          english=next(x for x in documents[0] if x['path']=='crates/clearra-cli/src/args/cli_parser.rs')
          if english['after']!='ba5822cb62503c19e2c077f72bab0f42e80c7863':
              raise RuntimeError('Recovered help manifest changed')
          english['after']='5b53655bee6fa1c49fd5d88e68f8a40a60408a42'
          expected=sorted({x['path'] for group in documents for x in group})
          if len(expected)!=37: raise RuntimeError('Unexpected reviewed scope')
          for path in expected:
              p=pathlib.PurePosixPath(path)
              if p.is_absolute() or '..' in p.parts or p.parts[0] not in {'crates','packages','scripts'}:
                  raise RuntimeError('Invalid source path')
          def refs():
              for ref,sha in [('refs/heads/main',base),('refs/heads/'+branch,parent)]:
                  if git('ls-remote','origin',ref).split()!=[sha,ref]:
                      raise RuntimeError('Reviewed ref moved; reconcile before applying')
          refs()
          git('checkout','--detach',parent)
          if git('rev-parse','HEAD^{tree}')!='1d40c2161033065fdb7036c2ae7b535e50a64691':
              raise RuntimeError('Reviewed parent tree mismatch')
          git('merge-base','--is-ancestor',base,parent)
          for group in documents:
              for item in group:
                  path=pathlib.Path(item['path'])
                  if path.is_symlink(): raise RuntimeError('Source path is a link')
                  old=path.read_text() if path.exists() else None
                  if (blob(old) if old is not None else None)!=item['before']:
                      raise RuntimeError('Source before digest mismatch: '+str(path))
                  text=old or ''
                  end=0
                  for first,last,value in item['edits']:
                      if not (isinstance(first,int) and isinstance(last,int) and isinstance(value,str) and end<=first<=last<=len(text)):
                          raise RuntimeError('Invalid nonoverlapping edit')
                      end=last
                  for first,last,value in reversed(item['edits']): text=text[:first]+value+text[last:]
                  if blob(text)!=item['after']: raise RuntimeError('Source after digest mismatch: '+str(path))
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(text)
          git('add','--',*expected)
          if git('write-tree')!='0028b7b2b173c21e3a18eb58371de555b17d4088':
              raise RuntimeError('Complete reviewed source tree mismatch')
          subprocess.run(['cargo','+1.98.1','fmt','--all'],check=True,timeout=120)
          if git('diff','HEAD','--name-only').splitlines()!=expected:
              raise RuntimeError('Formatter changed unreviewed files')
          git('add','--',*expected)
          git('diff','--cached','--check')
          subprocess.run(['cargo','+1.98.1','fmt','--all','--check'],check=True,timeout=120)
          tree=git('write-tree')
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'ui-polish-source';output.mkdir()
          (output/'complete.patch').write_text(git('diff','--cached','--binary')+'\n')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat: streamline mandatory solution controls and infer recovery placement counts')
          candidate=git('rev-parse','HEAD')
          if git('show','-s','--format=%P',candidate)!=parent: raise RuntimeError('Candidate parent mismatch')
          refs()
          git('push','origin',candidate+':refs/heads/'+branch)
          if git('ls-remote','origin','refs/heads/'+branch).split()[0]!=candidate: raise RuntimeError('Candidate readback mismatch')
          receipt={'source_commit':candidate,'parent':parent,'base':base,'tree':tree,'files':expected,'main_written':False}
          (output/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt),flush=True)
          subprocess.run(['gh','workflow','run','management-policy.yml','--ref',branch],check=True,timeout=120)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('candidate='+candidate+'\ntree='+tree+'\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-polish-source-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-polish-source
          if-no-files-found: warn
          retention-days: 14
  frontend:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_BROWSER_TOOLS_ROOT: ${{ github.workspace }}/build/tools/ui-browser
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Install exact frozen dependencies and pinned Chromium
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          npm install --prefix "$CLEARRA_BROWSER_TOOLS_ROOT" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node "$CLEARRA_BROWSER_TOOLS_ROOT/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test actual toolbar and recovery controls before WASM compilation
        shell: bash
        run: |
          set -euo pipefail
          {
            status=0
            for source in solution-toolbar-browser-acceptance recovery-editor-browser-acceptance workspace-controls-browser-acceptance; do
              node "scripts/tools/$source.mjs" || status=1
            done
            exit "$status"
          } 2>&1 | tee "$RUNNER_TEMP/ui-browser.log"
      - name: Test UI types shared behavior and worker contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            node scripts/desktop-ui-compile-check.mjs
            pnpm --filter @clearra/ui run test
            pnpm --filter @clearra/web run test
          } 2>&1 | tee "$RUNNER_TEMP/ui-contracts.log"
      - name: Run canonical release regressions on Linux
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tools/run-release-regression-tests.mjs 2>&1 | tee "$RUNNER_TEMP/ui-release-regressions.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-polish-frontend-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ui-browser.log
            ${{ runner.temp }}/ui-contracts.log
            ${{ runner.temp }}/ui-release-regressions.log
            ${{ runner.temp }}/clearra-solution-toolbar-acceptance
            ${{ runner.temp }}/clearra-recovery-editor-acceptance
            ${{ runner.temp }}/clearra-control-acceptance
          if-no-files-found: warn
          retention-days: 14
  exact-recovery:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      RUST_MIN_STACK: '16777216'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', persist-credentials: false}
      - name: Test all feasible horizons line clears explicit limits and cancellation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked -p clearra-forward-search --lib boundary_recovery -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/ui-recovery-core.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/ui-recovery-core.log"
      - name: Test real command execution and explicit compatibility
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p clearra-cli-command --test boundary_recovery -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/ui-recovery-command.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/ui-recovery-command.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-polish-core-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ui-recovery-core.log
            ${{ runner.temp }}/ui-recovery-command.log
          if-no-files-found: warn
          retention-days: 14
  acceptance:
    needs: [prepare, frontend, exact-recovery]
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [FoundationNoProductDebt, FoundationAdversarialCorrectness, FoundationDesktopHost, Sanitizer, RustExact, RustProduct, Pages]
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_WEB_BASE_PATH: /Clearra
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Prepare exact toolchains and frozen workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:CLEARRA_SOURCE_COMMIT) { throw 'Candidate mismatch' }
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_BUILD_JOBS=$([Math]::Max(1, [Environment]::ProcessorCount))" >> $env:GITHUB_ENV
          if ('${{ matrix.shard }}' -eq 'Pages') {
            rustup target add wasm32-unknown-unknown
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./scripts/tools/install-managed-cargo-tool.ps1 -Purpose experiment -ToolName wasm-bindgen-cli -Version 0.2.126
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run complete nonpublishing acceptance with actual UI and WASM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard '${{ matrix.shard }}' -ExecutionSurface Trusted -RuntimeEnvironment windows -Workers ([Math]::Max(1, [Environment]::ProcessorCount)) -VerboseLog -ShowWarnings 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'ui-acceptance.log')
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-polish-acceptance-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ui-acceptance.log
            ${{ runner.temp }}/clearra-surface-acceptance
            ${{ runner.temp }}/clearra-solution-toolbar-acceptance
            ${{ runner.temp }}/clearra-recovery-editor-acceptance
          if-no-files-found: warn
          retention-days: 14
  ready:
    if: always()
    needs: [prepare, frontend, exact-recovery, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require all independent checks without publishing
        env: {RESULTS: '${{ toJSON(needs) }}'}
        shell: python
        run: |
          import json,os
          results=json.loads(os.environ['RESULTS'])
          failed={key:value['result'] for key,value in results.items() if value['result']!='success'}
          if failed: raise RuntimeError(json.dumps(failed))
          print('UI polish source accepted:',results['prepare']['outputs']['candidate'])
          print('Independent management protection is required before main promotion. This workflow does not publish or deploy.')
