name: Clearra Safe Integration Audit
run-name: Recover staged implementation (not acceptance)
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-safe-integration-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'daejunnom/Clearra'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9808829d176dcd5eae78521fb51f7a3a99aaf1d4
          persist-credentials: false
      - name: Recover only the two reviewed source-edit documents
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9808829d176dcd5eae78521fb51f7a3a99aaf1d4
          mkdir -p "$RUNNER_TEMP/clearra-staged-ui"
          cp scripts/integration/ui-polish-20260927/core-edits.json scripts/integration/ui-polish-20260927/ui-edits.json "$RUNNER_TEMP/clearra-staged-ui/"
          cd "$RUNNER_TEMP/clearra-staged-ui"
          sha256sum *.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: clearra-staged-ui-${{ github.run_id }}
          path: ${{ runner.temp }}/clearra-staged-ui
          if-no-files-found: error
          retention-days: 3
