name: Clearra Safe Integration Audit
run-name: Resume menu protection and prepare isolated recovery UI review
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-safe-integration-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: clearra-recovery-source-review
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'daejunnom/Clearra'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 521fee125b478a5a39a90a808d6c471c430c8494
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed menu candidate and start missing independent protection
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: python
        run: |
          import json,os,pathlib,subprocess
          repo='daejunnom/Clearra'
          candidate='521fee125b478a5a39a90a808d6c471c430c8494'
          branch='codex/pages-eight-menu-hotfix-20260926'
          def cmd(*args): return subprocess.check_output(args,text=True,timeout=90).strip()
          def api(path): return json.loads(cmd('gh','api','repos/'+repo+'/'+path))
          assert cmd('git','rev-parse','HEAD')==candidate
          assert api('git/ref/heads/'+branch)['object']['sha']==candidate
          checks=api('commits/'+candidate+'/check-runs?per_page=100')['check_runs']
          present={c['name'] for c in checks if c['app']['slug']=='github-actions'}
          required={'Clearra management policy','Clearra management Windows runtime'}
          runs=api('actions/workflows/management-policy.yml/runs?head_sha='+candidate+'&per_page=100')['workflow_runs']
          if not required.issubset(present) and not any(r['status']!='completed' for r in runs):
              subprocess.run(['gh','workflow','run','management-policy.yml','--ref',branch],check=True,timeout=90)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'recovery-source'
          out.mkdir()
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(out/'source.tar.gz'),candidate],check=True)
          (out/'source.json').write_text(json.dumps({'source':candidate,'tree':cmd('git','rev-parse','HEAD^{tree}'),'main_unchanged':True})+'\n')
          print('Only independent candidate protection dispatched; no main, tag, release or Pages changes in this job.')
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-ui-source-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-source
          if-no-files-found: error
          retention-days: 14
