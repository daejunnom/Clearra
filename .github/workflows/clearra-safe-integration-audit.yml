name: Clearra Safe Integration Audit
run-name: Upload two-supply recovery review source (no tests or deployment)
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-safe-integration-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearra-recovery-review-upload
  cancel-in-progress: false
jobs:
  upload-review:
    if: github.repository == 'daejunnom/Clearra'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Import byte-identical reviewed files into an isolated review branch
        run: python scripts/integration/recovery-review-upload-20260927/import_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-review-upload-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-review-upload.json
          if-no-files-found: warn
          retention-days: 30
