name: Clearra Safe Integration Audit
run-name: Collect exact automatic recovery source (not acceptance)
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-safe-integration-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearra-recovery-auto-review
  cancel-in-progress: true
jobs:
  source:
    if: github.repository == 'daejunnom/Clearra'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 493c8250bc5ab4798bd119b0ab9e627c5c6b5264
          fetch-depth: 0
          persist-credentials: false
      - name: Capture immutable source and preceding verification workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 493c8250bc5ab4798bd119b0ab9e627c5c6b5264
          test "$(git rev-parse 'HEAD^{tree}')" = 95743be7492eb8a3b7103311c59ad5a76aa7df8c
          mkdir -p "$RUNNER_TEMP/recovery-resume-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/recovery-resume-source/source.tar.gz" HEAD
          git ls-tree -r -z HEAD > "$RUNNER_TEMP/recovery-resume-source/tree.z"
          git show e821b7214b7c38406daa1cdd3c3501ccf743248b:.github/workflows/clearra-safe-integration-audit.yml > "$RUNNER_TEMP/recovery-resume-source/previous-gate.yml"
          cd "$RUNNER_TEMP/recovery-resume-source"
          sha256sum source.tar.gz tree.z previous-gate.yml > SHA256SUMS
          echo 'Read-only source collection. No product edits, acceptance claim, main update, or deployment.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-resume-source-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-resume-source
          if-no-files-found: error
          retention-days: 14
