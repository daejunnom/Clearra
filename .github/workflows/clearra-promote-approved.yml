name: Promote Reviewed Clearra Candidate

on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-promote-approved.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearra-reviewed-main-promotion-20260925
  cancel-in-progress: false

jobs:
  promote-and-dispatch:
    if: github.repository == 'daejunnom/Clearra' && github.ref == 'refs/heads/codex/clearra-safe-integration-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5626918e9316752af7b8213d4ab0f48da15a6c1e
          persist-credentials: false
      - name: Validate the fixed orchestration source syntax
        shell: bash
        run: python -m py_compile scripts/integration/promote-approved-candidate-20260925.py
      - name: Wait for all exact-source leaves, fast-forward and dispatch canonical owners
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python scripts/integration/promote-approved-candidate-20260925.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clearra-reviewed-promotion-${{ github.run_id }}
          path: ${{ runner.temp }}/clearra-approved-promotion/receipt.json
          if-no-files-found: error
          retention-days: 30
