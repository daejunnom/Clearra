name: Clearra Management Policy

on:
  push:
    branches:
      - "codex/converge-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearra-management-policy-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  windows-runtime:
    name: Clearra management Windows runtime
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the exact Rust toolchain
        shell: pwsh
        run: >-
          rustup toolchain install 1.98.1 --profile minimal
          --component rustfmt --component clippy
      - name: Build and test the Rust manager
        shell: pwsh
        run: |
          cargo test --locked -p clearra-manage
          cargo build --locked --release -p clearra-manage
          $manager = 'build/cargo/default/release/clearra-manage.exe'
          & $manager --root . storage audit
          & $manager --root . runtime audit
      - name: Verify Windows Job Object ownership
        shell: pwsh
        run: |
          $manager = 'build/cargo/default/release/clearra-manage.exe'
          & $manager --root . runtime run --producer management-test --profile control --timeout 30 -- `
            pwsh -NoProfile -NonInteractive -Command "Write-Output 'job-object-ok'"
          if ($LASTEXITCODE -ne 0) { throw 'normal Job Object fixture failed' }
          $previousErrorAction = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & $manager --root . runtime run --producer management-test --profile control --timeout 1 -- `
            pwsh -NoProfile -NonInteractive -Command "Start-Sleep -Seconds 30"
          $timeoutExitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousErrorAction
          if ($timeoutExitCode -eq 0) { throw 'timeout fixture unexpectedly succeeded' }
          exit 0
      # Temporary non-publishing handoff for the local v0.8.1 qualification
      # branch. Keep the source SHA in the artifact name; this grants neither
      # accepted build nor release authority and is removed before promotion.
      - name: Preserve candidate manager for supervised local generation
        if: github.ref == 'refs/heads/codex/converge-v081-v090-release-20260923'
        uses: actions/upload-artifact@v4
        with:
          name: clearra-manage-candidate-${{ github.sha }}
          path: build/cargo/default/release/clearra-manage.exe
          if-no-files-found: error
          retention-days: 3
      - name: Build exact Windows generators for local candidate qualification
        if: github.ref == 'refs/heads/codex/converge-v081-v090-release-20260923'
        shell: pwsh
        run: |
          cargo build --locked --release -p clearra-pc4-qualifier --no-default-features --features legal-board-assets --bin clearra-pc4-legal-board --bin clearra-conditioned-local-relation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve non-publishing Windows generator candidates
        if: github.ref == 'refs/heads/codex/converge-v081-v090-release-20260923'
        uses: actions/upload-artifact@v4
        with:
          name: clearra-accelerator-generators-candidate-${{ github.sha }}
          path: |
            build/cargo/default/release/clearra-pc4-legal-board.exe
            build/cargo/default/release/clearra-conditioned-local-relation.exe
          if-no-files-found: error
          retention-days: 3
      # A locally compiled test executable can be denied by Windows App
      # Control even when its source and compilation passed. This branch-only
      # artifact lets the exact CI source produce the optimized, non-publishing
      # local full-family differential binary without storing test data in Git.
      - name: Build optimized local legal-board differential executable
        if: github.ref == 'refs/heads/codex/converge-v081-v090-release-20260923'
        shell: pwsh
        run: |
          cargo test --release --locked -p clearra-core-executor --test legal_board_candidate_exact_set --features parallel,local-search-ab --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = @(Get-ChildItem -LiteralPath 'build/cargo/default/release/deps' -Filter 'legal_board_candidate_exact_set-*.exe' -File)
          if ($tests.Count -ne 1) { throw "expected one optimized legal-board test binary, found $($tests.Count)" }
          Get-FileHash -LiteralPath $tests[0].FullName -Algorithm SHA256 | Format-List
      - name: Preserve non-publishing legal-board differential executable
        if: github.ref == 'refs/heads/codex/converge-v081-v090-release-20260923'
        uses: actions/upload-artifact@v4
        with:
          name: clearra-legal-board-kat-candidate-${{ github.sha }}
          path: build/cargo/default/release/deps/legal_board_candidate_exact_set-*.exe
          if-no-files-found: error
          retention-days: 3

  management-policy:
    name: Clearra management policy
    needs: windows-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install the exact Rust toolchain
        run: >-
          rustup toolchain install 1.98.1 --profile minimal
          --component rustfmt --component clippy
          --target wasm32-unknown-unknown
      - name: Bind exact Corepack pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          if ((pnpm --version).Trim() -ne '11.5.0') { throw 'pnpm version mismatch' }
      - name: Resolve the exact pnpm store
        id: pnpm-store
        shell: pwsh
        run: |
          "path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT
      - name: Cache the pnpm and Cargo download stores
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.cargo/registry
            ~/.cargo/git
          key: clearra-management-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-node-22.23.2-pnpm-11.5.0-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml') }}
      - name: Verify the focused management contract
        run: |
          cargo test --locked -p clearra-manage
          cargo clippy --locked -p clearra-manage -- -D warnings
          cargo build --locked --release -p clearra-manage
          manager="build/cargo/default/release/clearra-manage"
          echo "CLEARRA_MANAGE_BIN=$GITHUB_WORKSPACE/$manager" >> "$GITHUB_ENV"
          "$manager" --root . storage audit
          "$manager" --root . storage verify --path _local/artifacts/test/management-policy
          "$manager" --root . runtime audit
          if "$manager" --root . git inventory; then
            echo 'Rust manager unexpectedly accepted the removed Git domain' >&2
            exit 1
          fi
          test ! -e scripts/management/clearra_manage.py
          test -e scripts/management/history/python-v1/clearra_manage.py
          if git grep -n -E 'scripts/management/(clearra_manage|clearra_runtime|clearra_process_wrapper)\.py|clearra-build-root-required' -- README.md docs package.json scripts apps ':!scripts/management/history/**'; then
            echo 'An active source still references the retired Python manager or Cargo blocker' >&2
            exit 1
          fi
      - name: Install the frozen workspace without lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          git diff --exit-code
          pnpm install --frozen-lockfile --ignore-scripts
          git diff --exit-code
      - name: Validate package and workflow behavior
        run: |
          pnpm --filter ctk3 run test
          pnpm --filter @clearra/ui run test
          pnpm --filter @clearra/discord-bot run test:built
          node --test scripts/tools/managed-shell-builds.test.mjs scripts/windows/clearra-local-services-watchdog.test.mjs
          node --test --test-name-pattern="bare Cargo writes under the declared build root" scripts/tools/clearra-build-policy.test.mjs
          pwsh -NoProfile -File scripts/architecture/validate_managed_build_contract.test.ps1
          pwsh -NoProfile -File scripts/test_artifact_path_policy.ps1
          bash -n scripts/runtime/clearra-wsl-sanitize.sh scripts/runtime/clearra-wsl-session.sh scripts/runtime/clearra-wsl-provision.sh scripts/runtime/clearra-wsl-guest.sh
          pnpm deploy --filter @clearra/discord-bot --prod build/discord-container/ci-deploy
          pnpm --dir build/discord-container/ci-deploy exec node --input-type=module -e "await import('./src/clearra/command.mjs'); await import('./src/job-service/server.mjs'); await import('ctk3')"
          node --test scripts/tools/accepted-ctk3-dist.test.mjs
          node --test scripts/release/candidate-preflight-workflow.test.mjs scripts/release/cloud/accepted-build-inputs.test.mjs
          node scripts/tools/validate-release-cli-smokes.mjs
      - name: Verify locked Rust workspace
        run: |
          cargo fmt --all --check
          cargo check --workspace --locked
          git diff --exit-code
      - name: Verify v0.8.1 candidate semantics without benchmarks or publishing
        if: github.ref == 'refs/heads/codex/converge-v081-v090-release-20260923'
        run: |
          cargo test --locked -p clearra-core-executor --lib conditioned_local
          cargo test --locked -p clearra-pc4-qualifier --no-default-features --features legal-board-assets --lib conditioned_local_relation_generation
          cargo test --locked -p clearra-pc4-qualifier --no-default-features --features legal-board-assets --lib legal_board_generation::immutable_output_tests
          cargo test --locked -p clearra-pc4-qualifier --no-default-features --features legal-board-assets --lib domain::forward_bloom_tests
          cargo test --locked -p clearra-pc4-qualifier --no-default-features --features legal-board-assets --lib domain::tests::legal_backtrace_is_restricted_to_the_complete_forward_source
          cargo test --locked -p clearra-pc4-qualifier --no-default-features --features legal-board-assets --lib domain::tests::disk_prefilter_preserves_exact_predecessors_across_target_chunks
          cargo check --locked -p clearra-core-executor --test legal_board_candidate_exact_set --features parallel,local-search-ab
