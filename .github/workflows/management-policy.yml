name: Clearra Management Policy

on:
  push:
    branches:
      - main
      - "codex/converge-*"
    paths:
      - ".github/workflows/management-policy.yml"
      - "tools/clearra-manage/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "config/clearra-management.v1.json"
      - "scripts/runtime/**"
      - "scripts/lib/clearra-build-*"
      - "scripts/lib/clearra-path-helpers.ps1"
      - "scripts/tools/clearra-build-policy*"
      - "scripts/tools/managed-transient-directory*"
      - "scripts/tools/invoke-clearra-build.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearra-management-policy-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  windows-runtime:
    name: Clearra management Windows runtime
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        id: source
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: node
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        with:
          node-version: 22.23.2
      - name: Install the exact Rust toolchain
        id: rust
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: pwsh
        run: >-
          rustup toolchain install 1.98.1 --profile minimal
          --component rustfmt --component clippy
      - name: Test the Rust manager and Node responder independently
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.node.outcome == 'success' }}
        shell: pwsh
        run: |
          node scripts/ci/run-independent-checks.mjs -- `
            cargo test --locked -p clearra-manage --no-fail-fast ::: `
            node --test scripts/runtime/clearra-node-gc.test.mjs scripts/ci/run-independent-checks.test.mjs scripts/tools/clearra-build-policy.test.mjs ::: `
            node scripts/tools/managed-transient-directory.contract.mjs
          exit $LASTEXITCODE
      - name: Build the Rust manager even after an independent test failure
        id: manager
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo build --locked --release -p clearra-manage
          exit $LASTEXITCODE
      - name: Audit real Windows manager storage and runtime independently
        if: ${{ !cancelled() && steps.manager.outcome == 'success' && steps.node.outcome == 'success' }}
        shell: pwsh
        run: |
          node scripts/ci/run-independent-checks.mjs -- `
            build/cargo/default/release/clearra-manage.exe --root . storage audit ::: `
            build/cargo/default/release/clearra-manage.exe --root . runtime audit
          exit $LASTEXITCODE
      - name: Verify Windows Job Object ownership
        if: ${{ !cancelled() && steps.manager.outcome == 'success' }}
        shell: pwsh
        run: |
          $manager = 'build/cargo/default/release/clearra-manage.exe'
          & $manager --root . runtime run --producer management-test --profile control --timeout 30 -- `
            pwsh -NoProfile -NonInteractive -Command "Write-Output 'job-object-ok'"
          if ($LASTEXITCODE -ne 0) { throw 'normal Job Object fixture failed' }
      - name: Verify managed Windows Node GC acknowledgement
        if: ${{ !cancelled() && steps.manager.outcome == 'success' && steps.node.outcome == 'success' }}
        shell: pwsh
        run: |
          $manager = 'build/cargo/default/release/clearra-manage.exe'
          $nodeOutput = & $manager --root . runtime run --producer management-node-gc --profile control --timeout 30 -- `
            node -e "setTimeout(() => {}, 3000)" 2>&1
          if ($LASTEXITCODE -ne 0) {
            $nodeOutput | ForEach-Object { Write-Host $_.ToString() }
            throw 'managed Node fixture failed'
          }
          $receiptLine = @($nodeOutput | ForEach-Object { $_.ToString() } | `
            Where-Object { $_.StartsWith('clearra_runtime_receipt=') })[-1]
          if (-not $receiptLine) { throw 'managed Node receipt is missing' }
          $nodeReceipt = Get-Content -LiteralPath $receiptLine.Substring('clearra_runtime_receipt='.Length) -Raw | ConvertFrom-Json
          if (-not $nodeReceipt.outcome.cooperative_gc_available) { throw 'managed Node GC responder is missing' }
          if ($nodeReceipt.outcome.last_owned_memory_bytes -le 0) { throw 'current Job Object memory was not observed' }
      - name: Verify Windows timeout enforcement after other fixture failures
        if: ${{ !cancelled() && steps.manager.outcome == 'success' }}
        shell: pwsh
        run: |
          $manager = 'build/cargo/default/release/clearra-manage.exe'
          $previousErrorAction = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & $manager --root . runtime run --producer management-test --profile control --timeout 1 -- `
            pwsh -NoProfile -NonInteractive -Command "Start-Sleep -Seconds 30"
          $timeoutExitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousErrorAction
          if ($timeoutExitCode -eq 0) { throw 'timeout fixture unexpectedly succeeded' }
          exit 0

  management-policy:
    name: Clearra management policy
    # Feedback for the manager itself, never a global product/release gate.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        id: source
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: node
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        with:
          node-version: 22.23.2
      - name: Install the exact Rust toolchain
        id: rust
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: >-
          rustup toolchain install 1.98.1 --profile minimal
          --component rustfmt --component clippy
      - name: Verify the focused management contract
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.node.outcome == 'success' }}
        run: |
          node scripts/ci/run-independent-checks.mjs -- \
            cargo test --locked -p clearra-manage --no-fail-fast ::: \
            node --test scripts/runtime/clearra-node-gc.test.mjs scripts/ci/run-independent-checks.test.mjs scripts/tools/clearra-build-policy.test.mjs ::: \
            node scripts/tools/managed-transient-directory.contract.mjs ::: \
            cargo clippy --locked -p clearra-manage -- -D warnings
      - name: Build the Linux manager independently of test and lint results
        id: manager
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          cargo build --locked --release -p clearra-manage
          manager="build/cargo/default/release/clearra-manage"
          echo "CLEARRA_MANAGE_BIN=$GITHUB_WORKSPACE/$manager" >> "$GITHUB_ENV"
      - name: Audit real Linux manager storage and runtime independently
        if: ${{ !cancelled() && steps.manager.outcome == 'success' && steps.node.outcome == 'success' }}
        run: |
          node scripts/ci/run-independent-checks.mjs -- \
            "$CLEARRA_MANAGE_BIN" --root . storage audit ::: \
            "$CLEARRA_MANAGE_BIN" --root . storage verify --path _local/artifacts/test/management-policy ::: \
            "$CLEARRA_MANAGE_BIN" --root . runtime audit
      - name: Reject the removed Git domain without hiding independent checks
        if: ${{ !cancelled() && steps.manager.outcome == 'success' }}
        run: |
          manager="$CLEARRA_MANAGE_BIN"
          if "$manager" --root . git inventory; then
            echo 'Rust manager unexpectedly accepted the removed Git domain' >&2
            exit 1
          fi
