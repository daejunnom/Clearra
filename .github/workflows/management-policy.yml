name: Clearra Management Policy

on:
  push:
    branches:
      - "codex/converge-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearra-management-policy-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  management-policy:
    name: Clearra management policy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Bind exact Corepack pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          if ((pnpm --version).Trim() -ne '11.5.0') { throw 'pnpm version mismatch' }
      - name: Resolve the exact pnpm store
        id: pnpm-store
        shell: pwsh
        run: |
          "path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT
      - name: Cache only the exact pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: clearra-pnpm-${{ runner.os }}-${{ runner.arch }}-node-22.23.2-pnpm-11.5.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore exact Cargo inputs and managed binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/tools/cargo/wasm-bindgen-cli/0.2.126
          key: clearra-cargo-${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-wasm-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock') }}
      - name: Synchronize and verify exact managed toolchains
        run: python -B _local/clearra_manage.py toolchain sync
      - name: Verify management contracts
        run: |
          python -B -m unittest discover -s _local/tests -v
          python -B _local/clearra_manage.py deps verify
          python -B _local/clearra_manage.py storage verify --path _local/artifacts/test/management-policy
      - name: Install the frozen workspace without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate package and workflow migration
        run: |
          pnpm --filter ctk3 run test
          pnpm --filter @clearra/ui run test
          pnpm deploy --filter @clearra/discord-bot --prod build/discord-container/ci-deploy
          cd build/discord-container/ci-deploy
          node --input-type=module -e "await import('./src/clearra/command.mjs'); await import('./src/job-service/server.mjs'); await import('ctk3')"
          cd ../../..
          node --test scripts/tools/accepted-ctk3-dist.test.mjs
          node --test scripts/release/candidate-preflight-workflow.test.mjs scripts/release/cloud/accepted-build-inputs.test.mjs
          node scripts/tools/validate-release-cli-smokes.mjs
      - name: Verify locked Rust workspace
        run: |
          python -B _local/clearra_manage.py storage run --producer cargo -- cargo fmt --all --check
          python -B _local/clearra_manage.py storage run --producer cargo -- cargo check --workspace --locked
