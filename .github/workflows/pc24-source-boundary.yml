name: PC 24L Source Boundary (Non-publishing)

on:
  push:
    branches: ["codex/converge-pc24-integration-20261005", "codex/converge-main-product-fixes-20261005", "codex/pc24-target-boundary-20261006", "codex/converge-pc24-family-20261006", "codex/converge-v081-document-frame-20261006", "codex/converge-v081-extended-pc-products-20261007"]
    paths:
      - ".github/workflows/pc24-source-boundary.yml"
      - "crates/clearra-pc-graph/**"
      - "crates/clearra-problem/**"
      - "crates/clearra-core-executor/**"
      - "crates/clearra-app/**"
      - "crates/clearra-validation/**"
      - "crates/clearra-wasm-abi/**"
      - "packages/clearra-ui/src/lib/workspace/solverWorkspaceModel.ts"
      - "packages/clearra-ui/src/lib/workspace/SolverWorkspace.svelte"
      - "packages/clearra-ui/test/workspaceCommandSerialization.test.mjs"
      - "crates/clearra-core-domain/**"
      - "crates/clearra-output/**"
      - "crates/clearra-fumen/**"
      - "crates/clearra-host-contract/src/solution_set_artifact_payload.rs"
      - "crates/clearra-cli/src/output/solution_artifact_output.rs"
      - "crates/clearra-cli/Cargo.toml"
      - "crates/clearra-cli/tests/extended_pc_tiling.rs"
      - "crates/clearra-app/src/app_response/solution_set_artifact.rs"
      - "crates/clearra-app/src/pc_minimum_cover_result.rs"
      - "crates/clearra-cli-command/src/web_command_request.rs"
      - "crates/clearra-cli-command/src/web_command_parser.rs"
      - "crates/clearra-cli-command/src/web_pc_scenario_input.rs"
      - "crates/clearra-cli-command/tests/pinned_pc.rs"
      - "packages/clearra-ui/src/lib/workspace/solutionExport.ts"
      - "packages/clearra-ui/src/lib/workspace/productResultPager.ts"
      - "packages/clearra-ui/src/lib/wasm/wasmCommandClient.ts"
      - "packages/clearra-ui/test/productResultPager.contract.ts"
      - "packages/clearra-ui/test/extendedSolutionKey.contract.ts"
      - "apps/clearra-discord-bot/src/clearra/ctk3-result.mjs"
      - "apps/clearra-discord-bot/test/extended-solution-key.test.mjs"
      - "crates/clearra-geometry/**"
      - "scripts/ci/pc24-source-boundary.test.mjs"
      - "tests/fixtures/contracts/pc_target_frame_parity.v1.tsv"
      - "tests/fixtures/contracts/extended_solution_keys.v1.tsv"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc24-source-boundary-${{ github.ref }}
  cancel-in-progress: true

# Separate runners keep this new proof from delaying existing v0.8.1,
# recovery, or product build owners. No release or profile qualification is
# inferred from these finite examples and no deployment is dispatched.
env:
  CLEARRA_BUILD_PURPOSE: experiment
  CARGO_BUILD_JOBS: "2"
  RUST_MIN_STACK: "16777216"

jobs:
  input-contract:
    if: github.ref == 'refs/heads/codex/converge-pc24-integration-20261005' || github.ref == 'refs/heads/codex/converge-main-product-fixes-20261005' || github.ref == 'refs/heads/codex/pc24-target-boundary-20261006' || github.ref == 'refs/heads/codex/converge-pc24-family-20261006' || github.ref == 'refs/heads/codex/converge-v081-document-frame-20261006' || github.ref == 'refs/heads/codex/converge-v081-extended-pc-products-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Verify the bounded non-publishing feedback contract
        run: node --test scripts/ci/pc24-source-boundary.test.mjs
      - name: Check target-frame and compiler source format
        run: cargo fmt -p clearra-pc-graph -p clearra-problem -p clearra-geometry -p clearra-core-domain -p clearra-core-executor -p clearra-output -p clearra-fumen -p clearra-host-contract -p clearra-cli -p clearra-cli-command -p clearra-app -p clearra-validation -p clearra-wasm-abi --check
      - name: Test allocation-free CTK2 identities and unchanged compact identities
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p clearra-core-domain --lib solution:: -- --test-threads=1
      - name: Test native CTK3 publication from the same four-word identities
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-output --no-default-features --lib artifact::solution_document::tests -- --test-threads=1
      - name: Test four-word Fumen fields without changing compact search identities
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p clearra-fumen --lib adapter:: -- --test-threads=1
      - name: Test typed twenty-four-line export refusal without truncating CTK3
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-output --no-default-features --lib full_height_document_keeps_ctk3_and_reports_fumens_real_limit -- --test-threads=1
      - name: Test the public App and CLI height-limit reasons
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p clearra-host-contract --lib solution_set_artifact_payload -- --test-threads=1
          cargo test --locked -p clearra-app --lib extended_document_error_tests -- --test-threads=1
          cargo test --locked -p clearra-cli --lib unsupported_fumen_height_preserves_its_explicit_cli_error -- --test-threads=1
      - name: Test compact minimum ingress does not acquire unsupported extended authority
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-cli-command --test pinned_pc -- --test-threads=1
      - name: Test fixed-width kick codec without changing its wire semantics
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-pc-graph --lib request::continuation_kick_profile_codec::tests -- --test-threads=1
      - name: Test bounded full-height Opening labels without enumerating PC solutions
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p clearra-pc-graph --lib partition:: -- --test-threads=1
      - name: Verify the compact six-line and extended twenty-four-line layout boundary without enumeration
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-geometry --lib layout::standard_pc_layout::tests -- --test-threads=1
      - name: Test compact and four-word input normalization without truncation
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-pc-graph --lib request::pc_scenario_query::tests -- --test-threads=1
      - name: Test the real full-height compiler input instead of a Board64 placeholder
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-problem --test extended_pc_execution -- --test-threads=1
      - name: Verify even empty-origin targets without enabling unconnected result products
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-validation --lib validators::pc_query_validator::tests -- --test-threads=1
      - name: Verify ordinary PC memory owners without widening Build or typed reducer authority
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-problem --lib ordinary_pc_family_memory_projection_counts_opening_and_scenario_owners -- --test-threads=1

  inverse-lock-clear:
    if: github.ref == 'refs/heads/codex/converge-pc24-integration-20261005' || github.ref == 'refs/heads/codex/converge-main-product-fixes-20261005' || github.ref == 'refs/heads/codex/pc24-target-boundary-20261006' || github.ref == 'refs/heads/codex/converge-pc24-family-20261006' || github.ref == 'refs/heads/codex/converge-v081-document-frame-20261006' || github.ref == 'refs/heads/codex/converge-v081-extended-pc-products-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned native and WASM Rust targets
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - name: Compile the same four-word execution bridge for WASM
        run: |
          cargo check --locked -p clearra-core-executor --target wasm32-unknown-unknown
          cargo check --locked -p clearra-output --no-default-features --target wasm32-unknown-unknown
          cargo check --locked -p clearra-wasm-abi --target wasm32-unknown-unknown
      - name: Verify real extended PC Tiling App products and cooperative terminals
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-app --no-default-features --test extended_pc_tiling -- --test-threads=1
      - name: Verify full-height PC family with actual BuildUp and supply-language evaluation
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-core-executor --no-default-features --test extended_pc_family -- --test-threads=1
      - name: Verify canonical full-height CLI execution without a native-C or tablebase fallback
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-cli --no-default-features --features wasm-cpu-runtime --test extended_pc_tiling -- --test-threads=1
      - name: Verify immutable compact and extended page owners and bounded catalog admission
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p clearra-core-executor --lib tiling_solution_store::tests -- --test-threads=1
          cargo test --locked -p clearra-core-executor --lib bounded_catalog_keeps_exact_identity_and_refuses_before_growth -- --test-threads=1
      - name: Verify one-placement Build and forced extended PC completion without large enumeration
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-core-executor --test extended_pc_ilc -- --test-threads=1
      - name: Verify CTK2 catalog reconstruction keeps the full source board and target height
        if: ${{ !cancelled() }}
        run: cargo test --locked -p clearra-core-executor --lib shared_extended_identity_resolves_only_matching_full_height_catalog_rows -- --test-threads=1

  document-wire:
    if: github.ref == 'refs/heads/codex/converge-pc24-integration-20261005' || github.ref == 'refs/heads/codex/converge-main-product-fixes-20261005' || github.ref == 'refs/heads/codex/pc24-target-boundary-20261006' || github.ref == 'refs/heads/codex/converge-pc24-family-20261006' || github.ref == 'refs/heads/codex/converge-v081-document-frame-20261006' || github.ref == 'refs/heads/codex/converge-v081-extended-pc-products-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Bind pinned pnpm and install without lifecycle scripts
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          git diff --exit-code
      - name: Build only the CTK3 test dependency
        run: node packages/clearra-ui/scripts/prepare-test-dependencies.mjs
      - name: Check shared UI contracts and whole-set clipboard publication
        if: ${{ !cancelled() }}
        run: |
          pnpm --filter @clearra/ui exec tsc --noEmit -p tsconfig.contract.json
          node scripts/tools/run-typescript-contracts.mjs packages/clearra-ui/test/extendedSolutionKey.contract.ts packages/clearra-ui/test/solutionExport.contract.ts packages/clearra-ui/test/productResultPager.contract.ts
          node --test packages/clearra-ui/test/workspaceCommandSerialization.test.mjs
      - name: Check Discord CTK3 projection against the same wire cases
        if: ${{ !cancelled() }}
        run: node --test apps/clearra-discord-bot/test/extended-solution-key.test.mjs apps/clearra-discord-bot/test/ctk3-result.test.mjs
