name: Pinned and Boundary exact-candidate validation (2026-09-25)

on:
  push:
    branches: ["codex/release-integrate-pinned-boundary-20260925"]
    paths: [".github/workflows/user-pinned-boundary-validation-20260925.yml"]

permissions:
  contents: read

concurrency:
  group: clearra-pinned-boundary-validation-b80fab6534855862b050c3391096a3022b59271d
  cancel-in-progress: false

env:
  CLEARRA_SOURCE_COMMIT: b80fab6534855862b050c3391096a3022b59271d
  CLEARRA_ENGINE_BUILD_ID: b80fab6534855862b050c3391096a3022b59271d
  RUST_MIN_STACK: "16777216"

# Exact-candidate tests only. No branch mutation, publication receipt, tag,
# deployment dispatch, permission bypass, or automatic conflict resolution.
jobs:
  release-regressions:
    if: github.repository == 'daejunnom/Clearra' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b80fab6534855862b050c3391096a3022b59271d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Require exact source and existing release ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CLEARRA_SOURCE_COMMIT" ]]
          git merge-base --is-ancestor 3e06bce344da89212b002d0cba96063703088074 HEAD
          git merge-base --is-ancestor 980806508bd88ab436023d08023cd306fb1904b8 HEAD
          test ! -e .github/workflows/user-branch-reconciliation-20260925.yml
          test ! -e .github/workflows/user-pinned-boundary-validation-20260925.yml
          test ! -e scripts/maintenance/user-branch-reconciliation-20260925.py
      - name: Install locked JavaScript workspace
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          [[ "$(pnpm --version)" == '11.5.0' ]]
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run the existing complete release regression selector
        run: node scripts/tools/run-release-regression-tests.mjs

  full-preflight:
    if: github.repository == 'daejunnom/Clearra' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b80fab6534855862b050c3391096a3022b59271d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Require exact candidate source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CLEARRA_SOURCE_COMMIT) { throw 'Candidate source mismatch' }
          if (Test-Path 'scripts/maintenance/user-branch-reconciliation-20260925.py') { throw 'Maintenance runner leaked into product tree' }
      - name: Install locked JavaScript workspace
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@11.5.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((pnpm --version).Trim() -ne '11.5.0') { throw 'pnpm version mismatch' }
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned native and WASM toolchains
        shell: powershell
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add --toolchain 1.98.1 wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tool = Get-Command wasm-bindgen -ErrorAction SilentlyContinue
          if ($null -eq $tool -or (& wasm-bindgen --version) -ne 'wasm-bindgen 0.2.126') {
            & ./scripts/tools/install-managed-cargo-tool.ps1 -Purpose experiment -ToolName wasm-bindgen-cli -Version 0.2.126
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run the existing full non-publishing ReleaseAcceptance gate
        shell: powershell
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          Ensure-ClearraBuildArtifactCache -RepositoryRoot $env:GITHUB_WORKSPACE -Purpose experiment
          try {
            $workers = [Math]::Max(1, [Environment]::ProcessorCount)
            & powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard Full -ExecutionSurface Trusted -RuntimeEnvironment windows -Workers $workers -VerboseLog -ShowWarnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Complete-ClearraBuildTransaction
          } finally {
            Exit-ClearraBuildArtifactCacheUsage
          }
      - name: Record exact-candidate test status without publication authority
        if: always()
        shell: pwsh
        run: |
          "Candidate: ``$env:CLEARRA_SOURCE_COMMIT``. This job performs tests only; it neither changes main nor publishes products." >> $env:GITHUB_STEP_SUMMARY
