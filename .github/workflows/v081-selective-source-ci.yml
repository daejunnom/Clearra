          "$manager" storage verify --path "$CLEARRA_REAL_ACCELERATOR_WASM_DIR"
          "$manager" storage verify --path "$CLEARRA_SIGNED_CONDITIONED_SMOKE_DIR"
      - name: Install the pinned managed ABI binding tool
        id: abi-tool
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.node.outcome == 'success' }}
