name: v0.8.1 Selective Source (Non-publishing)

on:
  push:
    branches: ["codex/v081-selective-source-ci-20260927", "codex/v081-main-convergence-20260928", "codex/converge-v081-linear-20260928"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v081-selective-source-${{ github.ref }}
  cancel-in-progress: true

# Source feedback only: no acceptance receipts, asset generation, release
# tags, main promotion, or Pages/Discord/Cloud traffic changes. The smokes
# explicitly download only unchanged qualified packs: five relations in Core,
# five legal-board/relation pairs in real WASM and the native compute adapter,
# and the selected SRS+ pair in the App job. No image or Cloud Run is published.
env:
  CLEARRA_BUILD_PURPOSE: experiment
  RUST_MIN_STACK: "16777216"
  CARGO_BUILD_JOBS: "2"

jobs:
  core:
    if: (github.ref == 'refs/heads/codex/v081-selective-source-ci-20260927' || github.ref == 'refs/heads/codex/v081-main-convergence-20260928' || github.ref == 'refs/heads/codex/converge-v081-linear-20260928') && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Verify product and local-only feature boundaries
        run: |
          cargo fmt -p clearra-core-executor --check
          cargo check --locked -p clearra-core-executor
          cargo check --locked -p clearra-core-executor --features parallel
          cargo check --locked -p clearra-core-executor --target wasm32-unknown-unknown
      - name: Test changed worker ownership and accelerator paths
        run: |
          cargo test --locked -p clearra-core-executor --lib v081_ --features parallel,local-search-ab,qualification-reference -- --test-threads=1
          cargo test --locked -p clearra-core-executor --lib backend::wasm_cpu::reachability --features parallel,local-search-ab,qualification-reference -- --test-threads=1
          cargo test --locked -p clearra-core-executor --lib row_frame::tests --features parallel,local-search-ab,qualification-reference -- --test-threads=1
          cargo test --locked -p clearra-core-executor --lib legal_board::tests --features parallel,local-search-ab,qualification-reference -- --test-threads=1
          cargo test --locked -p clearra-core-executor --lib conditioned_ --features parallel,local-search-ab,qualification-reference -- --test-threads=1
      - name: Fetch existing immutable qualified packs for solver smoke, not generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_local/artifacts/v081-peer-signed-smoke"
          gh release download conditioned-data-v081-20260924-rc1 --repo daejunnom/Clearra \
            --pattern 'conditioned-srs.cllr' --pattern 'conditioned-srs-plus.cllr' \
            --pattern 'conditioned-srs-x.cllr' --pattern 'conditioned-jstris-180.cllr' \
            --pattern 'conditioned-no-kick.cllr' --dir "$GITHUB_WORKSPACE/_local/artifacts/v081-peer-signed-smoke"
      - name: Verify signed full-owner and bounded-peer composition in the real solver
        env:
          CLEARRA_SIGNED_CONDITIONED_SMOKE_DIR: ${{ github.workspace }}/_local/artifacts/v081-peer-signed-smoke
        run: cargo test --locked -p clearra-core-executor --lib v081_signed_conditioned_pack_owner_peer_solver_smoke --features parallel,local-search-ab,qualification-reference -- --ignored --test-threads=1

  native-products:
    if: (github.ref == 'refs/heads/codex/v081-selective-source-ci-20260927' || github.ref == 'refs/heads/codex/v081-main-convergence-20260928' || github.ref == 'refs/heads/codex/converge-v081-linear-20260928') && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CLEARRA_FOCUSED_TEST_OUTPUT_ROOT: ${{ github.workspace }}/_local/artifacts/accelerator-store-tests
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Prepare the exact bounded asset-test root before compiling
        shell: bash
        run: |
          test "$CLEARRA_FOCUSED_TEST_OUTPUT_ROOT" = "$GITHUB_WORKSPACE/_local/artifacts/accelerator-store-tests"
          mkdir -p "$CLEARRA_FOCUSED_TEST_OUTPUT_ROOT"
      - name: Typecheck integrated native products and benchmark facade
        id: native-check
        run: |
          cargo check --locked -p clearra-cli -p clearra-gui-host --tests --no-default-features --features clearra-cli/wasm-cpu-runtime
          cargo check --locked -p clearra-cli --features wasm-cpu-runtime
          cargo check --locked -p clearra-cli --no-default-features --features wasm-cpu-runtime,local-search-ab
          cargo check --locked -p clearra-pc4-qualifier --all-targets
      - name: Test typed policy parity without the monolithic App test binary
        run: |
          cargo test --locked -p clearra-pc-graph --lib pc_execution_policy -- --test-threads=1
          cargo test --locked -p clearra-cli-command --lib exact_accelerator -- --test-threads=1
          cargo test --locked -p clearra-cli-command --lib shared_parser_preserves_all_accelerator -- --test-threads=1
          cargo test --locked -p clearra-gui-host --lib gui_exact_accelerators --no-default-features -- --test-threads=1
          cargo test --locked -p clearra-gui-host --lib gui_setup_request_preserves_independent --no-default-features -- --test-threads=1
          cargo test --locked -p clearra-gui-host --test exact_accelerator_surface_parity --no-default-features -- --test-threads=1
          cargo test --locked -p clearra-app --test exact_accelerator_policy --no-default-features -- --test-threads=1
          cargo test --locked -p clearra-accelerator-activation --lib -- --test-threads=1
          cargo test --locked -p clearra-accelerator-product-host --lib -- --test-threads=1
          cargo test --locked -p clearra-accelerator-product-host --bin clearra-accelerator-release-gate -- --test-threads=1
          cargo test --locked -p clearra-accelerator-runtime --lib -- --test-threads=1
      - name: Test real PC and Build reducer results with independent accelerators
        if: ${{ !cancelled() && steps.native-check.outcome == 'success' }}
        run: cargo test --locked -p clearra-app --test exact_accelerator_product_execution --no-default-features --features parallel -- --test-threads=1
      - name: Fetch the unchanged SRS+ signed pair for App result smoke
        id: app-assets
        if: ${{ !cancelled() && steps.native-check.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_local/artifacts/v081-peer-signed-smoke"
          gh release download legal-board-data-v081-20260924-rc1 --repo daejunnom/Clearra \
            --pattern 'legal-board-srs-plus-v2.cllb' --dir "$GITHUB_WORKSPACE/_local/artifacts/v081-peer-signed-smoke"
          gh release download conditioned-data-v081-20260924-rc1 --repo daejunnom/Clearra \
            --pattern 'conditioned-srs-plus.cllr' --dir "$GITHUB_WORKSPACE/_local/artifacts/v081-peer-signed-smoke"
      - name: Verify signed admission and real App result parity without an alternate solver
        if: ${{ !cancelled() && steps.native-check.outcome == 'success' && steps.app-assets.outcome == 'success' }}
        env:
          CLEARRA_SIGNED_APP_SMOKE_DIR: ${{ github.workspace }}/_local/artifacts/v081-peer-signed-smoke
        run: cargo test --locked -p clearra-app --test exact_accelerator_product_execution --no-default-features --features parallel -- --ignored --test-threads=1
      - name: Test explicit asset lifecycle and repair
        if: ${{ !cancelled() && steps.native-check.outcome == 'success' }}
        run: |
          failed=0
          for filter in \
            accelerator_asset_store::repair_tests \
            accelerator_gui_bridge \
            conditioned_reachability_assets \
            lifecycle_routes \
            exact_accelerators \
            exact_accelerator_flags \
            tie_snapshot::tests \
            product_execution_failure_does_not_reclassify_explicit_runtime_refusals; do
            if cargo test --locked -p clearra-cli --lib "$filter" --no-default-features -- --test-threads=1; then
              :
            else
              failed=$((failed + 1))
              echo "::error::Focused CLI test family failed: $filter"
            fi
          done
          test "$failed" -eq 0
      - name: Test bounded generation and parser proofs, not full profile regeneration
        if: ${{ !cancelled() && steps.native-check.outcome == 'success' }}
        run: |
          cargo test --locked -p clearra-pc4-qualifier --lib conditioned_local_candidate_validation::tests -- --test-threads=1
          cargo test --locked -p clearra-pc4-qualifier --lib conditioned_local_relation_generation::tests -- --test-threads=1
          cargo test --locked -p clearra-pc4-qualifier --lib reverse_domain_membership_matches_complete_forward_enumeration -- --test-threads=1
          cargo test --locked -p clearra-pc4-qualifier --lib final_bundle_and_catalog_are_bound_without_granting_product_authority -- --test-threads=1
      - name: Build one ordinary CLI for the real compute-data adapter, without benchmark features
        id: compute-cli
        if: ${{ !cancelled() && steps.native-check.outcome == 'success' }}
        run: cargo build --locked -p clearra-cli --no-default-features --features wasm-cpu-runtime
      - name: Provision unchanged signed compute data and verify real CLI policy parity, not a container
        id: compute-assets
        if: ${{ !cancelled() && steps.compute-cli.outcome == 'success' }}
        env:
          CLEARRA_REAL_COMPUTE_CLI: ${{ github.workspace }}/build/cargo/default/debug/clearra
          CLEARRA_REAL_COMPUTE_ASSET_ROOT: ${{ github.workspace }}/_local/artifacts/v081-compute-data-smoke
          CLEARRA_REAL_COMPUTE_SOURCE_COMMIT: ${{ github.sha }}
          CLEARRA_REAL_COMPUTE_MODE: provision
        run: |
          test "$CLEARRA_REAL_COMPUTE_CLI" = "$GITHUB_WORKSPACE/build/cargo/default/debug/clearra"
          test "$CLEARRA_REAL_COMPUTE_ASSET_ROOT" = "$GITHUB_WORKSPACE/_local/artifacts/v081-compute-data-smoke"
          test -x "$CLEARRA_REAL_COMPUTE_CLI"
          node --test apps/clearra-discord-bot/test/realComputeAccelerators.test.mjs
      - name: Verify real CLI products through the production Discord runner without publishing
        if: ${{ !cancelled() && steps.compute-cli.outcome == 'success' && steps.compute-assets.outcome == 'success' }}
        env:
          CLEARRA_REAL_COMPUTE_CLI: ${{ github.workspace }}/build/cargo/default/debug/clearra
          CLEARRA_REAL_COMPUTE_ASSET_ROOT: ${{ github.workspace }}/_local/artifacts/v081-compute-data-smoke
          CLEARRA_REAL_COMPUTE_SOURCE_COMMIT: ${{ github.sha }}
          CLEARRA_LEGAL_BOARD_DIRECTORY: ${{ github.workspace }}/_local/artifacts/v081-compute-data-smoke/legal-board
          CLEARRA_CONDITIONED_REACHABILITY_DIRECTORY: ${{ github.workspace }}/_local/artifacts/v081-compute-data-smoke/conditioned-reachability
        run: node --test apps/clearra-discord-bot/test/realCliProductProjection.test.mjs
      - name: Verify real Desktop native jobs with the same installed signed assets
        if: ${{ !cancelled() && steps.compute-cli.outcome == 'success' && steps.compute-assets.outcome == 'success' }}
        env:
          CLEARRA_REAL_DESKTOP_SOURCE_COMMIT: ${{ github.sha }}
          CLEARRA_LEGAL_BOARD_DIRECTORY: ${{ github.workspace }}/_local/artifacts/v081-compute-data-smoke/legal-board
          CLEARRA_CONDITIONED_REACHABILITY_DIRECTORY: ${{ github.workspace }}/_local/artifacts/v081-compute-data-smoke/conditioned-reachability
        run: |
          test "$CLEARRA_LEGAL_BOARD_DIRECTORY" = "$GITHUB_WORKSPACE/_local/artifacts/v081-compute-data-smoke/legal-board"
          test "$CLEARRA_CONDITIONED_REACHABILITY_DIRECTORY" = "$GITHUB_WORKSPACE/_local/artifacts/v081-compute-data-smoke/conditioned-reachability"
          mkdir -p "$GITHUB_WORKSPACE/_local/artifacts/v081-desktop-native-smoke"
          cargo test --locked -p clearra-cli --test desktop_signed_accelerator_execution --no-default-features --features wasm-cpu-runtime,clearra-gui-host/wasm-cpu-runtime -- --ignored --test-threads=1
      - name: Recheck the same native data layer read-only as an unprivileged user, not an accepted image
        if: ${{ !cancelled() && steps.compute-cli.outcome == 'success' }}
        shell: bash
        env:
          CLEARRA_REAL_COMPUTE_CLI: ${{ github.workspace }}/build/cargo/default/debug/clearra
          CLEARRA_REAL_COMPUTE_ASSET_ROOT: ${{ github.workspace }}/_local/artifacts/v081-compute-data-smoke
        run: |
          test "$CLEARRA_REAL_COMPUTE_ASSET_ROOT" = "$GITHUB_WORKSPACE/_local/artifacts/v081-compute-data-smoke"
          test -d "$CLEARRA_REAL_COMPUTE_ASSET_ROOT/legal-board"
          test -d "$CLEARRA_REAL_COMPUTE_ASSET_ROOT/conditioned-reachability"
          # The runner checkout can be inaccessible to nobody. Stage only
          # public adapter code, this exact CLI and these signed data bytes;
          # never widen permissions on the runner home or whole checkout.
          cargo build --locked --release -p clearra-manage
          manager="$GITHUB_WORKSPACE/build/cargo/default/release/clearra-manage"
          readonly_root="$GITHUB_WORKSPACE/_local/artifacts/v081-compute-readonly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$manager" storage verify --path "$readonly_root"
          test ! -e "$readonly_root"
          mkdir -p "$readonly_root"
          cp "$CLEARRA_REAL_COMPUTE_CLI" "$readonly_root/clearra"
          cp "$GITHUB_WORKSPACE/apps/clearra-discord-bot/scripts/provision-v081-accelerators.mjs" "$readonly_root/provision-v081-accelerators.mjs"
          cp -a "$CLEARRA_REAL_COMPUTE_ASSET_ROOT" "$readonly_root/data"
          cmp -s "$CLEARRA_REAL_COMPUTE_CLI" "$readonly_root/clearra"
          cmp -s "$GITHUB_WORKSPACE/apps/clearra-discord-bot/scripts/provision-v081-accelerators.mjs" "$readonly_root/provision-v081-accelerators.mjs"
          # Carry the exact already-used Node runtime and its host libraries.
          # Ubuntu 24.04 matches this job's CLI ABI; no image is built/accepted.
          node_binary="$(command -v node)"
          cp -L "$node_binary" "$readonly_root/node"
          cmp -s "$node_binary" "$readonly_root/node"
          mkdir "$readonly_root/lib"
          ldd "$readonly_root/node" "$readonly_root/clearra" > "$readonly_root/dynamic-libraries.txt"
          node scripts/ci/readonly-runtime-libraries.mjs "$readonly_root/dynamic-libraries.txt" > "$readonly_root/runtime-libraries.txt"
          while IFS= read -r library; do
            case "$library" in /lib/*|/lib64/*|/usr/lib/*|/usr/lib64/*) ;; *) exit 1 ;; esac
            destination="$readonly_root/lib/$(basename "$library")"
            if test -e "$destination"; then cmp -s "$library" "$destination"; else cp -L "$library" "$destination"; fi
          done < "$readonly_root/runtime-libraries.txt"
          chmod -R a+rX,a-w "$readonly_root"
          docker pull ubuntu:24.04
          readonly_image="$(docker image inspect --format '{{.Id}}' ubuntu:24.04)"
          case "$readonly_image" in sha256:*) ;; *) exit 1 ;; esac
          printf 'readonly_fixture_image=%s\n' "$readonly_image"
          readonly_container="v081-compute-readonly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker container inspect "$readonly_container" >/dev/null 2>&1; then exit 1; fi
          trap 'docker container rm --force "$readonly_container" >/dev/null 2>&1 || true' EXIT
          docker run --rm --name "$readonly_container" --read-only --network none --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges --memory 4g --pids-limit 64 \
            --mount "type=bind,src=$readonly_root,dst=/proof,readonly" \
            --env LD_LIBRARY_PATH=/proof/lib "$readonly_image" /bin/sh -ec '
              test -r /proof/provision-v081-accelerators.mjs
              test -x /proof/clearra
              test ! -w /proof/data
              test ! -w /proof/data/legal-board
              test ! -w /proof/data/conditioned-reachability
              exec /proof/node /proof/provision-v081-accelerators.mjs verify 0.8.1 /proof/clearra /proof/data
            '

  wasm-abi:
    if: (github.ref == 'refs/heads/codex/v081-selective-source-ci-20260927' || github.ref == 'refs/heads/codex/v081-main-convergence-20260928' || github.ref == 'refs/heads/codex/converge-v081-linear-20260928') && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
    outputs:
      product_wire_ready: ${{ steps.real-wire.outcome == 'success' && steps.wire-upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust and WASM target
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - name: Preserve fail-operational reset and typed accelerator admission
        run: |
          cargo check --locked -p clearra-wasm-abi --target wasm32-unknown-unknown
          cargo test --locked -p clearra-wasm-abi --lib reset_rejects_a_borrowed_runtime_without_a_second_panic -- --test-threads=1
          cargo test --locked -p clearra-wasm-abi --lib accelerator_ -- --test-threads=1
      - name: Produce real minimum portfolios for UI wire smoke
        id: real-wire
        if: ${{ !cancelled() }}
        env:
          CLEARRA_REAL_PORTFOLIO_SMOKE_DIR: ${{ github.workspace }}/_local/artifacts/v081-product-page-smoke
        run: |
          test "$CLEARRA_REAL_PORTFOLIO_SMOKE_DIR" = "$GITHUB_WORKSPACE/_local/artifacts/v081-product-page-smoke"
          mkdir -p "$CLEARRA_REAL_PORTFOLIO_SMOKE_DIR"
          cargo test --locked -p clearra-wasm --test exact_accelerator_portfolio_wire --features webgpu-search -- --ignored --test-threads=1
          test -s "$CLEARRA_REAL_PORTFOLIO_SMOKE_DIR/portfolio-wire-smoke.json"
      - name: Carry only the current source/run/attempt-bound functional fixture
        id: wire-upload
        if: ${{ !cancelled() && steps.real-wire.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: v081-real-product-wire-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/_local/artifacts/v081-product-page-smoke/portfolio-wire-smoke.json
          if-no-files-found: error
          retention-days: 3

  product-wire-ui:
    needs: wasm-abi
    if: ${{ !cancelled() && needs.wasm-abi.outputs.product_wire_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLEARRA_REAL_PORTFOLIO_SMOKE_DIR: ${{ github.workspace }}/_local/artifacts/v081-product-page-smoke
      CLEARRA_REAL_PORTFOLIO_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@v4
        with:
          name: v081-real-product-wire-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/_local/artifacts/v081-product-page-smoke
      - name: Install locked UI test dependencies without scripts
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          test "$(pnpm --version)" = "11.5.0"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Consume real Rust results through production UI validation and whole-set copy
        run: |
          test "$CLEARRA_REAL_PORTFOLIO_SMOKE_DIR" = "$GITHUB_WORKSPACE/_local/artifacts/v081-product-page-smoke"
          test -s "$CLEARRA_REAL_PORTFOLIO_SMOKE_DIR/portfolio-wire-smoke.json"
          node --test packages/clearra-ui/test/realPortfolioWire.test.mjs
      - name: Install pinned Chromium for actual portfolio clipboard
        run: |
          mkdir -p "$RUNNER_TEMP/clearra-browser-tools"
          npm install --prefix "$RUNNER_TEMP/clearra-browser-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/clearra-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "CLEARRA_BROWSER_TOOLS_ROOT=$RUNNER_TEMP/clearra-browser-tools" >> "$GITHUB_ENV"
      - name: Copy the full Rust-produced selected set from a visible member page in Chromium
        run: node scripts/tools/v081-portfolio-browser-copy-acceptance.mjs

  surfaces:
    if: (github.ref == 'refs/heads/codex/v081-selective-source-ci-20260927' || github.ref == 'refs/heads/codex/v081-main-convergence-20260928' || github.ref == 'refs/heads/codex/converge-v081-linear-20260928') && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Verify focused CI path and failure contracts
        run: node --test scripts/ci/v081-source-ci-contract.test.mjs scripts/ci/readonly-runtime-libraries.test.mjs
      - name: Install locked UI dependencies without scripts
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          test "$(pnpm --version)" = "11.5.0"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Test exact harness, lifecycle, and immutable compute packaging
        run: |
          node --test scripts/benchmark/v081-accelerator-abba-core.test.mjs scripts/benchmark/v081-worker-memory-accounting.test.mjs scripts/benchmark/v081-product-memo-abba-core.test.mjs
          node --test apps/clearra-web/test/acceleratorDownloadStream.test.mjs apps/clearra-desktop/test/acceleratorLifecycleClient.test.mjs
          node --test apps/clearra-discord-bot/test/accelerator-image.test.mjs apps/clearra-discord-bot/test/exact-accelerator-command.test.mjs
          node --test scripts/tools/build-clearra-frontend.test.mjs scripts/release/accepted-pages-build.test.mjs
          pnpm --filter @clearra/ui test
      - name: Verify Web worker types, heartbeats, and proof handoffs without a WASM build
        working-directory: apps/clearra-web
        run: |
          pnpm exec tsc --noEmit -p tsconfig.contract.json
          node ../../scripts/tools/run-typescript-contracts.mjs ./test

  wasm-realms:
    if: (github.ref == 'refs/heads/codex/v081-selective-source-ci-20260927' || github.ref == 'refs/heads/codex/v081-main-convergence-20260928' || github.ref == 'refs/heads/codex/converge-v081-linear-20260928') && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
      CLEARRA_REAL_ACCELERATOR_WASM_DIR: ${{ github.workspace }}/_local/artifacts/v081-browser-peer-smoke/wasm
      CLEARRA_SIGNED_CONDITIONED_SMOKE_DIR: ${{ github.workspace }}/_local/artifacts/v081-peer-signed-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install pinned Rust and WASM target
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - name: Prepare the Rust manager and explicit functional output roots
        run: |
          cargo build --locked --release -p clearra-manage
          manager="$GITHUB_WORKSPACE/build/cargo/default/release/clearra-manage"
          echo "CLEARRA_MANAGE_BIN=$manager" >> "$GITHUB_ENV"
          "$manager" storage verify --path "$CLEARRA_REAL_ACCELERATOR_WASM_DIR"
          "$manager" storage verify --path "$CLEARRA_SIGNED_CONDITIONED_SMOKE_DIR"
      - name: Install the pinned managed ABI binding tool
        shell: pwsh
        run: |
          & ./scripts/tools/install-managed-cargo-tool.ps1 -Purpose experiment -ToolName wasm-bindgen-cli -Version 0.2.126
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build ordinary product WASM once, without profiling or benchmark features
        run: node scripts/tools/build-clearra-wasm.mjs --destination "$CLEARRA_REAL_ACCELERATOR_WASM_DIR"
      - name: Fetch only unchanged qualified relation packs for real WASM execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$CLEARRA_SIGNED_CONDITIONED_SMOKE_DIR"
          gh release download conditioned-data-v081-20260924-rc1 --repo daejunnom/Clearra \
            --pattern 'conditioned-srs.cllr' --pattern 'conditioned-srs-plus.cllr' \
            --pattern 'conditioned-srs-x.cllr' --pattern 'conditioned-jstris-180.cllr' \
            --pattern 'conditioned-no-kick.cllr' --dir "$CLEARRA_SIGNED_CONDITIONED_SMOKE_DIR"
      - name: Fetch only unchanged qualified legal-board packs for actual synopsis peers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download legal-board-data-v081-20260924-rc1 --repo daejunnom/Clearra \
            --pattern 'legal-board-srs-v2.cllb' --pattern 'legal-board-srs-plus-v2.cllb' \
            --pattern 'legal-board-srs-x-v2.cllb' --pattern 'legal-board-jstris-180-v2.cllb' \
            --pattern 'legal-board-no-kick-v2.cllb' --dir "$CLEARRA_SIGNED_CONDITIONED_SMOKE_DIR"
      - name: Execute actual WASM owner and two isolated peer realms without browser claims
        run: |
          test "$CLEARRA_REAL_ACCELERATOR_WASM_DIR" = "$GITHUB_WORKSPACE/_local/artifacts/v081-browser-peer-smoke/wasm"
          test -s "$CLEARRA_REAL_ACCELERATOR_WASM_DIR/clearra_wasm.manifest.json"
          test "$CLEARRA_SIGNED_CONDITIONED_SMOKE_DIR" = "$GITHUB_WORKSPACE/_local/artifacts/v081-peer-signed-smoke"
          node --test apps/clearra-web/test/realAcceleratorRealms.test.mjs
      - name: Install locked dependencies for the actual production Web verifier consumer
        if: ${{ !cancelled() }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Execute the production Web pool and verifier worker with the same WASM and signed packs
        if: ${{ !cancelled() }}
        run: node scripts/tools/run-real-web-verifier-pool-smoke.mjs
      - name: Install pinned Chromium for the signed accelerator browser boundary
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/clearra-browser-tools"
          npm install --prefix "$RUNNER_TEMP/clearra-browser-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/clearra-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "CLEARRA_BROWSER_TOOLS_ROOT=$RUNNER_TEMP/clearra-browser-tools" >> "$GITHUB_ENV"
      - name: Exercise actual browser UI, signed WASM admission, and cross-tab asset storage
        if: ${{ !cancelled() }}
        run: node scripts/tools/v081-accelerator-signed-browser-acceptance.mjs
