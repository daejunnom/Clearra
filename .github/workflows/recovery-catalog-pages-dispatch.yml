name: Queue verified Recovery catalog Pages
on:
  push:
    branches: [codex/dispatch-recovery-catalog-pages-20260929]
    paths: [.github/workflows/recovery-catalog-pages-dispatch.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: queue-recovery-catalog-pages-b781f6b
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.repository == 'daejunnom/Clearra'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b781f6b6ef1c9ce27e0430f87663a92508e1cb7d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Bind browser success and current public snapshot, then invoke the existing queue owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {mkdirSync,writeFileSync,appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {githubApi as api} from './scripts/release/queue-pages-publication.mjs';
          import {readCanonicalPublicResponse} from './scripts/release/pages-canonical-capture.mjs';
          const repo='daejunnom/Clearra', base=`repos/${repo}`;
          const source='b781f6b6ef1c9ce27e0430f87663a92508e1cb7d';
          const snapshot='3c7cc3d799ef47515cf79fbcf83ea46c88a8c6a4';
          const acceptance='36515160162',browser='36516587621';
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          assert.equal(process.env.GITHUB_REF,'refs/heads/codex/dispatch-recovery-catalog-pages-20260929');
          assert.equal(process.env.GITHUB_RUN_ATTEMPT,'1');
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),source);
          const assertMain=()=>assert.equal(api('GET',`${base}/git/ref/heads/main`).object.sha,source);
          assertMain();
          const verified=api('GET',`${base}/actions/runs/${browser}`);
          assert.equal(verified.head_sha,'f8f0bca7e0a185a864b58874631968d32ddef397');
          assert.equal(verified.path,'.github/workflows/recovery-catalog-real-browser.yml');
          assert.equal(verified.status,'completed');assert.equal(verified.conclusion,'success');
          const canonical=api('GET',`${base}/actions/runs/${acceptance}`);
          assert.equal(canonical.head_sha,source);assert.equal(canonical.head_branch,'main');
          assert.equal(canonical.event,'workflow_dispatch');assert.equal(canonical.path,'.github/workflows/release-cli.yml');
          assert.equal(canonical.run_attempt,1);
          assert.ok(['queued','in_progress','completed'].includes(canonical.status));
          assert.ok(canonical.status==='completed'?canonical.conclusion==='success':canonical.conclusion===null);
          const publicResponse=await fetch(`https://daejunnom.github.io/Clearra/clearra-build-identity.json?catalog=${process.env.GITHUB_RUN_ID}`,{
            cache:'no-store',redirect:'error',signal:AbortSignal.timeout(30000),headers:{'cache-control':'no-store',pragma:'no-cache'}});
          const bytes=await readCanonicalPublicResponse(publicResponse,1024*1024);
          const identity=JSON.parse(bytes);assert.equal(identity.sourceCommit,snapshot);assert.equal(identity.basePath,'/Clearra');
          const previous=api('GET',`${base}/actions/workflows/queue-pages-publication.yml/runs?head_sha=${source}&event=workflow_dispatch&per_page=100`);
          assert.equal(previous.total_count,0,'Inspect an existing queue instead of duplicate dispatch.');
          const out='_local/artifacts/test/recovery-catalog-pages-dispatch';mkdirSync(out,{recursive:true});
          writeFileSync(`${out}/public-before.json`,bytes);
          assertMain();
          const receipt=api('POST',`${base}/actions/workflows/queue-pages-publication.yml/dispatches`,{
            ref:'main',inputs:{acceptance_run_id:acceptance,snapshot_sha:snapshot}});
          writeFileSync(`${out}/receipt.json`,JSON.stringify({source,snapshot,acceptance,browser,receipt},null,2)+'\n');
          const id=String(receipt.workflow_run_id??'');assert.match(id,/^[1-9][0-9]*$/u,'Uncertain dispatch: do not retry.');
          assert.equal(receipt.html_url,`https://github.com/${repo}/actions/runs/${id}`);
          const run=api('GET',`${base}/actions/runs/${id}`);
          assert.equal(run.head_sha,source);assert.equal(run.path,'.github/workflows/queue-pages-publication.yml');
          assert.equal(run.head_branch,'main');assert.equal(run.event,'workflow_dispatch');
          console.log(JSON.stringify({source,queue_run_id:id,acceptance_run_id:acceptance}));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Existing canonical queue: ${receipt.html_url}\n\nPublication remains gated by canonical acceptance and rollback capture.\n`);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-catalog-pages-dispatch
          path: _local/artifacts/test/recovery-catalog-pages-dispatch
          retention-days: 14
