name: Dispatch verified Recovery surface publication

# Branch-only operator entrypoint. The unchanged canonical workflows remain
# the sole owners of acceptance, rollback capture and product publication.
on:
  push:
    branches: [codex/dispatch-recovery-surface-contract-20260929]
    paths: [.github/workflows/recovery-surface-publication-dispatch.yml]

permissions:
  contents: read
  actions: write

concurrency:
  group: recovery-surface-publication-3c7cc3d
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'daejunnom/Clearra' && github.actor == 'daejunnom'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3c7cc3d799ef47515cf79fbcf83ea46c88a8c6a4
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Require exact main, passed CI, and the live rollback source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, writeFileSync, appendFileSync } from 'node:fs';
          import { githubApi as api } from './scripts/release/queue-pages-publication.mjs';

          const repository = 'daejunnom/Clearra';
          const source = '3c7cc3d799ef47515cf79fbcf83ea46c88a8c6a4';
          const snapshot = '1868d31da7730cc9d3018aecd18e442c6940a5d7';
          const candidate = 'codex/converge-recovery-surface-contract-20260929';
          const base = `repos/${repository}`;
          const report = '_local/artifacts/test/recovery-surface-publication';
          assert.equal(process.env.GITHUB_REPOSITORY, repository);
          assert.equal(process.env.GITHUB_REF, 'refs/heads/codex/dispatch-recovery-surface-contract-20260929');
          assert.equal(process.env.GITHUB_RUN_ATTEMPT, '1', 'Never rerun a dispatch owner.');
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), source);
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD:scripts/tools/surface-browser-acceptance.mjs'], { encoding: 'utf8' }).trim(),
            '90ec3c6c99a498abfd564ee5e75779a33f9fb0ce');
          const assertMain = () => assert.equal(api('GET', `${base}/git/ref/heads/main`).object.sha, source);
          assertMain();
          assert.equal(api('GET', `${base}/git/ref/heads/${candidate}`).object.sha, source);
          const ci = api('GET', `${base}/actions/runs/36468612277`);
          assert.equal(ci.head_sha, source);
          assert.equal(ci.head_branch, candidate);
          assert.equal(ci.event, 'push');
          assert.equal(ci.path, '.github/workflows/management-policy.yml');
          assert.equal(ci.repository.full_name, repository);
          assert.equal(ci.run_attempt, 1);
          assert.equal(ci.status, 'completed');
          assert.equal(ci.conclusion, 'success');

          const identityUrl = `https://daejunnom.github.io/Clearra/clearra-build-identity.json?readback=${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(identityUrl, { headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(20000) });
          assert.equal(response.status, 200);
          assert.equal(new URL(response.url).origin, 'https://daejunnom.github.io');
          const live = await response.json();
          assert.equal(live.schema, 'clearra.pages.identity.v2');
          assert.equal(live.basePath, '/Clearra');
          assert.equal(live.sourceCommit, snapshot, 'Live Pages changed; no publication was dispatched.');
          assert.equal(live.engineBuildId, snapshot);
          assert.equal(live.acceptedRunId, '36388470463');
          assert.equal(live.acceptedRunAttempt, '1');

          const prior = api('GET', `${base}/actions/workflows/release-cli.yml/runs?head_sha=${source}&event=workflow_dispatch&per_page=100`);
          assert.equal(prior.total_count, 0, 'Inspect an existing gate instead of creating a duplicate.');
          mkdirSync(report, { recursive: true });
          const receipt = { source_commit: source, snapshot_sha: snapshot, ci_run_id: ci.id, dispatches: [] };
          writeFileSync(`${report}/live-before.json`, JSON.stringify(live, null, 2) + '\n');
          const save = () => writeFileSync(`${report}/dispatch-receipts.json`, JSON.stringify(receipt, null, 2) + '\n');
          function dispatch(workflow, inputs) {
            assertMain();
            const created = api('POST', `${base}/actions/workflows/${workflow}/dispatches`, { ref: 'main', inputs });
            receipt.dispatches.push({ workflow, receipt: created });
            save();
            const id = String(created.workflow_run_id ?? '');
            assert.match(id, /^[1-9][0-9]*$/u, 'Uncertain POST receipt: do not retry.');
            assert.equal(created.html_url, `https://github.com/${repository}/actions/runs/${id}`);
            assert.equal(created.run_url, `https://api.github.com/${base}/actions/runs/${id}`);
            const run = api('GET', `${base}/actions/runs/${id}`);
            assert.equal(run.head_sha, source);
            assert.equal(run.head_branch, 'main');
            assert.equal(run.event, 'workflow_dispatch');
            assert.equal(run.path, `.github/workflows/${workflow}`);
            assert.equal(run.run_attempt, 1);
            assert.equal(run.repository.full_name, repository);
            console.log(`${workflow}: ${id}, source=${source}`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${workflow}: ${created.html_url}\n\n`);
            return id;
          }
          const acceptance = dispatch('release-cli.yml', {});
          dispatch('queue-pages-publication.yml', { acceptance_run_id: acceptance, snapshot_sha: snapshot });
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Dispatch receipts only; acceptance and deployment are not yet proven. No source ref, tag, Release or Discord service was changed by this entrypoint.\n');
          JS
      - name: Preserve exact dispatch receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-surface-publication-dispatch
          path: _local/artifacts/test/recovery-surface-publication/
          if-no-files-found: warn
          retention-days: 14
