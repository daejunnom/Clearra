name: Clearra Surface Repair
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-surface-repair.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearra-surface-repair-${{ github.sha }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: afb1a2789f782d679d921c41ad298db90651f98a
          fetch-depth: 0
      - name: Apply the reviewed source-contract and Discord trigger patch without changing main
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base='952280950aeb24528279cbff685fe8acec892223'
          parent='b2cff45470e29871c75aa1e44b37ea892e6d5b79'
          branch='codex/converge-surface-repair-20260926'
          expected_tree='132b113a93a6cf8487b3c5d1c902a30e2f244023'
          patch=pathlib.Path('scripts/integration/pages-discord-contract-fix-20260926.patch').read_bytes()
          if hashlib.sha256(patch).hexdigest()!='3952ebce4259b106627a05765517deb92deb54f4570d68a5236ae5a04126dbff':
              raise RuntimeError('Reviewed patch checksum mismatch')
          for ref,sha in [('refs/heads/main',base),('refs/heads/'+branch,parent)]:
              rows=git('ls-remote','origin',ref).splitlines()
              if len(rows)!=1 or rows[0].split()!=[sha,ref]: raise RuntimeError('Reviewed ref moved; reconcile before applying')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'pages-discord-reviewed.patch'
          target.write_bytes(patch)
          git('checkout','--detach',parent)
          git('apply','--check',str(target)); git('apply',str(target))
          git('diff','--check'); git('add','--all')
          expected=['.github/workflows/discord-deploy.yml','apps/clearra-web/tsconfig.contract.json',
              'scripts/release/discord-acceptance-trigger.mjs','scripts/release/discord-acceptance-trigger.test.mjs',
              'scripts/release/discord-deploy-workflow.test.mjs','scripts/tools/build-clearra-frontend.mjs',
              'scripts/tools/build-clearra-frontend.test.mjs','scripts/tools/run-release-regression-tests.mjs',
              'scripts/tools/run-release-regression-tests.test.mjs','scripts/types/node-contract-builtins.d.ts']
          if git('diff','--cached','--name-only').splitlines()!=expected or git('write-tree')!=expected_tree:
              raise RuntimeError('Reviewed source tree or changed scope mismatch')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','fix: separate prebuild worker contracts and bind Discord deployment to exact Release acceptance')
          candidate=git('rev-parse','HEAD')
          if git('show','-s','--format=%P',candidate)!=parent: raise RuntimeError('Parent mismatch')
          receipt={'candidate':candidate,'parent':parent,'base':base,'tree':expected_tree,'changed_files':expected,'main_updated':False}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'pages-discord-preparation.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt),flush=True)
          git('push','origin',candidate+':refs/heads/'+branch)
          if git('ls-remote','origin','refs/heads/'+branch).split()[0]!=candidate: raise RuntimeError('Candidate readback mismatch')
          subprocess.run(['gh','workflow','run','management-policy.yml','--ref',branch],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('candidate='+candidate+'\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-discord-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/pages-discord-preparation.json
          if-no-files-found: warn
          retention-days: 14
  verifier-contracts:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Install the pinned toolchain before bounded compiler provenance probes
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustc --version
          cargo --version
          echo 'RUSTUP_AUTO_INSTALL=0' >> "$GITHUB_ENV"
      - name: Install exact frozen workspace
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck and execute the complete worker suite before any WASM or Svelte generation
        shell: bash
        run: |
          set -euo pipefail
          {
            node -e "const f=require('node:fs'); for(const p of ['apps/clearra-web/.svelte-kit/tsconfig.json','apps/clearra-web/static/wasm/clearra_wasm.manifest.json']) if(f.existsSync(p)) throw Error('prebuild fixture unexpectedly exists: '+p)"
            pnpm --filter @clearra/web run test
            node -e "const f=require('node:fs'); for(const p of ['apps/clearra-web/.svelte-kit/tsconfig.json','apps/clearra-web/static/wasm/clearra_wasm.manifest.json']) if(f.existsSync(p)) throw Error('source test generated product input: '+p)"
            for attempt in 1 2 3; do
              echo "verifier_clock_repetition=$attempt source=${{ needs.prepare.outputs.candidate }}"
              node scripts/tools/run-typescript-contracts.mjs apps/clearra-web/test/ClearraVerifierPool.contract.ts
            done
          } 2>&1 | tee "$RUNNER_TEMP/verifier-clock.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-clock-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/verifier-clock.log
          retention-days: 14
          if-no-files-found: warn
  contracts:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Verify immutable historical fixture before running release regressions
        run: |
          test "$(git rev-parse 'refs/tags/v0.7.4^{tag}')" = a95973dbc1c3c1919478328d12e4d25ddaedea71
          test "$(git rev-parse 'refs/tags/v0.7.4^{commit}')" = 0438d85f90b47c4ce89835f6a6d665a0415aa25a
      - name: Install exact frozen workspace
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Test GPU absence, mandatory selection, Svelte and exact Discord release authority
        shell: bash
        run: |
          set -euo pipefail
          {
            node --test scripts/tools/build-clearra-frontend.test.mjs scripts/release/discord-acceptance-trigger.test.mjs
            node --test apps/clearra-web/test/browserGpuAvailability.test.mjs packages/clearra-ui/test/mandatorySolutionSelection.test.mjs
            pnpm --filter @clearra/ui run test
            node scripts/desktop-ui-compile-check.mjs
            node scripts/tools/run-release-regression-tests.mjs
          } 2>&1 | tee "$RUNNER_TEMP/repair-contracts.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-repair-contracts-${{ github.run_id }}
          path: ${{ runner.temp }}/repair-contracts.log
          retention-days: 14
          if-no-files-found: warn
  acceptance:
    needs: [prepare, verifier-contracts]
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [FoundationNoProductDebt, FoundationAdversarialCorrectness, FoundationDesktopHost, Sanitizer, RustExact, RustProduct, Pages]
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_WEB_BASE_PATH: /Clearra
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Bind exact package inputs
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/tools/cargo/wasm-bindgen-cli/0.2.126
            ~/.cargo/registry
            ~/.cargo/git
          key: release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-${{ needs.prepare.outputs.candidate }}
          restore-keys: |
            release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-
      - name: Prepare exact toolchains
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CLEARRA_SOURCE_COMMIT) { throw 'Source mismatch' }
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_BUILD_JOBS=$([Math]::Max(1, [Environment]::ProcessorCount))" >> $env:GITHUB_ENV
          if ('${{ matrix.shard }}' -eq 'Pages') {
            rustup target add wasm32-unknown-unknown
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./scripts/tools/install-managed-cargo-tool.ps1 -Purpose experiment -ToolName wasm-bindgen-cli -Version 0.2.126
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run exact acceptance including compiled browser behavior in Pages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $workers = [Math]::Max(1, [Environment]::ProcessorCount)
          & powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard '${{ matrix.shard }}' -ExecutionSurface Trusted -RuntimeEnvironment windows -Workers $workers -VerboseLog -ShowWarnings 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'surface-repair-leaf.log')
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-repair-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/surface-repair-leaf.log
            ${{ runner.temp }}/clearra-surface-acceptance
          if-no-files-found: warn
          retention-days: 14
  rust-regressions:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUST_MIN_STACK: '16777216'
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', persist-credentials: false}
      - name: Test exact boundary and borrowed-state cleanup
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo fmt --all --check
            cargo test --locked --package clearra-forward-search --lib boundary_recovery -- --test-threads=1
            cargo test --locked --package clearra-wasm-abi --lib reset_rejects_a_borrowed_runtime_without_a_second_panic -- --test-threads=1
            cargo test --locked --package clearra-wasm-abi --lib warm_minimum_to_geometry_releases_authority -- --test-threads=1
            cargo test --locked --package clearra-wasm-abi --lib exact_replacement_requires_geometry_finish -- --test-threads=1
          } 2>&1 | tee "$RUNNER_TEMP/repair-rust.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-repair-rust-${{ github.run_id }}
          path: ${{ runner.temp }}/repair-rust.log
          if-no-files-found: warn
          retention-days: 14
  ready:
    if: always()
    needs: [prepare, verifier-contracts, contracts, acceptance, rust-regressions]
    runs-on: ubuntu-latest
    steps:
      - name: Require complete exact-source acceptance
        env: {RESULTS: '${{ toJSON(needs) }}'}
        shell: python
        run: |
          import json,os
          results=json.loads(os.environ['RESULTS'])
          failed={k:v['result'] for k,v in results.items() if v['result']!='success'}
          if failed: raise RuntimeError(json.dumps(failed))
          print('Nonpublishing acceptance passed:',results['prepare']['outputs']['candidate'])
          print('Independent management policy is still required. Canonical Release success will automatically trigger the existing exact-source Discord workflow after main promotion; no deployment runs here.')
