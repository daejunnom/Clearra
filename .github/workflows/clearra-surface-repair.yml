name: Clearra Surface Repair
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-surface-repair.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearra-surface-repair-${{ github.sha }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dbaf785a4b85049a66012713dec9604b79081065
          fetch-depth: 0
      - name: Apply reviewed exact product changes without changing publication workflows
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,pathlib,subprocess,zlib
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          main='952280950aeb24528279cbff685fe8acec892223'
          branch='codex/converge-surface-repair-20260926'
          data=''.join(pathlib.Path(f'scripts/integration/surface-repair-20260926.part{i}').read_text().strip() for i in range(1,7))
          patch=zlib.decompress(base64.b64decode(data,validate=True))
          supplement=pathlib.Path('scripts/integration/surface-repair-gate-owner.patch').read_bytes()
          for data,sha in [(patch,'5cfd53ff50745ccc584ed4f7c7523365c04c5f8774744cfd5dcc1882c4631c75'),(supplement,'5ee08b5963d72a9fd26de414aa37fefb5e190f1345b43106bdcf798978e7be17')]:
              if hashlib.sha256(data).hexdigest()!=sha: raise RuntimeError('Patch checksum mismatch')
          if git('ls-remote','origin','refs/heads/main').split()[0]!=main: raise RuntimeError('Main moved')
          if git('ls-remote','origin','refs/heads/'+branch): raise RuntimeError('Candidate exists; never overwrite')
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          (root/'repair.patch').write_bytes(patch)
          (root/'supplement.patch').write_bytes(supplement)
          git('checkout','--detach',main)
          for name in ['repair.patch','supplement.patch']:
              git('apply','--check',str(root/name)); git('apply',str(root/name))
          git('diff','--check')
          git('add','--all')
          paths=git('diff','--cached','--name-only').splitlines()
          if len(paths)!=24 or any(p.startswith(('.github/','scripts/integration/')) for p in paths): raise RuntimeError('Unexpected product paths')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','fix: restore fail-operational browser search and connect Svelte recovery and mandatory solutions')
          candidate=git('rev-parse','HEAD')
          print(json.dumps({'candidate':candidate,'base':main,'branch':branch,'changed_files':paths,'main_updated':False}),flush=True)
          git('push','origin','HEAD:refs/heads/'+branch)
          subprocess.run(['gh','workflow','run','management-policy.yml','--ref',branch],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('candidate='+candidate+'\n')
  contracts:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Install exact frozen workspace
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Test GPU absence, mandatory selection, UI and release contracts
        run: |
          node --test apps/clearra-web/test/browserGpuAvailability.test.mjs packages/clearra-ui/test/mandatorySolutionSelection.test.mjs
          pnpm --filter @clearra/ui run test
          node scripts/desktop-ui-compile-check.mjs
          node scripts/tools/run-release-regression-tests.mjs
  acceptance:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [FoundationNoProductDebt, FoundationAdversarialCorrectness, FoundationDesktopHost, Sanitizer, RustExact, RustProduct, Pages]
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_WEB_BASE_PATH: /Clearra
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Bind exact package inputs
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/tools/cargo/wasm-bindgen-cli/0.2.126
            ~/.cargo/registry
            ~/.cargo/git
          key: release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-${{ needs.prepare.outputs.candidate }}
          restore-keys: |
            release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-
      - name: Prepare exact toolchains
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CLEARRA_SOURCE_COMMIT) { throw 'Source mismatch' }
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_BUILD_JOBS=$([Math]::Max(1, [Environment]::ProcessorCount))" >> $env:GITHUB_ENV
          if ('${{ matrix.shard }}' -eq 'Pages') {
            rustup target add wasm32-unknown-unknown
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./scripts/tools/install-managed-cargo-tool.ps1 -Purpose experiment -ToolName wasm-bindgen-cli -Version 0.2.126
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run exact acceptance including compiled browser behavior in Pages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $workers = [Math]::Max(1, [Environment]::ProcessorCount)
          & powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard '${{ matrix.shard }}' -ExecutionSurface Trusted -RuntimeEnvironment windows -Workers $workers -VerboseLog -ShowWarnings 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'surface-repair-leaf.log')
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-repair-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/surface-repair-leaf.log
            ${{ runner.temp }}/clearra-surface-acceptance
          if-no-files-found: warn
          retention-days: 14
  rust-regressions:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUST_MIN_STACK: '16777216'
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', persist-credentials: false}
      - name: Test exact boundary and borrowed-state cleanup
        run: |
          cargo fmt --all --check
          cargo test --locked --package clearra-forward-search --lib boundary_recovery -- --test-threads=1
          cargo test --locked --package clearra-wasm-abi --lib reset_rejects_a_borrowed_runtime_without_a_second_panic -- --test-threads=1
          cargo test --locked --package clearra-wasm-abi --lib warm_minimum_to_geometry_releases_authority -- --test-threads=1
          cargo test --locked --package clearra-wasm-abi --lib exact_replacement_requires_geometry_finish -- --test-threads=1
  ready:
    if: always()
    needs: [prepare, contracts, acceptance, rust-regressions]
    runs-on: ubuntu-latest
    steps:
      - name: Require complete exact-source acceptance
        env: {RESULTS: '${{ toJSON(needs) }}'}
        shell: python
        run: |
          import json,os
          results=json.loads(os.environ['RESULTS'])
          failed={k:v['result'] for k,v in results.items() if v['result']!='success'}
          if failed: raise RuntimeError(json.dumps(failed))
          print('Nonpublishing acceptance passed:',results['prepare']['outputs']['candidate'])
          print('Independent management policy is still required before main promotion. No publication performed.')
