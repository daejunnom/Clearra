name: Clearra Surface Repair
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-surface-repair.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearra-surface-repair-${{ github.sha }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7a5b7d568d605a9d053e34af1a7783740280380
          fetch-depth: 0
      - name: Apply the reviewed pinned document boundary repair without changing main
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base='952280950aeb24528279cbff685fe8acec892223'
          parent='dc379d89153270bcb7d959be7b11f080f849238a'
          branch='codex/converge-surface-repair-20260926'
          tree='380f3be1269f502c0c92e035df54b2a817ca5403'
          patch=pathlib.Path('scripts/integration/build-pinned-mirror-document-20260926.patch').read_bytes()
          if hashlib.sha256(patch).hexdigest()!='a5b7ad0856e623de2a618802b5089ffb97bd8a9a9c1b8cb11667d0f2f01c7467':
              raise RuntimeError('Reviewed patch bytes differ')
          if git('ls-remote','origin','refs/heads/main').split()[0]!=base:
              raise RuntimeError('main moved; reconcile before applying')
          expected=['crates/clearra-app/src/build_colored_target_document.rs',
              'crates/clearra-app/src/build_pinned_solution_document.rs','crates/clearra-app/src/lib.rs',
              'crates/clearra-cli-command/src/web_build_v2_input.rs',
              'crates/clearra-wasm/tests/wasm_host_contract.rs']
          tip=git('ls-remote','origin','refs/heads/'+branch).split()[0]
          if tip==parent:
              target=pathlib.Path(os.environ['RUNNER_TEMP'])/'build-pinned-mirror.patch'
              target.write_bytes(patch)
              git('checkout','--detach',parent)
              git('merge-base','--is-ancestor',base,parent)
              git('apply','--check',str(target)); git('apply','--index',str(target))
              git('diff','--cached','--check')
              if git('diff','--cached','--name-only').splitlines()!=expected or git('write-tree')!=tree:
                  raise RuntimeError('Reviewed source scope or tree mismatch')
              git('config','user.name','github-actions[bot]')
              git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              git('commit','-m','fix: distinguish required mirrored drawings from a single Build target')
              candidate=git('rev-parse','HEAD')
              git('push','origin',candidate+':refs/heads/'+branch)
          else:
              candidate=tip
          if (git('show','-s','--format=%P',candidate)!=parent or
              git('rev-parse',candidate+'^{tree}')!=tree or
              git('diff','--name-only',parent,candidate).splitlines()!=expected):
              raise RuntimeError('Candidate identity changed; reconcile before running')
          if git('ls-remote','origin','refs/heads/'+branch).split()[0]!=candidate:
              raise RuntimeError('Candidate readback mismatch')
          receipt={'candidate':candidate,'parent':parent,'base':base,'tree':tree,'changed_files':expected,'main_updated':False}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'mirror-preparation.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt),flush=True)
          subprocess.run(['gh','workflow','run','management-policy.yml','--ref',branch],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('candidate='+candidate+'\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirror-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/mirror-preparation.json
          if-no-files-found: warn
          retention-days: 14
  control-browser:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_BROWSER_TOOLS_ROOT: ${{ github.workspace }}/build/tools/control-browser
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Install frozen source dependencies and pinned Chromium
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          npm install --prefix "$CLEARRA_BROWSER_TOOLS_ROOT" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node "$CLEARRA_BROWSER_TOOLS_ROOT/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise compiled Svelte native clicks touch keyboard and disabled controls
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tools/workspace-controls-browser-acceptance.mjs 2>&1 | tee "$RUNNER_TEMP/control-browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-browser-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/control-browser.log
            ${{ runner.temp }}/clearra-control-acceptance
          retention-days: 14
          if-no-files-found: warn
  verifier-contracts:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Install the pinned toolchain before bounded compiler provenance probes
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustc --version
          cargo --version
          echo 'RUSTUP_AUTO_INSTALL=0' >> "$GITHUB_ENV"
      - name: Install exact frozen workspace
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Test compiler inventory and clean sync then execute all worker contracts
        shell: bash
        run: |
          set -euo pipefail
          {
            node -e "const f=require('node:fs'); for(const p of ['apps/clearra-web/.svelte-kit/tsconfig.json','apps/clearra-web/static/wasm/clearra_wasm.manifest.json']) if(f.existsSync(p)) throw Error('prebuild fixture unexpectedly exists: '+p)"
            node --test --test-name-pattern='source-only worker|standalone contract compiler|release frontend sync|Pages acceptance owns' scripts/tools/build-clearra-frontend.test.mjs
            node --test packages/clearra-ui/test/buildProbabilityMirrorSelection.test.mjs
            pnpm --filter @clearra/web run test
            node -e "const f=require('node:fs'); for(const p of ['apps/clearra-web/.svelte-kit/tsconfig.json','apps/clearra-web/static/wasm/clearra_wasm.manifest.json']) if(f.existsSync(p)) throw Error('source test generated product input: '+p)"
            for attempt in 1 2 3; do
              echo "verifier_clock_repetition=$attempt source=${{ needs.prepare.outputs.candidate }}"
              node scripts/tools/run-typescript-contracts.mjs apps/clearra-web/test/ClearraVerifierPool.contract.ts
            done
          } 2>&1 | tee "$RUNNER_TEMP/verifier-clock.log"
      - name: Run the complete Windows static architecture gate before expensive compilation
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/validate_architecture.ps1 -Workers ([Math]::Max(1, [Environment]::ProcessorCount)) -VerboseLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-clock-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/verifier-clock.log
          retention-days: 14
          if-no-files-found: warn
  contracts:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Verify immutable historical fixture before running release regressions
        run: |
          test "$(git rev-parse 'refs/tags/v0.7.4^{tag}')" = a95973dbc1c3c1919478328d12e4d25ddaedea71
          test "$(git rev-parse 'refs/tags/v0.7.4^{commit}')" = 0438d85f90b47c4ce89835f6a6d665a0415aa25a
      - name: Install exact frozen workspace
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Test frontend preparation GPU fallback mandatory selection and Discord authority
        shell: bash
        run: |
          set -euo pipefail
          {
            node --test scripts/tools/build-clearra-frontend.test.mjs scripts/release/discord-acceptance-trigger.test.mjs
            node --test apps/clearra-web/test/browserGpuAvailability.test.mjs packages/clearra-ui/test/mandatorySolutionSelection.test.mjs packages/clearra-ui/test/buildProbabilityMirrorSelection.test.mjs
            pnpm --filter @clearra/ui run test
            node scripts/desktop-ui-compile-check.mjs
            node scripts/tools/run-release-regression-tests.mjs
          } 2>&1 | tee "$RUNNER_TEMP/repair-contracts.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-repair-contracts-${{ github.run_id }}
          path: ${{ runner.temp }}/repair-contracts.log
          retention-days: 14
          if-no-files-found: warn
  acceptance:
    needs: [prepare, verifier-contracts, control-browser, rust-regressions]
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [FoundationNoProductDebt, FoundationAdversarialCorrectness, FoundationDesktopHost, Sanitizer, RustExact, RustProduct, Pages]
    env:
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_WEB_BASE_PATH: /Clearra
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.2}
      - name: Bind exact package inputs
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/tools/cargo/wasm-bindgen-cli/0.2.126
            ~/.cargo/registry
            ~/.cargo/git
          key: release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-${{ needs.prepare.outputs.candidate }}
          restore-keys: |
            release-acceptance-native-v4-${{ runner.os }}-bindgen-0.2.126-${{ hashFiles('Cargo.lock', 'apps/clearra-desktop/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}-
      - name: Prepare exact toolchains
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CLEARRA_SOURCE_COMMIT) { throw 'Source mismatch' }
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_BUILD_JOBS=$([Math]::Max(1, [Environment]::ProcessorCount))" >> $env:GITHUB_ENV
          if ('${{ matrix.shard }}' -eq 'Pages') {
            rustup target add wasm32-unknown-unknown
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./scripts/tools/install-managed-cargo-tool.ps1 -Purpose experiment -ToolName wasm-bindgen-cli -Version 0.2.126
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run exact acceptance including compiled browser behavior in Pages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $workers = [Math]::Max(1, [Environment]::ProcessorCount)
          & powershell -NoProfile -File scripts/clearra.ps1 -Task ReleaseAcceptance -ReleaseAcceptanceShard '${{ matrix.shard }}' -ExecutionSurface Trusted -RuntimeEnvironment windows -Workers $workers -VerboseLog -ShowWarnings 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'surface-repair-leaf.log')
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-repair-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/surface-repair-leaf.log
            ${{ runner.temp }}/clearra-surface-acceptance
            ${{ runner.temp }}/clearra-control-acceptance
          if-no-files-found: warn
          retention-days: 14
  rust-regressions:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUST_MIN_STACK: '16777216'
      CLEARRA_SOURCE_COMMIT: ${{ needs.prepare.outputs.candidate }}
      CLEARRA_ENGINE_BUILD_ID: ${{ needs.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', persist-credentials: false}
      - name: Test real mirrored Build and pins before expensive acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked --package clearra-wasm --test wasm_host_contract build_mirror_source_and_pins_preserve_exact_sets_and_union_probability -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/build-mirror.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/build-mirror.log"
      - name: Test both document formats and keep single-target validation strict
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --package clearra-app --no-default-features --features bitmap-render --lib build_pinned_solution_document -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/pinned-document.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/pinned-document.log"
      - name: Test exact boundary and borrowed-state cleanup and require nonempty results
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo test --locked --package clearra-forward-search --lib boundary_recovery -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/boundary-regression.log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/boundary-regression.log"
            for filter in reset_rejects_a_borrowed_runtime_without_a_second_panic warm_minimum_to_geometry_releases_authority exact_replacement_requires_geometry_finish; do
              cargo test --locked --package clearra-wasm-abi --lib "$filter" -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/$filter.log"
              grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/$filter.log"
            done
          } 2>&1 | tee "$RUNNER_TEMP/repair-rust.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-repair-rust-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/repair-rust.log
            ${{ runner.temp }}/build-mirror.log
            ${{ runner.temp }}/pinned-document.log
          if-no-files-found: warn
          retention-days: 14
  ready:
    if: always()
    needs: [prepare, verifier-contracts, control-browser, contracts, acceptance, rust-regressions]
    runs-on: ubuntu-latest
    steps:
      - name: Require complete exact-source acceptance
        env: {RESULTS: '${{ toJSON(needs) }}'}
        shell: python
        run: |
          import json,os
          results=json.loads(os.environ['RESULTS'])
          failed={k:v['result'] for k,v in results.items() if v['result']!='success'}
          if failed: raise RuntimeError(json.dumps(failed))
          print('Nonpublishing acceptance passed:',results['prepare']['outputs']['candidate'])
          print('Independent management policy is still required. Canonical Release success will automatically trigger the existing exact-source Discord workflow after main promotion; no deployment runs here.')
