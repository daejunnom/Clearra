name: Clearra Repair Failure Evidence
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-repair-failure-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve completed job logs without changing repository data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os,pathlib,json,urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair-evidence'
          root.mkdir()
          api='https://api.github.com/repos/daejunnom/Clearra'
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              return urllib.request.urlopen(req,timeout=60).read()
          jobs=json.loads(get(api+'/actions/runs/36164931714/jobs?per_page=100'))
          (root/'jobs.json').write_text(json.dumps(jobs,indent=2))
          failures=[]
          for job in jobs['jobs']:
              if job['name'] not in ['contracts','rust-regressions'] or job['status']!='completed': continue
              try:
                  data=get(api+'/actions/jobs/'+str(job['id'])+'/logs')
                  (root/(str(job['id'])+'.log')).write_bytes(data)
              except Exception as error: failures.append({'job_id':job['id'],'error':str(error)})
          (root/'download-errors.json').write_text(json.dumps(failures))
          print('Preserved job metadata and available raw logs')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clearra-repair-raw-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/repair-evidence
          retention-days: 7
          if-no-files-found: error
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecc2f9e80218d6404a3eaee688b861f0f654da87
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install exact frozen workspace
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Record unchanged source checks with independent exit codes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/repair-replay"
          git rev-parse HEAD > "$RUNNER_TEMP/repair-replay/source.txt"
          cp packages/clearra-ui/src/lib/workspace/mandatorySolutionSelection.ts "$RUNNER_TEMP/repair-replay/mandatorySolutionSelection.ts"
          cp scripts/desktop-ui-compile-check.mjs "$RUNNER_TEMP/repair-replay/desktop-ui-compile-check.mjs"
          set +e
          pnpm --filter @clearra/ui run test > "$RUNNER_TEMP/repair-replay/ui.log" 2>&1
          echo "ui=$?" >> "$RUNNER_TEMP/repair-replay/codes.txt"
          node scripts/desktop-ui-compile-check.mjs > "$RUNNER_TEMP/repair-replay/desktop.log" 2>&1
          echo "desktop=$?" >> "$RUNNER_TEMP/repair-replay/codes.txt"
          node scripts/tools/run-release-regression-tests.mjs > "$RUNNER_TEMP/repair-replay/release.log" 2>&1
          echo "release=$?" >> "$RUNNER_TEMP/repair-replay/codes.txt"
          cargo fmt --all --check > "$RUNNER_TEMP/repair-replay/fmt.log" 2>&1
          echo "fmt=$?" >> "$RUNNER_TEMP/repair-replay/codes.txt"
          cat "$RUNNER_TEMP/repair-replay/codes.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clearra-repair-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/repair-replay
          retention-days: 7
          if-no-files-found: error
