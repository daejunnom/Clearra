name: Clearra Repair Failure Evidence
on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-repair-failure-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve raw CI logs without executing repository code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os,pathlib,json,urllib.request,zipfile,io
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair-evidence'
          root.mkdir()
          api='https://api.github.com/repos/daejunnom/Clearra'
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              return urllib.request.urlopen(req,timeout=90).read()
          jobs=json.loads(get(api+'/actions/runs/36164931714/jobs?per_page=100'))
          (root/'jobs.json').write_text(json.dumps(jobs,indent=2))
          for job in jobs['jobs']:
              if job['name'] not in ['contracts','rust-regressions']: continue
              if job['status']!='completed': continue
              data=get(api+'/actions/jobs/'+str(job['id'])+'/logs')
              (root/(str(job['id'])+'.log')).write_bytes(data)
          print('Collected exact job IDs:',[(j['id'],j['name'],j['conclusion']) for j in jobs['jobs']])
      - uses: actions/upload-artifact@v4
        with:
          name: clearra-repair-raw-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/repair-evidence
          retention-days: 7
          if-no-files-found: error
