name: Recovery Build Regression

on:
  push:
    branches: [codex/recovery-build-fields-parallel-20260928]

permissions:
  contents: read

concurrency:
  group: recovery-build-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed host-capacity correction
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/recovery-build-fields-parallel-20260928
          marker='.map(|request| request.with_worker_hardware_limit(worker_hardware_limit.max(1)))'
          if ! grep -Fq "$marker" crates/clearra-cli-command/src/web_command_parser.rs; then
            git apply --check scripts/tools/recovery-build-host-capacity.patch
            git apply scripts/tools/recovery-build-host-capacity.patch
            git add -- crates/clearra-cli-command/src/web_command_parser.rs crates/clearra-cli-command/src/web_command_parser/recovery_build.rs crates/clearra-cli-command/tests/recovery_build.rs packages/clearra-ui/src/lib/workspace/recoveryBuildModel.ts packages/clearra-ui/test/recoveryBuildReferences.test.mjs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(recovery): propagate host worker capacity and use-all opt-in'
            git push origin HEAD:refs/heads/codex/recovery-build-fields-parallel-20260928
          fi
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format changed Rust files on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/recovery-build-fields-parallel-20260928
          mapfile -t files < <(git diff --name-only --diff-filter=ACM 13376dee8638cb5de5437ade910f07f5eab20629 HEAD -- '*.rs')
          if ((${#files[@]})); then
            rustfmt --edition 2024 --config skip_children=true "${files[@]}"
            git add -- "${files[@]}"
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'style(recovery): format focused parallel implementation'
              git push origin HEAD:refs/heads/codex/recovery-build-fields-parallel-20260928
            fi
          fi
      - name: Preserve exact implementation source
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/recovery-tested-sha.txt"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/recovery-build-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-build-source
          path: |
            ${{ runner.temp }}/recovery-build-source.tar.gz
            ${{ runner.temp }}/recovery-tested-sha.txt
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare external browser test tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clearra-browser-tools"
          npm install --prefix "$RUNNER_TEMP/clearra-browser-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/clearra-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "CLEARRA_BROWSER_TOOLS_ROOT=$RUNNER_TEMP/clearra-browser-tools" >> "$GITHUB_ENV"
      - name: Native and WASM paired-coverage regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/recovery-regression
          result=0
          cargo test --locked -p clearra-forward-search recovery_build -- --nocapture 2>&1 | tee build/recovery-regression/core.log || result=1
          cargo test --locked -p clearra-cli-command --test recovery_build -- --nocapture 2>&1 | tee build/recovery-regression/cli.log || result=1
          cargo test --locked -p clearra-wasm --test recovery_build_wire -- --nocapture 2>&1 | tee build/recovery-regression/wasm-runtime.log || result=1
          cargo check --locked -p clearra-wasm --target wasm32-unknown-unknown 2>&1 | tee build/recovery-regression/wasm-target.log || result=1
          exit "$result"
      - name: UI contracts and real browser field regression
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/recovery-regression
          result=0
          node packages/clearra-ui/scripts/prepare-test-dependencies.mjs 2>&1 | tee build/recovery-regression/ui-prepare.log || result=1
          node --test packages/clearra-ui/test/recoveryBuild*.test.mjs packages/clearra-ui/test/boundaryRecoverySurface.test.mjs 2>&1 | tee build/recovery-regression/ui-unit.log || result=1
          pnpm --filter @clearra/ui exec tsc --noEmit -p tsconfig.contract.json 2>&1 | tee build/recovery-regression/ui-types.log || result=1
          node scripts/tools/recovery-build-browser-regression.mjs 2>&1 | tee build/recovery-regression/browser.log || result=1
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-build-regression-results
          path: build/recovery-regression
          if-no-files-found: ignore
          retention-days: 7
