name: Recovery Build Regression

on:
  push:
    branches:
      - codex/recovery-build-fields-parallel-20260928
      - codex/converge-recovery-build-release-20260928
      - codex/v081-main-convergence-20260928
      - codex/converge-v081-linear-20260928

permissions:
  contents: read

concurrency:
  group: recovery-build-regression-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify both source imports and the exact workspace-formatted recovery source
        if: github.ref == 'refs/heads/codex/converge-recovery-build-release-20260928'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          imported=71dc202f20037089178e1d65813a2df1d1b86c2e
          git merge-base --is-ancestor "$imported" HEAD
          git merge-base --is-ancestor c2dd8509914846ed81119cd7094e7f70ac3d979c "$imported"
          paths=(crates/clearra-app crates/clearra-cli-command crates/clearra-forward-search crates/clearra-wasm packages tests scripts/tools/recovery-build-browser-regression.mjs scripts/tools/recovery-build-regression.sh)
          git diff --exit-code f7ed59dc3ac695d7983a8a539fe161a67f8ee8dc "$imported" -- "${paths[@]}"
          git diff --exit-code c2dd8509914846ed81119cd7094e7f70ac3d979c HEAD -- crates/clearra-core-executor scripts/tools/build-clearra-wasm.mjs scripts/tools/benchmark-rust-environment.mjs scripts/tools/clearra-build-policy.test.mjs
          # Normalize the immutable, previously checked import with the exact
          # pinned workspace formatter. Compare bytes, not a whitespace-ignored
          # diff, so sorting imports does not hide a functional source change.
          expected="$RUNNER_TEMP/recovery-formatted-source"
          mkdir -p "$expected"
          git archive "$imported" | tar -x -C "$expected"
          (cd "$expected" && cargo fmt --all)
          for path in "${paths[@]}"; do
            git diff --no-index --exit-code -- "$expected/$path" "$path"
          done
      - name: Check the repository-wide formatting contract
        run: cargo fmt --all --check
      - name: Preserve exact implementation source
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/recovery-tested-sha.txt"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/recovery-build-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-build-source
          path: |
            ${{ runner.temp }}/recovery-build-source.tar.gz
            ${{ runner.temp }}/recovery-tested-sha.txt
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare external browser test tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clearra-browser-tools"
          npm install --prefix "$RUNNER_TEMP/clearra-browser-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/clearra-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "CLEARRA_BROWSER_TOOLS_ROOT=$RUNNER_TEMP/clearra-browser-tools" >> "$GITHUB_ENV"
      - name: Native and WASM paired-coverage and clear-row regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/recovery-regression
          result=0
          cargo test --locked -p clearra-forward-search recovery_build -- --nocapture 2>&1 | tee build/recovery-regression/core.log || result=1
          # These Build integration fixtures each acquire the whole process-wide
          # memory lease. Isolate test cases, not the solver's internal workers;
          # contention is an admission result, not a geometry counterexample.
          cargo test --locked -p clearra-core-executor build_clear_row_pruning -- --nocapture --test-threads=1 2>&1 | tee build/recovery-regression/build-clear-row.log || result=1
          cargo test --locked -p clearra-cli-command --test recovery_build -- --nocapture 2>&1 | tee build/recovery-regression/cli.log || result=1
          cargo test --locked -p clearra-wasm --test recovery_build_wire -- --nocapture 2>&1 | tee build/recovery-regression/wasm-runtime.log || result=1
          cargo check --locked -p clearra-wasm --target wasm32-unknown-unknown 2>&1 | tee build/recovery-regression/wasm-target.log || result=1
          exit "$result"
      - name: UI contracts and real browser field regression
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/recovery-regression
          result=0
          node --test scripts/tools/clearra-build-policy.test.mjs 2>&1 | tee build/recovery-regression/build-policy.log || result=1
          node packages/clearra-ui/scripts/prepare-test-dependencies.mjs 2>&1 | tee build/recovery-regression/ui-prepare.log || result=1
          node --test packages/clearra-ui/test/recoveryBuild*.test.mjs packages/clearra-ui/test/boundaryRecoverySurface.test.mjs 2>&1 | tee build/recovery-regression/ui-unit.log || result=1
          pnpm --filter @clearra/ui exec tsc --noEmit -p tsconfig.contract.json 2>&1 | tee build/recovery-regression/ui-types.log || result=1
          node scripts/tools/recovery-build-browser-regression.mjs 2>&1 | tee build/recovery-regression/browser.log || result=1
          node scripts/tools/recovery-workspace-browser-acceptance.mjs 2>&1 | tee build/recovery-regression/workspace-browser.log || result=1
          node scripts/tools/v081-accelerator-opfs-browser-acceptance.mjs 2>&1 | tee build/recovery-regression/v081-opfs-browser.log || result=1
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-build-regression-results
          path: |
            build/recovery-regression
            ${{ runner.temp }}/clearra-recovery-workspace-acceptance
          if-no-files-found: ignore
          retention-days: 7
