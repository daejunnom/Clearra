name: Recovery multistage locked JS inputs
on:
  push:
    branches: [codex/recovery-multistage-toolchain-20260929]
    paths: [.github/workflows/recovery-multistage-js-inputs.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b781f6b6ef1c9ce27e0430f87663a92508e1cb7d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false
      - name: Resolve locked dependencies only
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Package explicitly allowlisted dependency trees and Node executable
        shell: bash
        run: |
          set -euo pipefail
          out=_local/artifacts/test/recovery-js-inputs
          mkdir -p "$out"
          git diff --exit-code
          python3 - <<'PY'
          import pathlib,tarfile
          root=pathlib.Path('.')
          allowed=[root/'node_modules']
          for base in ['packages','apps']:
              allowed.extend(sorted((root/base).glob('*/node_modules')))
          with tarfile.open('_local/artifacts/test/recovery-js-inputs/dependencies.tar.gz','w:gz',compresslevel=1) as t:
              for p in allowed:
                  if p.is_dir():t.add(p,arcname=str(p),recursive=True)
          PY
          cp "$(command -v node)" "$out/node"
          node --version > "$out/node-version.txt"
          git rev-parse HEAD > "$out/source-sha.txt"
          sha256sum "$out/dependencies.tar.gz" "$out/node" > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-multistage-js-inputs
          path: _local/artifacts/test/recovery-js-inputs/
          compression-level: 0
          retention-days: 3
