name: Recovery chain pinned offline tools

on:
  push:
    branches: [codex/recovery-chain-tooling-20260929-c1]
    paths: [.github/workflows/recovery-chain-tooling.yml]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b781f6b6ef1c9ce27e0430f87663a92508e1cb7d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Prepare the exact compiler and committed dependency graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b781f6b6ef1c9ce27e0430f87663a92508e1cb7d
          rustup show
          cargo fetch --locked
          git diff --exit-code -- Cargo.lock
          mkdir -p _local/artifacts/test/chain-offline-tools
          rustc --version > _local/artifacts/test/chain-offline-tools/rust-version.txt
          cargo --version > _local/artifacts/test/chain-offline-tools/cargo-version.txt
          node --version > _local/artifacts/test/chain-offline-tools/node-version.txt
      - name: Package only public toolchain and crate download stores
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/_local/artifacts/test/chain-offline-tools"
          toolchain="$(rustc --print sysroot)"
          # Explicit allowlists: never package Cargo credentials, git config,
          # environment files, tokens, or the runner's home directory.
          tar -czf "$out/rust-toolchain.tar.gz" -C "$toolchain" bin lib libexec share
          tar -czf "$out/cargo-registry.tar.gz" -C "$HOME/.cargo" registry/index registry/cache registry/src
          tar -czf "$out/node.tar.gz" -C "$(dirname "$(dirname "$(command -v node)")")" bin lib include share
          (cd "$out" && sha256sum *.tar.gz > SHA256SUMS)
          du -h "$out"/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-chain-pinned-offline-tools
          path: _local/artifacts/test/chain-offline-tools/
          compression-level: 0
          retention-days: 3
