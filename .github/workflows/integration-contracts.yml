name: Integration Contracts (Non-publishing)

on:
  push:
    branches: ["codex/v0.9.0-stacked-on-v0.8.1-20260912"]
  workflow_dispatch:
    inputs:
      preview_wasm:
        description: Build an unqualified WASM for local 4194 review only
        type: boolean
        default: false
      pc4_native_http2:
        description: Compile the opt-in native persistent HTTP/2 transport candidate
        type: boolean
        default: false
      pc4_native_http2_live_ab:
        description: Run the explicit public-HF qualification-to-graph connection reuse A/B
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: integration-contracts-${{ github.ref }}
  cancel-in-progress: true

# Test results only: no release receipts, accepted artifacts or deployment.
jobs:
  source:
    if: github.ref == 'refs/heads/codex/v0.9.0-stacked-on-v0.8.1-20260912' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check exact source and isolated authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/codex/v0.9.0-stacked-on-v0.8.1-20260912' && "$GITHUB_REF_TYPE" == 'branch' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          node --test scripts/release/integration-contracts-workflow.test.mjs
          node --test scripts/tools/cargo-jobserver-stdio.test.mjs
          node --test scripts/tools/rust-test-evidence.test.mjs
          node --test scripts/release/pc4/discover-upstream-generation.test.mjs scripts/release/pc4/qualify-upstream-generation.test.mjs scripts/release/pc4/pc4-range-reader.test.mjs
          node --test scripts/release/pc4/pc4-download.test.mjs
          node --test scripts/release/pc4/pc4-local-reader.test.mjs

  native-cli:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build native archive and execute real CLI process tests
        shell: pwsh
        run: |
          & ./scripts/tools/invoke-clearra-build.ps1 -Purpose experiment -Command pwsh -ArgumentsJson '["-NoProfile","-File","scripts/tools/check-native-cli-contracts.ps1","-ExecutionSurface","Trusted","-FetchDependencies"]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  pc4-contracts:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify materializer, graph paths and App contracts
        shell: pwsh
        run: |
          & ./scripts/tools/invoke-clearra-build.ps1 -Purpose experiment -Command node -ArgumentsJson '["scripts/tools/check-pc4-app-contracts.mjs","--row-normalization","--fetch"]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native-http2-candidate:
    needs: source
    if: inputs.pc4_native_http2 == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[pc4-http2-ab]'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve the locked candidate dependency graph
        shell: pwsh
        run: |
          & ./scripts/tools/invoke-clearra-build.ps1 -Purpose experiment -Command cargo -ArgumentsJson '["fetch","--locked"]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and test the persistent native HTTP/2 owner
        shell: pwsh
        run: |
          & ./scripts/tools/invoke-clearra-build.ps1 -Purpose experiment -Command cargo -ArgumentsJson '["test","--locked","--offline","-p","clearra-cli","--features","native-pc4-libcurl","--lib","native_pool_","-j","2","--","--test-threads=1"]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native-http2-live-ab:
    needs: source
    if: inputs.pc4_native_http2_live_ab == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_MIN_STACK: "16777216"
      CLEARRA_PC4_HTTP_LIVE_AB: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve the locked candidate dependency graph
        shell: pwsh
        run: |
          & ./scripts/tools/invoke-clearra-build.ps1 -Purpose experiment -Command cargo -ArgumentsJson '["fetch","--locked"]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure qualification-to-graph HTTP/2 connection reuse
        shell: pwsh
        run: |
          & ./scripts/tools/invoke-clearra-build.ps1 -Purpose experiment -Command cargo -ArgumentsJson '["test","--locked","--offline","-p","clearra-cli","--features","native-pc4-libcurl","--lib","native_pool_live_qualification_reuses_connection_for_graph_range","-j","2","--","--ignored","--nocapture","--test-threads=1"]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  surface-contracts:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact selected workspace dependencies without lifecycle builds
        run: npm ci --ignore-scripts --no-audit --no-fund --workspace ctk3 --workspace @clearra/ui --workspace @clearra/discord-bot --workspace @clearra/web --include-workspace-root
      - name: Build this source's CTK exports
        shell: pwsh
        run: |
          & ./scripts/tools/invoke-clearra-build.ps1 -Purpose experiment -Command node -ArgumentsJson '["packages/ctk3/scripts/build.mjs"]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify PC and Build result surfaces
        run: >-
          node scripts/tools/run-focused-js-tests.mjs
          apps/clearra-discord-bot/test/typed-product-result.test.mjs
          apps/clearra-discord-bot/test/capability-registry.test.mjs
          packages/clearra-ui/test/coveragePortfolioExportSource.test.mjs
          packages/clearra-ui/test/buildProbabilityAggregation.test.mjs
          packages/clearra-ui/test/buildV2Model.contract.ts
          packages/clearra-ui/test/pcPathReplayRenderParity.test.mjs
          packages/clearra-ui/test/pcReplayPagerSurface.test.mjs
          packages/clearra-ui/test/pcPathReplayGif.contract.ts
          packages/clearra-ui/test/pcReplayPager.contract.ts
          packages/clearra-ui/test/runtimeShellI18n.test.mjs
          apps/clearra-web/test/onlinePc4Host.test.mjs
          apps/clearra-web/test/pc4HostTypes.test.mjs
          apps/clearra-web/test/pc4LocalStore.test.mjs
          apps/clearra-web/test/tablebaseWarmupLifetime.test.mjs
          apps/clearra-web/test/LocalSearchProfile.contract.ts

  preview-wasm:
    needs: source
    if: inputs.preview_wasm == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[preview-wasm]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUST_MIN_STACK: "16777216"
      CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
      CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare isolated preview toolchain
        shell: pwsh
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          . ./scripts/lib/clearra-execution-surface.ps1
          Assert-ClearraTrustedExecutionSurface -TaskName 'IntegrationPreviewWasm' -ExecutionSurface Trusted -RuntimeEnvironment wasm
          rustup target add wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/tools/invoke-clearra-build.ps1 -Purpose experiment -Command cargo -ArgumentsJson '["install","wasm-bindgen-cli","--version","0.2.126","--locked"]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build exact-source development WASM once
        id: preview
        shell: pwsh
        run: |
          . ./scripts/lib/clearra-path-helpers.ps1
          Ensure-ClearraBuildArtifactCache -RepositoryRoot $env:GITHUB_WORKSPACE -Purpose experiment
          try {
            $previewOutput = Join-Path $env:CLEARRA_BUILD_TRANSACTION_ROOT 'unqualified-preview-wasm'
            & node scripts/tools/build-clearra-wasm.mjs --environment native --destination $previewOutput
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "artifact_path=$previewOutput" >> $env:GITHUB_OUTPUT
            Complete-ClearraBuildTransaction
          } finally {
            Exit-ClearraBuildArtifactCacheUsage
          }
      - name: Upload local-review bytes without release authority
        uses: actions/upload-artifact@v4
        with:
          name: unqualified-integration-preview-wasm-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.preview.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 2
