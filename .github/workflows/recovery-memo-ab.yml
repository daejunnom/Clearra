name: Recovery exact memo A-B

on:
  push:
    branches: [codex/recovery-memo-ab-20260929]
    paths: [.github/workflows/recovery-memo-ab.yml]

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BASE: 53757c6c4a4d5ba6e1832dbd431123bbd0531a96
      REPORT: _local/artifacts/test/recovery-memo-ab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53757c6c4a4d5ba6e1832dbd431123bbd0531a96
          fetch-depth: 1
          persist-credentials: false
      - name: Bind the immutable source and add independent differential cases
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse HEAD:crates/clearra-forward-search/src/recovery_build/staged/solver.rs)" = 6353e74ed9e198ab9102ac253ae447bd7ec51d7c
          rustup show
          mkdir -p "$REPORT"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/clearra-forward-search/src/recovery_build/staged/tests.rs')
          with p.open('a') as f:
            f.write(r'''

          #[test]
          fn recovery_build_staged_memo_repeated_tokens_keep_origin_and_witness() {
              for count in [2_usize, 3] {
                  let mut q = query();
                  let columns = (0..count).fold(0_u64, |m, x| m | (1 << (2 * x)));
                  q.fields.middle = mask((0..4).fold(0, |m, y| m | (columns << (10 * y))));
                  q.fields.result = mask((0..count * 2).fold(0, |m, y| m | (0x300 << (10 * y))));
                  q.first_supply = if count == 2 { "[IO][IO]" } else { "[IO]I[IO]" }.into();
                  q.second_supply = if count == 2 { "[IO][IO]" } else { "[IO]O[IO]" }.into();
                  for hold in [false, true] {
                      for exchange in [false, true] {
                          for early in [CrossStageEarlyLimit::Auto, CrossStageEarlyLimit::AtMost(1)] {
                              q.hold_enabled = hold;
                              q.allow_piece_exchange = exchange;
                              q.early_limit = early;
                              // compare checks EVERY original input pair against
                              // the independent fixed-queue forward solver. It
                              // also checks original token IDs and real replay.
                              compare(q.clone());
                          }
                      }
                  }
              }
          }

          #[test]
          #[ignore = "bounded managed A/B, not a full-population acceptance"]
          fn recovery_build_memo_fixture_ab() {
              let control = ExecutionControl::default();
              for start in [0_usize, 1152, 2496] {
                  for exchange in [false, true] {
                      let mut q = query();
                      q.fields.height = 10;
                      q.fields.initial = mask(0xc0383f3fc7);
                      q.fields.middle = mask(0x3ff3fc7c0c038);
                      // Engine coordinates: the UI independently lowers the
                      // unchanged shared-frame screenshot by its five clears.
                      q.fields.result = mask(0x30483f07f3f8f);
                      q.first_supply = "P7".into();
                      q.second_supply = "P7".into();
                      q.preserve_b2b = true;
                      q.allow_piece_exchange = exchange;
                      let p = PreparedPopulation::new(q.clone()).unwrap();
                      let now = std::time::Instant::now();
                      let geometry = Geometry::new(&q, &control).unwrap();
                      let mut b = Block::new(&p, geometry, start, 32, 3, &control).unwrap();
                      while !b.advance(&control).unwrap() {}
                      let states = b.solver.states;
                      let (report, geometry) = b.finish(&p, &control).unwrap();
                      assert_eq!(report.counts.iter().sum::<u128>(), 32 * 5040);
                      eprintln!("memo_ab start={start} exchange={exchange} counts={:?} states={states} geometry_queries={} elapsed_ms={}", report.counts, geometry.lock_queries, now.elapsed().as_millis());
                  }
              }
          }
          ''')
          PY
          cargo fmt --all
          cargo build --locked --release -p clearra-manage
      - name: Baseline on three disjoint original-fixture shards
        run: |
          set -euo pipefail
          cargo test --locked --release -p clearra-forward-search recovery_build_memo_fixture_ab --no-run
          build/cargo/default/release/clearra-manage runtime run --producer recovery-memo-baseline --profile benchmark-search --timeout 420 -- cargo test --locked --release -p clearra-forward-search recovery_build_memo_fixture_ab -- --ignored --nocapture --test-threads=1 2>&1 | tee "$REPORT/baseline.log"
      - name: Apply the reviewed memo-key-only quotient
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/clearra-forward-search/src/recovery_build/staged/solver.rs')
          s=p.read_text()
          replacements={
            'self.memo.get(&key)': 'self.memo.get(&self.memo_key(key))',
            'self.memo.insert(key, value);': 'self.memo.insert(self.memo_key(key), value);',
            'self.memo.get(&action.child)': 'self.memo.get(&self.memo_key(action.child))',
          }
          for before,after in replacements.items():
              assert s.count(before)==1, (before,s.count(before))
              s=s.replace(before,after)
          marker='    fn remember(&mut self, key: Key, value: Id) -> Result<(), Error> {'
          assert s.count(marker)==1
          method='''    /// Memoize future coverage, not a replay's past token numbering.
              /// The exact index is observed by search only through its source
              /// side; the live Key and Map::Place retain it for witness replay.
              /// When cross-kind repayment is allowed, exchange balance is an
              /// output metric, not a remaining acceptance condition. Keep the
              /// per-target inventories (caps), board, clear history, B2B, unread
              /// languages, depth, hold permission and early quota unchanged.
              fn memo_key(&self, mut key: Key) -> Key {
                  let origin = |token: Token| Token {
                      index: if token.index < self.source.first_len {
                          0
                      } else {
                          self.source.first_len
                      },
                      ..token
                  };
                  key.active = key.active.map(origin);
                  key.hold = key.hold.map(origin);
                  if self.query.allow_piece_exchange {
                      key.exchange = [0; 7];
                  }
                  key
              }
          '''
          p.write_text(s.replace(marker,method+marker))
          PY
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          git diff --binary > "$REPORT/reviewed-candidate.patch"
      - name: Exact fixed-oracle, repeated-token and serial-parallel regressions
        run: |
          set -euo pipefail
          cargo test --locked -p clearra-forward-search recovery_build -- --nocapture 2>&1 | tee "$REPORT/core.log"
          cargo test --locked -p clearra-cli-command --test recovery_build -- --nocapture 2>&1 | tee "$REPORT/cli.log"
          cargo test --locked -p clearra-wasm --test recovery_build_wire -- --nocapture 2>&1 | tee "$REPORT/wasm-runtime.log"
          cargo check --locked -p clearra-wasm --target wasm32-unknown-unknown 2>&1 | tee "$REPORT/wasm-target.log"
      - name: Candidate on identical shards and resources
        run: |
          set -euo pipefail
          cargo test --locked --release -p clearra-forward-search recovery_build_memo_fixture_ab --no-run
          build/cargo/default/release/clearra-manage runtime run --producer recovery-memo-candidate --profile benchmark-search --timeout 420 -- cargo test --locked --release -p clearra-forward-search recovery_build_memo_fixture_ab -- --ignored --nocapture --test-threads=1 2>&1 | tee "$REPORT/candidate.log"
          python3 - <<'PY'
          import json,os,pathlib,re
          root=pathlib.Path(os.environ['REPORT'])
          pattern=r'memo_ab start=(\d+) exchange=(true|false) counts=\[(\d+), (\d+), (\d+)\] states=(\d+) geometry_queries=(\d+) elapsed_ms=(\d+)'
          def load(name):
              found=re.findall(pattern,(root/name).read_text())
              assert len(found)==6, (name,len(found))
              return {(int(r[0]),r[1]): {'counts':list(map(int,r[2:5])), 'states':int(r[5]), 'geometry_queries':int(r[6]), 'ms':int(r[7])} for r in found}
          a,b=load('baseline.log'),load('candidate.log')
          assert a.keys()==b.keys()
          result=[]
          for key in a:
              assert a[key]['counts']==b[key]['counts'],key
              result.append({'start':key[0],'exchange':key[1]=='true','baseline':a[key],'candidate':b[key]})
          (root/'comparison.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Preserve a lock-free source proposal for review, never update main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          repo='daejunnom/Clearra';base=os.environ['BASE'];root=pathlib.Path(os.environ['REPORT'])
          paths=['crates/clearra-forward-search/src/recovery_build/staged/solver.rs','crates/clearra-forward-search/src/recovery_build/staged/tests.rs']
          actual=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert sorted(actual)==sorted(paths), actual
          def api(route,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+route,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          source=api('/git/commits/'+base);entries=[]
          for path in paths:
              content=pathlib.Path(path).read_bytes()
              blob=api('/git/blobs',{'content':base64.b64encode(content).decode(),'encoding':'base64'})
              assert blob['sha']==subprocess.check_output(['git','hash-object',path],text=True).strip()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('/git/trees',{'base_tree':source['tree']['sha'],'tree':entries})
          commit=api('/git/commits',{'message':'perf(recovery): share future coverage without losing original replay tokens\n\nNormalize consumed token positions to their source side only in memo keys. Ignore repayment balance in memo keys only when cross-kind repayment is permitted. Preserve all live trace tokens and every geometry, source-language, inventory, B2B and early-limit condition.\n\nCompared every input pair with the independent fixed solver in repeated-token fixtures; retain a bounded original-fixture shard A/B. No budget, worker, timeout or pruning changes.','tree':tree['sha'],'parents':[base]})
          api('/git/refs',{'ref':'refs/heads/codex/recovery-memo-proposal-20260929','sha':commit['sha']})
          result={'base':base,'proposal':commit['sha'],'tree':tree['sha'],'files':entries,'main_updated':False}
          (root/'proposal.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-memo-ab
          path: |
            _local/artifacts/test/recovery-memo-ab/
            _local/state/receipts/
          if-no-files-found: warn
          retention-days: 14
