name: Publish GUI to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      accepted_sha:
        description: Exact main commit that already passed canonical ReleaseAcceptance
        required: true
        type: string
      rollback_snapshot_sha:
        description: Exact Pages source active before this deployment
        required: true
        type: string
      rollback_capture_run_id:
        description: Successful Pages rollback capture workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  accepted-source:
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      accepted_run_id: ${{ steps.accepted_run.outputs.accepted_run_id }}
      accepted_run_attempt: ${{ steps.accepted_run.outputs.accepted_run_attempt }}
      rollback_report_artifact_id: ${{ steps.rollback-report.outputs.report_artifact_id }}
      rollback_report_artifact_name: ${{ steps.rollback-report.outputs.report_artifact_name }}
      rollback_report_artifact_digest: ${{ steps.rollback-report.outputs.report_artifact_digest }}
      rollback_capture_artifact_name: ${{ steps.rollback-authority.outputs.capture_artifact_name }}
      rollback_capture_tar_sha256: ${{ steps.rollback-authority.outputs.capture_tar_sha256 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_sha }}
          fetch-depth: 0
      - name: Verify exact main and canonical acceptance identity
        id: accepted_run
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.accepted_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Pages accepted SHA must be a full lowercase commit ID' >&2
            exit 2
          fi
          checked_sha="$(git rev-parse HEAD)"
          if [[ "$checked_sha" != "$EXPECTED_SHA" ]]; then
            echo 'Pages checkout differs from requested accepted SHA' >&2
            exit 2
          fi
          git fetch --no-tags --depth=1 origin main
          if [[ "$(git rev-parse origin/main)" != "$checked_sha" ]]; then
            echo 'Pages source must be the exact current main commit' >&2
            exit 2
          fi
          node scripts/release/canonical-acceptance-run.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$checked_sha" \
            --require one \
            --format github-output >> "$GITHUB_OUTPUT"
      - name: Resolve sealed rollback capture report before Pages build
        id: rollback-report
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_AUTHORITY_MODE: resolve-forward
          AUTHORITY_SHA: ${{ inputs.accepted_sha }}
          SNAPSHOT_SHA: ${{ inputs.rollback_snapshot_sha }}
          CAPTURE_RUN_ID: ${{ inputs.rollback_capture_run_id }}
        run: node scripts/release/pages-rollback-authority.mjs
      - name: Download sealed rollback capture report before Pages build
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.rollback-report.outputs.report_artifact_name }}
          path: rollback-report-initial
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rollback_capture_run_id }}
      - name: Verify durable rollback capture before Pages build
        id: rollback-authority
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_AUTHORITY_MODE: forward
          PAGES_AUTHORITY_PHASE: initial
          AUTHORITY_SHA: ${{ inputs.accepted_sha }}
          SNAPSHOT_SHA: ${{ inputs.rollback_snapshot_sha }}
          CURRENT_PAGES_SHA: ${{ inputs.rollback_snapshot_sha }}
          CAPTURE_RUN_ID: ${{ inputs.rollback_capture_run_id }}
          CAPTURE_REPORT_PATH: rollback-report-initial/pages-rollback-capture-authority.json
          CAPTURE_REPORT_ARTIFACT_ID: ${{ steps.rollback-report.outputs.report_artifact_id }}
          CAPTURE_REPORT_ARTIFACT_NAME: ${{ steps.rollback-report.outputs.report_artifact_name }}
          CAPTURE_REPORT_ARTIFACT_DIGEST: ${{ steps.rollback-report.outputs.report_artifact_digest }}
          RESTORE_AUTHORIZATION: ""
        run: node scripts/release/pages-rollback-authority.mjs
      - name: Download durable rollback capture before Pages build
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.rollback-authority.outputs.capture_artifact_name }}
          path: rollback-capture-initial
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rollback_capture_run_id }}
      - name: Verify exact rollback package before Pages build
        env:
          SNAPSHOT_SHA: ${{ inputs.rollback_snapshot_sha }}
          SNAPSHOT_TAR_SHA256: ${{ steps.rollback-authority.outputs.capture_tar_sha256 }}
          PAGES_ROLLBACK_PACKAGE_DIR: rollback-capture-initial
          PAGES_ROLLBACK_CAPTURE_REPORT_PATH: rollback-report-initial/pages-rollback-capture-authority.json
        run: node scripts/release/pages-rollback-package.mjs

  build:
    needs: accepted-source
    outputs:
      pages_artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact accepted Pages build
        uses: actions/download-artifact@v4
        with:
          name: accepted-pages-build-${{ inputs.accepted_sha }}-run-${{ needs.accepted-source.outputs.accepted_run_id }}-attempt-${{ needs.accepted-source.outputs.accepted_run_attempt }}
          path: apps/clearra-web/build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.accepted-source.outputs.accepted_run_id }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify exact accepted Pages build
        env:
          EXPECTED_SHA: ${{ inputs.accepted_sha }}
          ACCEPTED_RUN_ID: ${{ needs.accepted-source.outputs.accepted_run_id }}
          ACCEPTED_RUN_ATTEMPT: ${{ needs.accepted-source.outputs.accepted_run_attempt }}
          EXPECTED_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          node scripts/release/accepted-pages-build.mjs \
            --verify apps/clearra-web/build \
            --source-commit "$EXPECTED_SHA" \
            --accepted-run-id "$ACCEPTED_RUN_ID" \
            --accepted-run-attempt "$ACCEPTED_RUN_ATTEMPT" \
            --base-path "$EXPECTED_BASE_PATH" \
            --version "$(node scripts/release/validate-release-metadata.mjs)"
      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/clearra-web/build

  deploy:
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [accepted-source, build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_sha }}
          path: authority-source
      - name: Revalidate accepted source immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.accepted_sha }}
          ACCEPTED_RUN_ID: ${{ needs.accepted-source.outputs.accepted_run_id }}
          ACCEPTED_RUN_ATTEMPT: ${{ needs.accepted-source.outputs.accepted_run_attempt }}
        shell: bash
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$EXPECTED_SHA" ]]; then
            echo 'Pages source is no longer the exact current main commit' >&2
            exit 2
          fi
          node authority-source/scripts/release/canonical-acceptance-run.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$EXPECTED_SHA" \
            --require one \
            --expected-run-id "$ACCEPTED_RUN_ID" \
            --expected-run-attempt "$ACCEPTED_RUN_ATTEMPT"
      - name: Redownload durable rollback capture immediately before deployment
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.accepted-source.outputs.rollback_capture_artifact_name }}
          path: rollback-capture-predeploy
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rollback_capture_run_id }}
      - name: Redownload sealed rollback capture report immediately before deployment
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.accepted-source.outputs.rollback_report_artifact_name }}
          path: rollback-report-predeploy
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rollback_capture_run_id }}
      - name: Revalidate exact rollback package immediately before deployment
        env:
          SNAPSHOT_SHA: ${{ inputs.rollback_snapshot_sha }}
          SNAPSHOT_TAR_SHA256: ${{ needs.accepted-source.outputs.rollback_capture_tar_sha256 }}
          PAGES_ROLLBACK_PACKAGE_DIR: rollback-capture-predeploy
          PAGES_ROLLBACK_CAPTURE_REPORT_PATH: rollback-report-predeploy/pages-rollback-capture-authority.json
        run: node authority-source/scripts/release/pages-rollback-package.mjs
      - name: Revalidate durable rollback capture immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_AUTHORITY_MODE: forward
          PAGES_AUTHORITY_PHASE: predeploy
          AUTHORITY_SHA: ${{ inputs.accepted_sha }}
          SNAPSHOT_SHA: ${{ inputs.rollback_snapshot_sha }}
          CURRENT_PAGES_SHA: ${{ inputs.rollback_snapshot_sha }}
          CAPTURE_RUN_ID: ${{ inputs.rollback_capture_run_id }}
          CAPTURE_REPORT_PATH: rollback-report-predeploy/pages-rollback-capture-authority.json
          CAPTURE_REPORT_ARTIFACT_ID: ${{ needs.accepted-source.outputs.rollback_report_artifact_id }}
          CAPTURE_REPORT_ARTIFACT_NAME: ${{ needs.accepted-source.outputs.rollback_report_artifact_name }}
          CAPTURE_REPORT_ARTIFACT_DIGEST: ${{ needs.accepted-source.outputs.rollback_report_artifact_digest }}
          RESTORE_AUTHORIZATION: ""
        run: node authority-source/scripts/release/pages-rollback-authority.mjs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Seal deployed Pages authority from API and public readback
        id: deployment-authority
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_DEPLOYMENT_MODE: forward
          SOURCE_COMMIT: ${{ inputs.accepted_sha }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages
          EXPECTED_ACCEPTED_RUN_ID: ${{ needs.accepted-source.outputs.accepted_run_id }}
          EXPECTED_ACCEPTED_RUN_ATTEMPT: ${{ needs.accepted-source.outputs.accepted_run_attempt }}
          EXPECTED_BASE_PATH: /${{ github.event.repository.name }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PAGES_AUTHORITY_REPORT_PATH: ${{ runner.temp }}/pages-deployment-authority.json
        run: node authority-source/scripts/release/pages-deployment-authority.mjs
      - name: Upload sealed Pages deployment authority
        uses: actions/upload-artifact@v4
        with:
          name: clearra-pages-deployment-authority-${{ inputs.accepted_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-deployment-authority.json
          if-no-files-found: error
          retention-days: 90
