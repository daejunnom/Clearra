name: Publish GUI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/Clearra/build/cargo-target-wasm
          key: pages-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-bindgen-0.2.126
      - name: Prepare Rust WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          if ! command -v wasm-bindgen >/dev/null || [[ "$(wasm-bindgen --version)" != "wasm-bindgen 0.2.126" ]]; then
            cargo install wasm-bindgen-cli --version 0.2.126 --locked
          fi
      - name: Install GUI dependencies
        run: npm ci --ignore-scripts
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build GUI
        env:
          CLEARRA_WEB_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build --workspace apps/clearra-web
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/clearra-web/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
