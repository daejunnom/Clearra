name: Publish GUI to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      accepted_sha:
        description: Exact main commit that already passed canonical ReleaseAcceptance
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  accepted-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_sha }}
          fetch-depth: 0
      - name: Verify exact main and canonical acceptance identity
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.accepted_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Pages accepted SHA must be a full lowercase commit ID' >&2
            exit 2
          fi
          checked_sha="$(git rev-parse HEAD)"
          if [[ "$checked_sha" != "$EXPECTED_SHA" ]]; then
            echo 'Pages checkout differs from requested accepted SHA' >&2
            exit 2
          fi
          git fetch --no-tags --depth=1 origin main
          if [[ "$(git rev-parse origin/main)" != "$checked_sha" ]]; then
            echo 'Pages source must be the exact current main commit' >&2
            exit 2
          fi
          accepted="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-cli.yml/runs" \
            -f event=workflow_dispatch \
            -f status=success \
            -f head_sha="$checked_sha" \
            -f per_page=1 \
            --jq '.workflow_runs | length')"
          if [[ "$accepted" -lt 1 ]]; then
            echo 'Pages source has no successful canonical workflow_dispatch acceptance run' >&2
            exit 2
          fi

  build:
    needs: accepted-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/Clearra/build/cargo-target-wasm
          key: pages-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-bindgen-0.2.126
      - name: Prepare Rust WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          if ! command -v wasm-bindgen >/dev/null || [[ "$(wasm-bindgen --version)" != "wasm-bindgen 0.2.126" ]]; then
            cargo install wasm-bindgen-cli --version 0.2.126 --locked
          fi
      - name: Install GUI dependencies
        run: npm ci --ignore-scripts
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build GUI
        env:
          CLEARRA_WEB_BASE_PATH: /${{ github.event.repository.name }}
          CLEARRA_SOURCE_COMMIT: ${{ inputs.accepted_sha }}
          CLEARRA_ENGINE_BUILD_ID: ${{ inputs.accepted_sha }}
        run: npm run build --workspace apps/clearra-web
      - name: Stamp exact accepted build identity
        env:
          CLEARRA_SOURCE_COMMIT: ${{ inputs.accepted_sha }}
          CLEARRA_ENGINE_BUILD_ID: ${{ inputs.accepted_sha }}
        run: |
          for manifest in \
            apps/clearra-web/static/wasm/clearra_wasm.manifest.json \
            apps/clearra-web/build/wasm/clearra_wasm.manifest.json; do
            jq -e --arg sha "$CLEARRA_SOURCE_COMMIT" '
              .build.runtime_identity.source_commit == $sha and
              .build.runtime_identity.engine_build_id == $sha and
              .build.runtime_identity.contract_schema_version == "clearra.search.contract.v2" and
              .build.runtime_identity.supply_semantics_id == "clearra.supply.projected-terminal-lookahead.v1" and
              .build.runtime_identity.artifact_schema_version == "clearra.solution-data.v1"
            ' "$manifest" >/dev/null
          done
          version="$(node scripts/release/validate-release-metadata.mjs)"
          jq -n --arg sourceCommit "$CLEARRA_SOURCE_COMMIT" \
            --arg engineBuildId "$CLEARRA_ENGINE_BUILD_ID" \
            --arg version "$version" \
            '{schema:"clearra.pages.identity.v2",sourceCommit:$sourceCommit,engineBuildId:$engineBuildId,contractSchemaVersion:"clearra.search.contract.v2",supplySemanticsId:"clearra.supply.projected-terminal-lookahead.v1",artifactSchemaVersion:"clearra.solution-data.v1",version:$version}' \
            > apps/clearra-web/build/clearra-build-identity.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/clearra-web/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Revalidate accepted source immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.accepted_sha }}
        shell: bash
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$EXPECTED_SHA" ]]; then
            echo 'Pages source is no longer the exact current main commit' >&2
            exit 2
          fi
          accepted="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-cli.yml/runs" \
            -f event=workflow_dispatch \
            -f status=success \
            -f head_sha="$EXPECTED_SHA" \
            -f per_page=1 \
            --jq '.workflow_runs | length')"
          if [[ "$accepted" -lt 1 ]]; then
            echo 'Pages source no longer has a successful exact-SHA canonical acceptance run' >&2
            exit 2
          fi
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed exact accepted build identity
        env:
          EXPECTED_SHA: ${{ inputs.accepted_sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if body="$(curl --fail --silent --show-error \
              "${PAGE_URL%/}/clearra-build-identity.json?source=${EXPECTED_SHA}")" && \
               manifest="$(curl --fail --silent --show-error \
              "${PAGE_URL%/}/wasm/clearra_wasm.manifest.json?source=${EXPECTED_SHA}")" && \
              jq -e --arg sha "$EXPECTED_SHA" \
                '.schema == "clearra.pages.identity.v2" and
                 .sourceCommit == $sha and .engineBuildId == $sha and
                 .contractSchemaVersion == "clearra.search.contract.v2" and
                 .supplySemanticsId == "clearra.supply.projected-terminal-lookahead.v1" and
                 .artifactSchemaVersion == "clearra.solution-data.v1"' \
                <<<"$body" >/dev/null && \
               jq -e --arg sha "$EXPECTED_SHA" '
                 .build.runtime_identity.source_commit == $sha and
                 .build.runtime_identity.engine_build_id == $sha and
                 .build.runtime_identity.contract_schema_version == "clearra.search.contract.v2" and
                 .build.runtime_identity.supply_semantics_id == "clearra.supply.projected-terminal-lookahead.v1" and
                 .build.runtime_identity.artifact_schema_version == "clearra.solution-data.v1"
               ' <<<"$manifest" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'deployed Pages identity did not converge to the accepted SHA' >&2
          exit 2
