name: v0.8.1 Accelerator Candidate (Non-publishing)

on:
  push:
    branches: ["codex/converge-v081-v090-release-20260923"]
    # Keep source regressions on accelerator changes; management-only and
    # documentation commits do not re-run the already receipted profile work.
    paths:
      - ".github/workflows/v081-accelerator-candidate.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "apps/clearra-web/**"
      - "apps/clearra-discord-bot/Dockerfile.accepted-job-service"
      - "apps/clearra-discord-bot/scripts/provision-v081-accelerators.mjs"
      - "apps/clearra-discord-bot/test/accelerator-image.test.mjs"
      - "apps/clearra-discord-bot/test/job-service.test.mjs"
      - "packages/clearra-ui/**"
      - "tools/clearra-pc4-qualifier/**"
      - "scripts/tools/wsl-conditioned-*-generate.sh"
      - "scripts/tools/wsl-legal-board-generate.sh"
      - "scripts/tools/clearra-build-owner.mjs"
      - "scripts/tools/clearra-build-policy.test.mjs"
      - "scripts/tools/build-clearra-frontend.mjs"
      - "scripts/tools/build-clearra-frontend.test.mjs"
      - "scripts/tools/clearra-frontend-paths.mjs"
      - "scripts/release/accepted-pages-build.mjs"
      - "scripts/release/accepted-pages-build.test.mjs"
      - "config/clearra-management.v1.json"
  workflow_dispatch:
    inputs:
      wasm_smoke:
        description: Build exact branch WASM and inspect accelerator ABI without publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Successive branch candidates supersede older focused checks. The five
  # profile full-family receipts are not regenerated by this workflow.
  group: v081-accelerator-candidate-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.wasm_smoke && 'wasm-smoke' || 'focused' }}
  cancel-in-progress: true

# This branch-only source differential has no release, asset, or deployment
# authority. Remove it before promoting the qualified source to main.
jobs:
  wasm-accelerator-smoke:
    if: github.ref == 'refs/heads/codex/converge-v081-v090-release-20260923' && github.event_name == 'workflow_dispatch' && inputs.wasm_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install pinned Rust and WASM target
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
      - name: Install pinned bindgen under the managed build root
        run: cargo install --locked --version 0.2.126 --root build/tools/cargo/wasm-bindgen-cli/0.2.126 wasm-bindgen-cli
      - name: Build exact branch WASM without publication
        env:
          WASM_BINDGEN: ${{ github.workspace }}/build/tools/cargo/wasm-bindgen-cli/0.2.126/bin/wasm-bindgen
          CLEARRA_SOURCE_COMMIT: ${{ github.sha }}
          CLEARRA_ENGINE_BUILD_ID: ${{ github.sha }}
        run: node scripts/tools/build-clearra-wasm.mjs --environment native
      - name: Check accelerator exports and source-bound manifest
        run: node --test scripts/tools/v081-wasm-accelerator-exports.test.mjs scripts/tools/v081-wasm-conditioned-admission.test.mjs
      - name: Preserve failed nonpublishing WASM smoke for local diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v081-wasm-smoke-failure-${{ github.run_id }}
          path: apps/clearra-web/static/wasm/clearra_wasm*
          if-no-files-found: ignore
          retention-days: 1
  cli-candidate-and-tie-regressions:
    if: github.ref == 'refs/heads/codex/converge-v081-v090-release-20260923' && (github.event_name == 'push' || !inputs.wasm_smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Verify CLI and product formatting
        run: cargo fmt -p clearra-app -p clearra-cli -p clearra-pc4-qualifier -p clearra-accelerator-product-host -p clearra-accelerator-runtime -p clearra-wasm-abi --check
      - name: Verify explicit local relation candidates
        run: |
          cargo test --locked -p clearra-pc4-qualifier --lib conditioned_local_relation_generation::tests --no-default-features --features legal-board-assets
          cargo test --locked -p clearra-pc4-qualifier --lib conditioned_local_coverage_proof --no-default-features --features legal-board-assets
          cargo test --locked -p clearra-pc4-qualifier --lib conditioned_local_candidate_validation::tests --no-default-features --features legal-board-assets
          cargo test --locked -p clearra-cli --lib conditioned_reachability_assets --no-default-features
      - name: Verify final legal-board candidate and CLI status boundaries
        run: |
          cargo test --locked -p clearra-pc4-qualifier --lib final_bundle_and_catalog_are_bound_without_granting_product_authority --no-default-features --features legal-board-assets
          cargo test --locked -p clearra-pc4-qualifier --lib immutable_output_tests --no-default-features --features legal-board-assets
          cargo test --locked -p clearra-cli --lib status_reports_an_incomplete_v2_candidate_instead_of_ignoring_it --no-default-features
      - name: Verify signed local-relation product and legacy isolation
        run: |
          cargo test --locked -p clearra-accelerator-product-host --bin clearra-accelerator-release-gate
          cargo test --locked -p clearra-accelerator-runtime --lib catalog_scopes_match_the_exact_product_parsers
          cargo test --locked -p clearra-cli --lib local_relation_product_cannot_reuse_the_legacy_sparse_namespace_or_extension --no-default-features
      - name: Verify exact tie continuation and public CLI contracts
        run: |
          cargo test --locked -p clearra-cli --lib tie_snapshot::tests:: --no-default-features
          cargo test --locked -p clearra-cli --lib cli_entry::sequence_dependencies_tests --no-default-features
          cargo test --locked -p clearra-cli --lib commands::verify_command::tests --no-default-features
  exact-reverse-membership:
    if: github.ref == 'refs/heads/codex/converge-v081-v090-release-20260923' && (github.event_name == 'push' || !inputs.wasm_smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Verify source formatting
        run: cargo fmt -p clearra-core-executor -p clearra-pc4-qualifier --check
      - name: Compare every small geometric target with exact reachability
        run: cargo test --locked -p clearra-core-executor --lib exact_forward_membership_matches_every_geometric_target_on_small_fields
      - name: Retain the blocked-roof negative and invalid-input contracts
        run: |
          cargo test --locked -p clearra-core-executor --lib geometric_target_behind_a_narrow_roof_is_not_a_reachable_lock
          cargo test --locked -p clearra-core-executor --lib exact_forward_membership_rejects_the_same_invalid_source_contract
      - name: Compare worker-reused Hydra membership with full target enumeration
        run: |
          cargo test --locked -p clearra-pc4-qualifier --lib reverse_domain_membership_matches_complete_forward_enumeration --no-default-features --features legal-board-assets
          cargo test --locked -p clearra-pc4-qualifier --lib forward_bloom_tests --no-default-features --features legal-board-assets
      - name: Preserve the original reachability contracts
        run: cargo test --locked -p clearra-core-executor --lib backend::wasm_cpu::reachability
      - name: Audit local relation reuse on the actual query board
        run: |
          cargo test --locked -p clearra-core-executor --lib conditioned_local_pack::tests --features qualification-reference
          cargo test --locked -p clearra-core-executor --lib conditioned_local_index::tests --features qualification-reference
          cargo test --locked -p clearra-core-executor --lib conditioned_local_qualification --features qualification-reference
          cargo test --locked -p clearra-core-executor --lib conditioned_local_product::tests --features qualification-reference
          cargo test --locked -p clearra-core-executor --lib solver_context_tests --features qualification-reference
          cargo test --locked -p clearra-core-executor --lib row_frame::tests --features qualification-reference
          cargo test --locked -p clearra-core-executor --lib legal_board::tests --features qualification-reference
      - name: Preserve typed Web accelerator request policy
        run: |
          cargo test --locked -p clearra-wasm-abi --lib accelerator_request_policy_uses_the_typed_default_and_opt_outs
          cargo test --locked -p clearra-wasm-abi --lib accelerator_admission_consumes_staged_transfer_without_a_false_worker_conflict
  web-accelerator-worker-contract:
    if: github.ref == 'refs/heads/codex/converge-v081-v090-release-20260923' && (github.event_name == 'push' || !inputs.wasm_smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The build-owner contract snapshots cargo/rustc versions. Without the
      # pinned components, rustup can change that context during the test.
      - name: Install the pinned Rust toolchain for stable build snapshots
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Bind exact Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          test "$(pnpm --version)" = "11.5.0"
      - name: Install locked frontend dependencies without scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify build snapshot and generated-input exclusion
        run: node --test scripts/tools/clearra-build-policy.test.mjs scripts/tools/build-clearra-frontend.test.mjs scripts/release/accepted-pages-build.test.mjs
      - name: Verify Web worker types and contracts without building WASM
        run: node scripts/tools/build-clearra-frontend.mjs --app web --task test
  discord-immutable-compute-assets:
    if: github.ref == 'refs/heads/codex/converge-v081-v090-release-20260923' && (github.event_name == 'push' || !inputs.wasm_smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Verify version-gated immutable compute assets and job-service contracts
        run: node --test apps/clearra-discord-bot/test/accelerator-image.test.mjs apps/clearra-discord-bot/test/job-service.test.mjs
