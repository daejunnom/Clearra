name: v0.8.1 Accelerator Candidate (Non-publishing)

on:
  push:
    branches: ["codex/converge-v081-v090-release-20260923"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v081-accelerator-candidate-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

# This branch-only source differential has no release, asset, or deployment
# authority. Remove it before promoting the qualified source to main.
jobs:
  cli-candidate-and-tie-regressions:
    if: github.ref == 'refs/heads/codex/converge-v081-v090-release-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Verify CLI and product formatting
        run: cargo fmt -p clearra-app -p clearra-cli -p clearra-pc4-qualifier --check
      - name: Verify explicit local relation candidates
        run: |
          cargo test --locked -p clearra-pc4-qualifier --lib candidate_queries_bind_profile_row_frame_and_independent_audit --no-default-features --features legal-board-assets
          cargo test --locked -p clearra-pc4-qualifier --lib candidate_producer_publishes_only_audited_immutable_files --no-default-features --features legal-board-assets
          cargo test --locked -p clearra-pc4-qualifier --lib conditioned_local_pack_and_catalog_are_bound_but_unqualified --no-default-features --features legal-board-assets
          cargo test --locked -p clearra-cli --lib conditioned_reachability_assets --no-default-features
      - name: Verify final legal-board candidate and CLI status boundaries
        run: |
          cargo test --locked -p clearra-pc4-qualifier --lib final_bundle_and_catalog_are_bound_without_granting_product_authority --no-default-features --features legal-board-assets
          cargo test --locked -p clearra-cli --lib status_reports_an_incomplete_v2_candidate_instead_of_ignoring_it --no-default-features
      - name: Verify exact tie continuation and public CLI contracts
        run: |
          cargo test --locked -p clearra-cli --lib tie_snapshot::tests:: --no-default-features
          cargo test --locked -p clearra-cli --lib cli_entry::sequence_dependencies_tests --no-default-features
          cargo test --locked -p clearra-cli --lib commands::verify_command::tests --no-default-features
  exact-reverse-membership:
    if: github.ref == 'refs/heads/codex/converge-v081-v090-release-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Verify source formatting
        run: cargo fmt -p clearra-core-executor -p clearra-pc4-qualifier --check
      - name: Compare every small geometric target with exact reachability
        run: cargo test --locked -p clearra-core-executor --lib exact_forward_membership_matches_every_geometric_target_on_small_fields
      - name: Retain the blocked-roof negative and invalid-input contracts
        run: |
          cargo test --locked -p clearra-core-executor --lib geometric_target_behind_a_narrow_roof_is_not_a_reachable_lock
          cargo test --locked -p clearra-core-executor --lib exact_forward_membership_rejects_the_same_invalid_source_contract
      - name: Compare worker-reused Hydra membership with full target enumeration
        run: |
          cargo test --locked -p clearra-pc4-qualifier --lib reverse_domain_membership_matches_complete_forward_enumeration --no-default-features --features legal-board-assets
          cargo test --locked -p clearra-pc4-qualifier --lib forward_bloom_tests --no-default-features --features legal-board-assets
      - name: Preserve the original reachability contracts
        run: cargo test --locked -p clearra-core-executor --lib backend::wasm_cpu::reachability
      - name: Audit local relation reuse on the actual query board
        run: |
          cargo test --locked -p clearra-core-executor --lib conditioned_local_pack_tests --features qualification-reference
          cargo test --locked -p clearra-core-executor --lib conditioned_local_qualification --features qualification-reference
