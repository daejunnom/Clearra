name: Recovery zero coverage regression

on:
  push:
    branches: [codex/fix-recovery-zero-coverage-20260928]

permissions:
  contents: read
  actions: read

concurrency:
  group: recovery-zero-coverage-${{ github.sha }}
  cancel-in-progress: false

jobs:
  coordinate-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Coordinate, host, replay and existing UI contracts
        run: |
          set -euo pipefail
          mkdir -p _local/artifacts/test/recovery-result-frame
          node packages/clearra-ui/scripts/prepare-test-dependencies.mjs
          node --test packages/clearra-ui/test/recoveryBuild*.test.mjs packages/clearra-ui/test/recoveryResultFrame.test.mjs packages/clearra-ui/test/boundaryRecoverySurface.test.mjs | tee _local/artifacts/test/recovery-result-frame/unit.log
          pnpm --filter @clearra/ui exec tsc --noEmit -p tsconfig.contract.json
      - uses: actions/download-artifact@v4
        with:
          name: accepted-pages-build-1868d31da7730cc9d3018aecd18e442c6940a5d7-run-36388470463-attempt-1
          path: _local/artifacts/test/recovery-zero/accepted
          github-token: ${{ github.token }}
          repository: daejunnom/Clearra
          run-id: 36388470463
      - name: Prepare pinned real browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "CLEARRA_BROWSER_TOOLS_ROOT=$RUNNER_TEMP/browser-tools" >> "$GITHUB_ENV"
      - name: Reproduce before and after through actual UI and released WASM
        run: node scripts/tools/recovery-result-frame-browser.mjs
      - name: Existing full-workspace browser acceptance
        run: node scripts/tools/recovery-workspace-browser-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-result-frame-regression
          path: |
            _local/artifacts/test/recovery-result-frame/
            ${{ runner.temp }}/clearra-recovery-workspace-acceptance/
          retention-days: 14

  original-full-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node packages/clearra-ui/scripts/prepare-test-dependencies.mjs
      - uses: actions/download-artifact@v4
        with:
          name: accepted-pages-build-1868d31da7730cc9d3018aecd18e442c6940a5d7-run-36388470463-attempt-1
          path: _local/artifacts/test/recovery-zero/accepted
          github-token: ${{ github.token }}
          repository: daejunnom/Clearra
          run-id: 36388470463
      - name: Prepare pinned real browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "CLEARRA_BROWSER_TOOLS_ROOT=$RUNNER_TEMP/browser-tools" >> "$GITHUB_ENV"
      - name: Original full P7/P7 with hold, Auto, repayment and B2B preserved
        env:
          CLEARRA_RECOVERY_FULL_FIXTURE: '1'
        run: node scripts/tools/recovery-result-frame-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-original-full-fixture
          path: _local/artifacts/test/recovery-result-frame/
          retention-days: 14
