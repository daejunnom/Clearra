name: Inspect Live Clearra Pages Surface

on:
  push:
    branches: [codex/clearra-safe-integration-20260925]
    paths: [.github/workflows/clearra-pages-surface-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearra-live-pages-surface-audit
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5387fbaf7a4d6e1063046a330983928239782ca8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Bind runner-owned inspection paths
        shell: bash
        run: |
          echo "BROWSER_ROOT=$RUNNER_TEMP/clearra-pages-browser" >> "$GITHUB_ENV"
          echo "AUDIT_ROOT=$RUNNER_TEMP/clearra-pages-execution-audit" >> "$GITHUB_ENV"
      - name: Install an isolated pinned Chromium inspection tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BROWSER_ROOT" "$AUDIT_ROOT"
          npm install --prefix "$BROWSER_ROOT" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node "$BROWSER_ROOT/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Collect actual runtime identities and CPU versus automatic execution results
        run: node scripts/integration/probe-live-pages-execution-matrix-20260926.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clearra-live-execution-matrix-${{ github.run_id }}
          path: ${{ env.AUDIT_ROOT }}
          if-no-files-found: error
          retention-days: 14
