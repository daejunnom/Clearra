steps:
  - name: node:22.23.2-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9
    id: prepare-command-runtime
    entrypoint: bash
    args:
      - -ceu
      - |
        corepack enable
        corepack prepare pnpm@11.5.0 --activate
        test "$(pnpm --version)" = "11.5.0"
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm --filter ctk3 run build
  - name: node:22.23.2-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9
    id: register-commands
    entrypoint: node
    args:
      - ./apps/clearra-discord-bot/src/register-commands.mjs
    env:
      - DISCORD_APPLICATION_ID=${_DISCORD_APPLICATION_ID}
    secretEnv:
      - DISCORD_TOKEN
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/${_DISCORD_TOKEN_SECRET}/versions/latest
      env: DISCORD_TOKEN
serviceAccount: projects/${PROJECT_ID}/serviceAccounts/${_COMMAND_SYNC_SERVICE_ACCOUNT}
substitutions:
  _DISCORD_APPLICATION_ID: "1533373054309371924"
  _DISCORD_TOKEN_SECRET: discord-bot-token
  _COMMAND_SYNC_SERVICE_ACCOUNT: clearra-command-sync@clearra-cloud.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 300s
