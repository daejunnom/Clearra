[package]
name = "clearra-desktop"
version = "0.7.2"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
clearra-gui-host = { path = "../../../crates/clearra-gui-host", features = ["wasm-cpu-runtime", "webgpu-search"] }
serde_json = "=1.0.145"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[patch.crates-io]
gpu-allocator = { path = "../../../tools/vendor/gpu-allocator" }
wgpu-hal = { path = "../../../tools/vendor/wgpu-hal" }

[lints.rust]
unsafe_code = "forbid"
