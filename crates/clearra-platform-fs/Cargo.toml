[package]
name = "clearra-platform-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
] }

# This is the single, narrow owner of operating-system FFI. Every consumer of
# the crate receives only the safe state-machine facade from `lib.rs`.
[lints.rust]
unsafe_code = "allow"
