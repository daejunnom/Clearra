[package]
name = "clearra-wasm-abi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# The product GUI selects the CPU engine. Keep GPU kernels and their browser
# bindings outside that artifact; experimental callers can opt in explicitly.
webgpu-search = ["clearra-wasm/webgpu-search", "dep:wasm-bindgen-futures"]
stage-profiling = ["clearra-wasm/stage-profiling"]
minimum-hotfix-ab = ["dep:clearra-coverage", "clearra-coverage/minimum-hotfix-ab"]

[dependencies]
clearra-coverage = { path = "../clearra-coverage", optional = true }
clearra-pc-graph = { path = "../clearra-pc-graph" }
clearra-accelerator-product-host = { path = "../clearra-accelerator-product-host" }
clearra-core-executor = { path = "../clearra-core-executor" }
clearra-rules = { path = "../clearra-rules" }
clearra-wasm = { path = "../clearra-wasm" }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }

[lib]
name = "clearra_wasm"
doctest = false
crate-type = ["cdylib"]

# This crate is the scalar/memory export boundary. It contains no pointer
# dereference or unsafe block; stable WebAssembly export names require the
# linkage attribute that the implementation crates intentionally forbid.
