[package]
name = "clearra-core-executor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["placement-dependency-pc"]
native-c-core = ["clearra-core-ffi/native-c-core", "parallel"]
search-stage-profiling = [
    "native-c-core",
    "clearra-core-ffi/search-stage-profiling",
]
wasm-stage-profiling = []
parallel = []
experimental-native-gpu = ["clearra-core-ffi/experimental-native-gpu"]
# Local-only same-binary A/B controls. Product and release builds never enable
# this feature: their layout policy is adaptive and union storage is compact.
local-search-ab = []
# Compile automatic dependency verification for its qualified PC contracts.
# Unsupported products retain their own verifier; no local A/B controls ship.
placement-dependency-pc = []
# Primitive oracle is linked only by local-only asset generation/qualification.
# It is not consulted by product search.
qualification-reference = []

[[example]]
name = "native_rust_cpu_abba"
required-features = ["native-c-core"]

[dependencies]
clearra-accelerator-activation = { path = "../clearra-accelerator-activation" }
clearra-build-coverage = { path = "../clearra-build-coverage" }
clearra-core-domain = { path = "../clearra-core-domain" }
clearra-core-ffi = { path = "../clearra-core-ffi" }
clearra-coverage = { path = "../clearra-coverage" }
clearra-finesse = { path = "../clearra-finesse" }
clearra-geometry = { path = "../clearra-geometry" }
clearra-objectives = { path = "../clearra-objectives" }
clearra-pc-graph = { path = "../clearra-pc-graph" }
clearra-piece-registry = { path = "../clearra-piece-registry" }
clearra-postprocess = { path = "../clearra-postprocess" }
clearra-problem = { path = "../clearra-problem" }
clearra-replay = { path = "../clearra-replay" }
clearra-rules = { path = "../clearra-rules" }
clearra-supply = { path = "../clearra-supply" }
serde_json.workspace = true
sha2 = "0.10.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.126" }

[dev-dependencies]
clearra-accelerator-product-host = { path = "../clearra-accelerator-product-host" }
clearra-core-ffi = { path = "../clearra-core-ffi", features = ["test-support"] }
clearra-fumen = { path = "../clearra-fumen" }
clearra-scoring = { path = "../clearra-scoring" }
ed25519-dalek.workspace = true

[lints]
workspace = true
