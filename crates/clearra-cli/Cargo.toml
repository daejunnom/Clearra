[package]
name = "clearra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[features]
default = []
native-c-core = ["clearra-app/native-c-core"]
wasm-cpu-runtime = ["clearra-app/parallel"]
webgpu-search = ["clearra-app/webgpu-search"]

[[bin]]
name = "clearra"
path = "src/main.rs"
test = false

[[test]]
name = "process_e2e"
path = "tests/process_e2e.rs"
required-features = ["native-c-core"]

[[test]]
name = "terminal_supply_public_contract"
path = "tests/terminal_supply_public_contract.rs"
required-features = ["native-c-core"]

[[test]]
name = "forward_ren_contract"
path = "tests/forward_ren_contract.rs"

[[test]]
name = "canonical_witness_contract"
path = "tests/canonical_witness_contract.rs"
required-features = ["wasm-cpu-runtime"]

[dependencies]
clearra-app = { path = "../clearra-app" }
clearra-build-coverage = { path = "../clearra-build-coverage" }
clearra-core-domain = { path = "../clearra-core-domain" }
clearra-coverage = { path = "../clearra-coverage" }
clearra-fumen = { path = "../clearra-fumen" }
clearra-host-contract = { path = "../clearra-host-contract" }
clearra-i18n = { path = "../clearra-i18n" }
clearra-objectives = { path = "../clearra-objectives" }
clearra-output = { path = "../clearra-output" }
clearra-pc-graph = { path = "../clearra-pc-graph" }
clearra-profiles = { path = "../clearra-profiles" }
clearra-rules = { path = "../clearra-rules" }
clearra-scoring = { path = "../clearra-scoring" }
clearra-setup-search = { path = "../clearra-setup-search" }
clearra-spin-structure-search = { path = "../clearra-spin-structure-search" }
clearra-supply = { path = "../clearra-supply" }
clearra-validation = { path = "../clearra-validation" }
clearra-cli-command = { path = "../clearra-cli-command" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
getrandom = "0.4.3"
sha2 = "0.10.9"

[dev-dependencies]
clearra-problem = { path = "../clearra-problem" }
